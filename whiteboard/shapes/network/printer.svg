  <rect x="30" y="20" width="40" height="10" fill="#9E9E9E" stroke="#616161" stroke-width="1.5"/>
  <!-- Printer body -->
  <rect x="20" y="30" width="60" height="30" fill="#E0E0E0" stroke="#616161" stroke-width="2" rx="3"/>

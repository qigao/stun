<svg width="240" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table border -->
  <rect x="5" y="5" width="230" height="110" fill="none" stroke="#616161" stroke-width="2"/>
  
  <!-- Vertical dividers -->
  <line x1="82" y1="5" x2="82" y2="115" stroke="#616161" stroke-width="1"/>
  <line x1="158" y1="5" x2="158" y2="115" stroke="#616161" stroke-width="1"/>
  
  <!-- Horizontal dividers -->
  <line x1="5" y1="42" x2="235" y2="42" stroke="#616161" stroke-width="2"/>
  <line x1="5" y1="78" x2="235" y2="78" stroke="#616161" stroke-width="1"/>
  
  <!-- Header row background -->
  <rect x="5" y="5" width="77" height="37" fill="#E3F2FD"/>
  <rect x="82" y="5" width="76" height="37" fill="#E3F2FD"/>
  <rect x="158" y="5" width="77" height="37" fill="#E3F2FD"/>
  
  <!-- Cell text -->
  <text x="43" y="27" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_0_0}}</text>
  <text x="120" y="27" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_0_1}}</text>
  <text x="196" y="27" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_0_2}}</text>
  
  <text x="43" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_1_0}}</text>
  <text x="120" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_1_1}}</text>
  <text x="196" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_1_2}}</text>
  
  <text x="43" y="99" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_2_0}}</text>
  <text x="120" y="99" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_2_1}}</text>
  <text x="196" y="99" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#000">{{cell_2_2}}</text>
</svg>

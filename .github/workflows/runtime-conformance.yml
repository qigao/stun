name: Stun runtime conformance

# Focused parser, headless renderer and typed animation checks against published SDKs. Keep normal PR validation
# independent of Mesa source builds and desktop/window runtime qualification.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: stun-runtime-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name != 'ci/full')) && github.run_id || 'qualification' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci/full'
    name: Runtime change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      golden: ${{ steps.gold_scope.outputs.affected }}
      animation: ${{ steps.animation_scope.outputs.affected }}
      measurement: ${{ steps.measurement_scope.outputs.affected }}
      xml_runtime: ${{ steps.xml_scope.outputs.affected }}
      unicode: ${{ steps.unicode_scope.outputs.affected }}
      expression: ${{ steps.expression_scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Detect Flowchart JSON golden changes
        id: gold_scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'charts/mermaid/flowchart/*' 'shared/layout/*' \
            'charts/mermaid/golden/flowchart/*' \
            'tools/lemon/*' '.github/scripts/ci-affected.sh' \
            '.github/scripts/build-re2c-master.sh' \
            '.github/scripts/restore-flowchart-sdk.py' \
            '.github/workflows/salts-sdk-releases.yml' '.github/workflows/runtime-conformance.yml'

      - name: Detect typed animation changes
        id: animation_scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'flexUI/src/box.cpp' 'flexUI/src/render_manager.cpp' \
            'flexUI/src/transition.cpp' 'flexUI/src/style_property_registry.cpp' \
            'flexUI/src/style_property_impact.cpp' \
            'flexUI/include/*' 'flex/include/*' \
            'flexUI/tests/test_typed_animation.cpp' 'flexUI/tests/test_typed_transition.cpp' \
            'flexUI/tests/typed_value_test_support.h' 'flex/tests/cmeta_types_peer.cpp' \
            'flexUI/tests/typed-animation-standalone/*' 'flexUI/CMakeLists.txt' \
            '.github/workflows/salts-sdk-releases.yml' '.github/workflows/runtime-conformance.yml' '.github/scripts/ci-affected.sh'

      - name: Detect headless text measurement changes
        id: measurement_scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'shared/gcanvas/*' 'flex/render/engines/gcanvas/*' \
            'flex/tests/test_gcanvas_renderer.cpp' 'flex/tests/gcanvas-standalone/*' \
            'flex/include/flex/core/renderer.h' 'flexUI/include/flexUI/renderer.h'

      - name: Detect headless XML and Streaming UI runtime changes
        id: xml_scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'flexUI/*' 'flex/*' 'charts/ui/*' 'charts/dotgraph/*' 'shared/markdown/*' 'shared/gcanvas/*' \
            'tango/*' 'tango/src/*' 'tango/include/*' 'tango/tests/*' \
            '.github/workflows/tango-core.yml' \
            'vendor/mir/*' 'vendor/miniblas/*' 'vendor/tinyfsm/*' \
            'tools/lemon/*' 'cmake/Sanitizers.cmake' \
            '.github/scripts/restore-flowchart-sdk.py' '.github/scripts/ci-affected.sh' \
            '.github/actions/setup-ccache/*' '.github/scripts/report-ccache.sh' \
            '.github/workflows/salts-sdk-releases.yml' '.github/workflows/runtime-conformance.yml'

      - name: Detect Unicode text policy changes
        id: unicode_scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'flexUI/src/text_util.cpp' 'flexUI/include/flexUI/text_util.h' \
            'flexUI/src/text_layout.cpp' 'flexUI/src/widgets/input_widget.cpp' \
            'flexUI/src/widgets/textarea_widget.cpp' 'flexUI/tests/test_text_util_unicode.cpp' \
            'flexUI/tests/test_widget_contracts.cpp' 'flexUI/tests/test_text_layout_unicode.cpp' \
            'flexUI/tests/unicode-standalone/*' 'flexUI/tests/CMakeLists.txt' \
            '.github/workflows/salts-sdk-releases.yml' '.github/workflows/runtime-conformance.yml' '.github/scripts/ci-affected.sh'

      - name: Detect Mermaid parser changes
        id: expression_scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'flex/modules/expression/*' 'flex/modules/runtime/expr_c.cpp' \
            'flex/include/flex/core/expr_c.h' 'flex/include/flex/core/expr_mir.h' \
            'flex/include/flex/core/types.h' 'flex/tests/test_expr_c.c' \
            'vendor/mir/*' 'cmake/Sanitizers.cmake' \
            'charts/mermaid/sankey/*' 'charts/mermaid/golden/sankey/*' \
            'charts/mermaid/block/*' 'charts/mermaid/golden/block/*' \
            'charts/mermaid/kanban/*' 'charts/mermaid/golden/kanban/*' \
            'charts/mermaid/journey/*' 'charts/mermaid/golden/journey/*' \
            'charts/mermaid/mindmap/*' 'charts/mermaid/golden/mindmap/*' \
            'charts/mermaid/xychart/*' 'charts/mermaid/golden/xychart/*' \
            'charts/mermaid/quadrant/*' 'charts/mermaid/golden/quadrant/*' \
            'charts/mermaid/sequence/*' 'charts/mermaid/golden/sequence/*' \
            'charts/mermaid/er/*' 'charts/mermaid/golden/er/*' \
            'charts/mermaid/gantt/*' 'charts/mermaid/golden/gantt/*' \
            'charts/mermaid/statediagram/*' 'charts/mermaid/golden/state/*' \
            'charts/mermaid/timeline/*' 'charts/mermaid/golden/timeline/*' \
            'charts/mermaid/classdiagram/*' 'charts/mermaid/golden/class/*' \
            'charts/mermaid/c4/*' 'charts/mermaid/golden/c4/*' \
            'charts/mermaid/tests/expression-standalone/*' \
            '.github/workflows/salts-sdk-releases.yml' '.github/workflows/runtime-conformance.yml' '.github/scripts/ci-affected.sh'

  mermaid-oracle:
    name: Pinned Mermaid semantic evidence (independent of Stun golden)
    needs: changes
    if: needs.changes.outputs.golden == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: charts/mermaid/flowchart/tests/oracle/package-lock.json
      - name: Verify pinned independent semantics without changing fixtures
        working-directory: charts/mermaid/flowchart/tests/oracle
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node verify.mjs "$RUNNER_TEMP/flowchart-mermaid-oracle.json"
          node migrate.mjs
          node generate-json-v2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: flowchart-mermaid-oracle-${{ needs.changes.outputs.source_sha }}
          path: ${{ runner.temp }}/flowchart-mermaid-oracle.json
          if-no-files-found: error

  sdk-releases:
    needs: changes
    if: needs.changes.outputs.golden == 'true' || needs.changes.outputs.animation == 'true' || needs.changes.outputs.measurement == 'true' || needs.changes.outputs.xml_runtime == 'true' || needs.changes.outputs.unicode == 'true' || needs.changes.outputs.expression == 'true'
    uses: ./.github/workflows/salts-sdk-releases.yml

  # Run the installed-SDK AST and exact JSON suite for every applicable
  # update, including mixed changes and explicit ci/full requests.
  golden:
    name: Linux / focused installed-SDK ASan/UBSan
    needs: [changes, sdk-releases]
    if: needs.changes.outputs.golden == 'true' || needs.changes.outputs.animation == 'true' || needs.changes.outputs.measurement == 'true' || needs.changes.outputs.xml_runtime == 'true' || needs.changes.outputs.unicode == 'true' || needs.changes.outputs.expression == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      SALTS_RELEASE: ${{ needs.sdk-releases.outputs.salts_release }}
      SALTS_UTILS_RELEASE: ${{ needs.sdk-releases.outputs.salts_utils_release }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      # The runner context is unavailable in jobs.<job>.env; bind
      # runner-local temp paths after the job starts.
      - name: Define isolated SDK paths
        shell: bash
        run: |
          printf 'SALTS_ROOT=%s/stun-flowchart-native-sdk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PACKAGES_ROOT=%s/stun-flowchart-native-nuget\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact Stun source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Install per-profile native C/C++ compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: runtime-linux
          source_sha: ${{ needs.changes.outputs.source_sha }}

      - name: Verify exact source and resolved releases
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
          test -n "$SALTS_RELEASE" && test -n "$SALTS_UTILS_RELEASE"

      - name: Download exact published native packages with curl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGES_ROOT"
          curl_args=(--fail --silent --show-error --location --retry 3
            --proto '=https' --proto-redir '=https'
            --connect-timeout 15 --max-time 300
            --user "$GITHUB_ACTOR:$GITHUB_TOKEN")
          # Discover the NuGet v3 content endpoint; no managed runtime or
          # dependency source checkout is needed to download native archives.
          curl "${curl_args[@]}" 'https://nuget.pkg.github.com/qigao/index.json' \
            --output "$RUNNER_TEMP/stun-native-package-index.json"
          package_base="$(jq -er '
            [.resources[] | select(."@type" == "PackageBaseAddress/3.0.0") | ."@id"]
            | unique
            | if length == 1 and (.[0] | test("^https://nuget[.]pkg[.]github[.]com/qigao/[A-Za-z0-9/_-]*$"))
              then .[0] else error("Missing or unexpected GitHub Packages content endpoint") end
            ' "$RUNNER_TEMP/stun-native-package-index.json")"
          download_package() {
            local id="$1" version="${2#v}" archive
            version="${version,,}"
            [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9a-z.]+)?$ ]]
            archive="$PACKAGES_ROOT/$id/$version/$id.$version.nupkg"
            mkdir -p "$(dirname "$archive")"
            curl "${curl_args[@]}" \
              "${package_base%/}/$id/$version/$id.$version.nupkg" \
              --output "$archive.part"
            mv "$archive.part" "$archive"
          }
          download_package salts.native "$SALTS_RELEASE"
          download_package saltsutils.native "$SALTS_UTILS_RELEASE"

      - name: Verify official SHA256SUMS and restore isolated SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stun-flowchart-checks/salts" \
                   "$RUNNER_TEMP/stun-flowchart-checks/utils"
          gh release download "$SALTS_RELEASE" --repo qigao/salts \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/stun-flowchart-checks/salts"
          gh release download "$SALTS_UTILS_RELEASE" --repo qigao/salts-utils \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/stun-flowchart-checks/utils"
          python3 .github/scripts/restore-flowchart-sdk.py \
            --packages "$PACKAGES_ROOT" --sdk "$SALTS_ROOT" \
            --salts-release "$SALTS_RELEASE" \
            --salts-utils-release "$SALTS_UTILS_RELEASE" \
            --salts-checksums "$RUNNER_TEMP/stun-flowchart-checks/salts/SHA256SUMS" \
            --salts-utils-checksums "$RUNNER_TEMP/stun-flowchart-checks/utils/SHA256SUMS"
          printf 'LD_LIBRARY_PATH=%s/lib\n' "$SALTS_ROOT" >> "$GITHUB_ENV"

      - name: Install parser prerequisites and build re2c master
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nlohmann-json3-dev libfreetype-dev libstb-dev libpugixml-dev
          bash .github/scripts/build-re2c-master.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: charts/mermaid/flowchart/tests/oracle/package-lock.json
      - name: Restore pinned independent curve oracle
        working-directory: charts/mermaid/flowchart/tests/oracle
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Configure isolated JSON golden test against installed SDKs
        shell: bash
        run: |
          set -euo pipefail
          cmake -S charts/mermaid/flowchart/tests/standalone \
            -B build/flowchart-json-golden -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSTUN_CI_JSON_GOLDEN=ON -DSTUN_CI_RENDERER_STYLE=ON -DSTUN_CI_SANITIZERS=ON \
            "-DCMAKE_PREFIX_PATH=$SALTS_ROOT" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          # Reuse one generator invocation and build tree for all focused checks.
          cmake --build build/flowchart-json-golden \
            --target stun_flowchart_ast_smoke stun_flowchart_json_golden stun_flowchart_json_failures stun_flowchart_linkstyle --parallel 2

      - name: Execute production parser, JSON golden and headless SVG checks
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/flowchart-json-golden \
            -R '^stun_flowchart_(ast_smoke|json_golden|json_failures|linkstyle)$' \
            --no-tests=error --verbose --output-on-failure --timeout 120
          python3 charts/mermaid/flowchart/tests/verify_linkstyle_svg.py \
            build/flowchart-json-golden/flowchart-linkstyle.svg
          node charts/mermaid/flowchart/tests/oracle/verify-curves.mjs \
            build/flowchart-json-golden/flowchart-linkstyle.svg.curves \
            build/flowchart-json-golden/flowchart-linkstyle.svg.curves.legacy \
            build/flowchart-json-golden/flowchart-linkstyle.svg.curves.professional
          git diff --exit-code

      - name: Compile production animation call sites and existing manager suites
        if: needs.changes.outputs.animation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S flexUI/tests/typed-animation-standalone \
            -B build/typed-animation -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/typed-animation --parallel 2

      - name: Run typed animation and transition regressions
        if: needs.changes.outputs.animation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/typed-animation --no-tests=error \
            --verbose --output-on-failure --timeout 30
          git diff --exit-code

      - name: Checkout PlutoVG development source
        if: needs.changes.outputs.measurement == 'true'
        uses: actions/checkout@v4
        with:
          repository: sammycage/plutovg
          ref: main
          path: .ci/measurement-plutovg
          persist-credentials: false
      - name: Checkout PlutoSVG development source
        if: needs.changes.outputs.measurement == 'true'
        uses: actions/checkout@v4
        with:
          repository: sammycage/plutosvg
          ref: master
          path: .ci/measurement-plutosvg
          persist-credentials: false
      - name: Build real SVG dependencies and headless renderer tests
        if: needs.changes.outputs.measurement == 'true'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/stun-measurement-deps"
          git -C .ci/measurement-plutovg rev-parse HEAD
          git -C .ci/measurement-plutosvg rev-parse HEAD
          cmake -S .ci/measurement-plutovg -B build/measurement-plutovg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$prefix" -DPLUTOVG_BUILD_EXAMPLES=OFF
          cmake --build build/measurement-plutovg --parallel 2
          cmake --install build/measurement-plutovg
          cmake -S .ci/measurement-plutosvg -B build/measurement-plutosvg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$prefix" \
            "-Dplutovg_DIR=$prefix/lib/cmake/plutovg" -DPLUTOSVG_BUILD_EXAMPLES=OFF
          cmake --build build/measurement-plutosvg --parallel 2
          cmake --install build/measurement-plutosvg
          cmake -S flex/tests/gcanvas-standalone -B build/measurement -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_PREFIX_PATH=$prefix" -DSTB_INCLUDE_DIRS=/usr/include/stb
          cmake --build build/measurement --parallel 2
          ctest --test-dir build/measurement --no-tests=error --verbose --output-on-failure
          git diff --exit-code

      - name: Restore pinned headless XML dependencies
        if: needs.changes.outputs.xml_runtime == 'true'
        id: xml_deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stun-xml-runtime-deps
          key: ${{ runner.os }}-${{ runner.arch }}-xml-runtime-v1-${{ hashFiles('flexUI/tests/xml-runtime-deps/CMakeLists.txt') }}

      - name: Build small upstream XML dependencies
        if: needs.changes.outputs.xml_runtime == 'true' && steps.xml_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S flexUI/tests/xml-runtime-deps -B build/xml-deps -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/stun-xml-runtime-deps"
          cmake --build build/xml-deps --parallel 2
          cmake --install build/xml-deps

      - name: Execute real XML registry and application load/reload regressions
        if: needs.changes.outputs.xml_runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S flexUI/tests/xml-runtime-standalone -B build/xml-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_PREFIX_PATH=$SALTS_ROOT;$RUNNER_TEMP/stun-xml-runtime-deps" \
            -DSTB_INCLUDE_DIRS=/usr/include/stb
          cmake --build build/xml-runtime --target stun_xml_runtime_qualification --parallel 2
          # Real producer SDK delivery, not a generated installer/consumer
          # project or a second target graph. Build the public Flex archive
          # as part of the actual installed Core/JinjaXml package set.
          cmake --build build/xml-runtime --target flex --parallel 2
          cmake --install build/xml-runtime --component FlexUICore \
            --prefix "$RUNNER_TEMP/stun-flexui-sdk"
          ctest --test-dir build/xml-runtime --no-tests=error --verbose --output-on-failure \
            --timeout 120 --output-junit build/xml-runtime/results.xml
          git diff --exit-code

      - name: Verify PTY native-write trace and epoch oracle on Linux
        if: needs.changes.outputs.xml_runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s flexUI/tests \
            -p 'test_tui_streaming_pty_trace.py' -v

      # Run independent real-source LSan native build/CTest. Missing
      # sanitizer support fails the compiler/linker, not a library scanner.
      - name: Qualify full headless XML and Streaming runtime under LSan
        if: needs.changes.outputs.xml_runtime == 'true'
        shell: bash
        env:
          LSAN_OPTIONS: detect_leaks=1:exitcode=23:report_objects=1
        run: |
          set -euo pipefail
          cmake -S flexUI/tests/xml-runtime-standalone \
            -B build/xml-runtime-lsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=$SALTS_ROOT;$RUNNER_TEMP/stun-xml-runtime-deps" \
            -DSTB_INCLUDE_DIRS=/usr/include/stb \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DENABLE_SANITIZER_LEAK=ON \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          cmake --build build/xml-runtime-lsan \
            --target stun_xml_runtime_qualification --parallel 2
          ctest --test-dir build/xml-runtime-lsan \
            --no-tests=error --verbose --output-on-failure --timeout 120 \
            --output-junit build/xml-runtime-lsan/results.xml
          git diff --exit-code

      # Preserve comparable measurements from two independently instrumented
      # builds. These are regression observations, not a product latency SLA.
      - name: Record bounded Streaming TUI long-session metrics
        if: needs.changes.outputs.xml_runtime == 'true'
        shell: bash
        env:
          STUN_SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          expression = re.compile(
              r"TUI_LONG_SESSION iterations=(\d+) elapsed_ms=(\d+) "
              r"p50_update_us=(\d+) p95_update_us=(\d+) "
              r"peak_box_elements=(\d+) peak_style_baselines=(\d+)"
          )
          names = (
              "iterations", "elapsed_ms", "p50_update_us", "p95_update_us",
              "peak_box_elements", "peak_style_baselines"
          )
          virtual_expression = re.compile(
              r"TUI_VIRTUAL_STRESS turns=(\d+) peak_elements=(\d+) "
              r"peak_styles=(\d+) visible_hosts=(\d+)"
          )
          virtual_names = (
              "turns", "peak_elements", "peak_styles", "visible_hosts"
          )
          wheel_expression = re.compile(
              r"TUI_VIRTUAL_WHEEL turns=(\d+) elapsed_ms=(\d+) "
              r"p50_scroll_us=(\d+) p95_scroll_us=(\d+) "
              r"peak_elements=(\d+) visible_hosts=(\d+) "
              r"fast_path_hits=(\d+)"
          )
          wheel_names = (
              "turns", "elapsed_ms", "p50_scroll_us", "p95_scroll_us",
              "peak_elements", "visible_hosts", "fast_path_hits"
          )
          reuse_expression = re.compile(
              r"TUI_PROJECTION_REUSE turns=(\d+) staging_mallocs=(\d+) "
              r"p50_reuse_us=(\d+) p95_reuse_us=(\d+) "
              r"cancel_reflow=(\d+)"
          )
          reuse_names = (
              "turns", "staging_mallocs", "p50_reuse_us",
              "p95_reuse_us", "cancel_reflow"
          )
          height_expression = re.compile(
              r"TUI_HEIGHT_INDEX_SYNC turns=(\d+) retained=(\d+) "
              r"p50_sync_us=(\d+) p95_sync_us=(\d+)"
          )
          height_names = ("turns", "retained", "p50_sync_us", "p95_sync_us")
          gfm_expression = re.compile(
              r"TUI_GFM_REFLOW turns=(\d+) cancels=(\d+) crossings=(\d+) "
              r"peak_elements=(\d+) visible_hosts=(\d+)"
          )
          gfm_names = (
              "turns", "cancels", "crossings", "peak_elements",
              "visible_hosts"
          )
          gfm_height_expression = re.compile(
              r"TUI_GFM_HEIGHT initial_px=([0-9]+(?:\.[0-9]+)?) "
              r"content_px=([0-9]+(?:\.[0-9]+)?) "
              r"narrow_px=([0-9]+(?:\.[0-9]+)?) "
              r"restored_px=([0-9]+(?:\.[0-9]+)?) "
              r"source_delta_px=([0-9]+(?:\.[0-9]+)?) "
              r"wrap_delta_px=([0-9]+(?:\.[0-9]+)?) "
              r"unwrap_delta_px=([0-9]+(?:\.[0-9]+)?) "
              r"anchor_preserved=(\d+)"
          )
          gfm_height_names = (
              "initial_px", "content_px", "narrow_px", "restored_px",
              "source_delta_px", "wrap_delta_px", "unwrap_delta_px",
              "anchor_preserved"
          )
          paths = {
              "asan_ubsan": Path("build/xml-runtime/Testing/Temporary/LastTest.log"),
              "lsan": Path("build/xml-runtime-lsan/Testing/Temporary/LastTest.log"),
          }
          evidence = {
              "schema_version": 2,
              "source_sha": os.environ["STUN_SOURCE_SHA"],
              "units": {"elapsed_ms": "ms", "p50_update_us": "us",
                        "p95_update_us": "us"},
              "modes": {},
              "virtual_modes": {},
              "wheel_modes": {},
              "reuse_modes": {},
              "height_modes": {},
              "gfm_modes": {},
              "gfm_height_modes": {},
          }
          for mode, path in paths.items():
              log = path.read_text(encoding="utf-8")
              matches = list(expression.finditer(log))
              if len(matches) != 1:
                  raise SystemExit(
                      f"{mode}: expected exactly one TUI_LONG_SESSION result "
                      f"in {path}, got {len(matches)}"
                  )
              values = dict(zip(names, (int(x) for x in matches[0].groups())))
              if (values["iterations"] != 512 or
                      values["elapsed_ms"] > 30000 or
                      values["p95_update_us"] > 50000 or
                      values["p50_update_us"] > values["p95_update_us"]):
                  raise SystemExit(f"{mode}: invalid resource/CPU evidence {values}")
              evidence["modes"][mode] = values
              virtual = list(virtual_expression.finditer(log))
              if len(virtual) != 1:
                  raise SystemExit(
                      f"{mode}: expected exactly one TUI_VIRTUAL_STRESS "
                      f"result in {path}, got {len(virtual)}"
                  )
              virtual_values = dict(zip(
                  virtual_names, (int(x) for x in virtual[0].groups())
              ))
              if (virtual_values["turns"] != 128 or
                      virtual_values["visible_hosts"] != 2 or
                      virtual_values["peak_elements"] > 96 or
                      virtual_values["peak_styles"] > 96):
                  raise SystemExit(
                      f"{mode}: invalid virtual scrolling ownership evidence "
                      f"{virtual_values}"
                  )
              evidence["virtual_modes"][mode] = virtual_values
              wheel_matches = list(wheel_expression.finditer(log))
              if len(wheel_matches) != 1:
                  raise SystemExit(
                      f"{mode}: expected exactly one TUI_VIRTUAL_WHEEL "
                      f"result in {path}, got {len(wheel_matches)}"
                  )
              wheel_values = dict(zip(
                  wheel_names, (int(x) for x in wheel_matches[0].groups())
              ))
              if (wheel_values["turns"] != 96 or
                  wheel_values["fast_path_hits"] != 96 or
                  wheel_values["visible_hosts"] != 2 or
                  wheel_values["peak_elements"] > 96 or
                  wheel_values["elapsed_ms"] > 30000 or
                  wheel_values["p95_scroll_us"] > 100000 or
                  wheel_values["p50_scroll_us"] >
                      wheel_values["p95_scroll_us"]):
                  raise SystemExit(
                      f"{mode}: invalid bounded semantic-wheel evidence "
                      f"{wheel_values}"
                  )
              evidence["wheel_modes"][mode] = wheel_values
              reuse_matches = list(reuse_expression.finditer(log))
              if len(reuse_matches) != 1:
                  raise SystemExit(
                      f"{mode}: expected exactly one TUI_PROJECTION_REUSE "
                      f"result in {path}, got {len(reuse_matches)}"
                  )
              reuse_values = dict(zip(
                  reuse_names, (int(x) for x in reuse_matches[0].groups())
              ))
              if (reuse_values["turns"] != 96 or
                      reuse_values["staging_mallocs"] != 0 or
                      reuse_values["cancel_reflow"] != 1 or
                      reuse_values["p50_reuse_us"] >
                          reuse_values["p95_reuse_us"] or
                      reuse_values["p95_reuse_us"] > 100000):
                  raise SystemExit(
                      f"{mode}: invalid source-equal projection reuse "
                      f"evidence {reuse_values}"
                  )
              evidence["reuse_modes"][mode] = reuse_values
              height_matches = list(height_expression.finditer(log))
              if len(height_matches) != 1:
                  raise SystemExit(
                      f"{mode}: expected exactly one TUI_HEIGHT_INDEX_SYNC "
                      f"result in {path}, got {len(height_matches)}"
                  )
              height_values = dict(zip(
                  height_names, (int(x) for x in height_matches[0].groups())
              ))
              if (height_values["turns"] != 96 or
                  height_values["retained"] != 256 or
                  height_values["p50_sync_us"] >
                      height_values["p95_sync_us"] or
                  height_values["p95_sync_us"] > 100000):
                  raise SystemExit(
                      f"{mode}: invalid 256-message bounded height sync "
                      f"evidence {height_values}"
                  )
              evidence["height_modes"][mode] = height_values
              gfm_matches = list(gfm_expression.finditer(log))
              if len(gfm_matches) != 1:
                  raise SystemExit(
                      f"{mode}: expected exactly one TUI_GFM_REFLOW "
                      f"result in {path}, got {len(gfm_matches)}"
                  )
              gfm_values = dict(zip(
                  gfm_names, (int(x) for x in gfm_matches[0].groups())
              ))
              if (gfm_values["turns"] != 32 or
                  gfm_values["cancels"] != 5 or
                  gfm_values["crossings"] != 30 or
                  gfm_values["visible_hosts"] != 2 or
                  gfm_values["peak_elements"] > 300):
                  raise SystemExit(
                      f"{mode}: invalid GFM cross-window anchor evidence "
                      f"{gfm_values}"
                  )
              evidence["gfm_modes"][mode] = gfm_values
              height_matches = list(gfm_height_expression.finditer(log))
              if len(height_matches) != 1:
                  raise SystemExit(
                      f"{mode}: expected one TUI_GFM_HEIGHT actual-Box "
                      f"geometry result in {path}, got {len(height_matches)}"
                  )
              actual = {
                  name: (int(value) if name == "anchor_preserved" else
                         float(value))
                  for name, value in zip(
                      gfm_height_names, height_matches[0].groups())
              }
              if (actual["initial_px"] <= 72.0 or
                  actual["source_delta_px"] <= 1.0 or
                  actual["wrap_delta_px"] <= 1.0 or
                  actual["unwrap_delta_px"] <= 1.0 or
                  actual["content_px"] <= actual["initial_px"] + 1.0 or
                  actual["narrow_px"] <= actual["content_px"] + 1.0 or
                  actual["restored_px"] >= actual["narrow_px"] - 1.0 or
                  abs(actual["restored_px"] -
                      actual["content_px"]) >= 2.0 or
                  actual["anchor_preserved"] != 1):
                  raise SystemExit(
                      f"{mode}: invalid real GFM grow/shrink evidence {actual}"
                  )
              evidence["gfm_height_modes"][mode] = actual
          output = Path("build/tui-long-session-metrics.json")
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                            encoding="utf-8")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("### 512-message TUI owner-loop resource baseline\n\n")
                  out.write("| Mode | Total ms | p50 us | p95 us | "
                            "Peak Box nodes | Peak style baselines |\n")
                  out.write("|---|---:|---:|---:|---:|---:|\n")
                  for mode, result in evidence["modes"].items():
                      out.write(f'| {mode} | {result["elapsed_ms"]} | '
                                f'{result["p50_update_us"]} | '
                                f'{result["p95_update_us"]} | '
                                f'{result["peak_box_elements"]} | '
                                f'{result["peak_style_baselines"]} |\n')
                  out.write("\n### 128-message opt-in virtual window ownership\n\n")
                  out.write("| Mode | Turns | Peak Box nodes | "
                            "Peak style baselines | Visible hosts |\n")
                  out.write("|---|---:|---:|---:|---:|\n")
                  for mode, result in evidence["virtual_modes"].items():
                      out.write(f'| {mode} | {result["turns"]} | '
                                f'{result["peak_elements"]} | '
                                f'{result["peak_styles"]} | '
                                f'{result["visible_hosts"]} |\n')
                  out.write("\n### 96-turn semantic wheel baseline (opt-in)\n\n")
                  out.write("| Mode | Total ms | p50 us | p95 us | "
                            "Peak Box nodes | Fast path hits |\n")
                  out.write("|---|---:|---:|---:|---:|---:|\n")
                  for mode, result in evidence["wheel_modes"].items():
                      out.write(f'| {mode} | {result["elapsed_ms"]} | '
                                f'{result["p50_scroll_us"]} | '
                                f'{result["p95_scroll_us"]} | '
                                f'{result["peak_elements"]} | '
                                f'{result["fast_path_hits"]} |\n')
                  out.write("\n### Unchanged Markdown projection reuse (opt-in)\n\n")
                  out.write("| Mode | Turns | Staging mallocs | p50 us | "
                            "p95 us | Cancel reflow |\n")
                  out.write("|---|---:|---:|---:|---:|---:|\n")
                  for mode, result in evidence["reuse_modes"].items():
                      out.write(f'| {mode} | {result["turns"]} | '
                                f'{result["staging_mallocs"]} | '
                                f'{result["p50_reuse_us"]} | '
                                f'{result["p95_reuse_us"]} | '
                                f'{result["cancel_reflow"]} |\n')
                  out.write("\n### 32-turn variable-height GFM cross-window regression\n\n")
                  out.write("| Mode | Turns | Cancels | Bidirectional boundaries | "
                            "Peak Box nodes | Visible hosts |\n")
                  out.write("|---|---:|---:|---:|---:|---:|\n")
                  for mode, result in evidence["gfm_modes"].items():
                      out.write(f'| {mode} | {result["turns"]} | '
                                f'{result["cancels"]} | '
                                f'{result["crossings"]} | '
                                f'{result["peak_elements"]} | '
                                f'{result["visible_hosts"]} |\n')
                  out.write("\n### Real GFM source/viewport height changes\n\n")
                  out.write("| Mode | Baseline px | Content px | Narrow px | "
                            "Restored px | Source growth px | Wrap growth px | "
                            "Unwrap shrink px |\n")
                  out.write("|---|---:|---:|---:|---:|---:|---:|---:|\n")
                  for mode, result in evidence["gfm_height_modes"].items():
                      out.write(f'| {mode} | {result["initial_px"]:.2f} | '
                                f'{result["content_px"]:.2f} | '
                                f'{result["narrow_px"]:.2f} | '
                                f'{result["restored_px"]:.2f} | '
                                f'{result["source_delta_px"]:.2f} | '
                                f'{result["wrap_delta_px"]:.2f} | '
                                f'{result["unwrap_delta_px"]:.2f} |\n')
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Compile Unicode consumers and run original strict text suite
        if: needs.changes.outputs.unicode == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S flexUI/tests/unicode-standalone -B build/unicode -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/unicode --parallel 2
          ctest --test-dir build/unicode --no-tests=error --verbose --output-on-failure
          git diff --exit-code

      - name: Execute all direct Mermaid parser goldens against installed SDKs
        if: needs.changes.outputs.expression == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S charts/mermaid/tests/expression-standalone -B build/mermaid-parsers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/mermaid-parsers --target stun_parser_qualification --parallel 2
          ctest --test-dir build/mermaid-parsers --no-tests=error --verbose --output-on-failure --timeout 120 \
            --output-junit build/mermaid-parsers/results.xml
          git diff --exit-code

      - name: Require real ccache compiler invocations and report hit rate
        shell: bash
        run: bash .github/scripts/report-ccache.sh runtime-linux

      - name: Preserve exact-head SDK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowchart-json-golden-${{ needs.changes.outputs.source_sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/stun-flowchart-native-sdk/flowchart-sdk-provenance.json
            ${{ runner.temp }}/stun-re2c-provenance.json
            build/flowchart-json-golden/Testing/Temporary/LastTest.log
            build/flowchart-json-golden/dependencies.txt
            build/typed-animation/Testing/Temporary/LastTest.log
            build/measurement/Testing/Temporary/LastTest.log
            build/xml-runtime/Testing/Temporary/LastTest.log
            build/xml-runtime/results.xml
            build/xml-runtime/compile_commands.json
            build/xml-runtime-lsan/Testing/Temporary/LastTest.log
            build/xml-runtime-lsan/results.xml
            build/tui-long-session-metrics.json
            build/unicode/Testing/Temporary/LastTest.log
            build/mermaid-parsers/Testing/Temporary/LastTest.log
            build/mermaid-parsers/results.xml
            build/flowchart-json-golden/flowchart-linkstyle.svg*
            ${{ runner.temp }}/stun-ccache-stats-runtime-linux.tsv

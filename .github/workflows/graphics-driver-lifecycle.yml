# Temporary #31 ownership probe. Remove after the symbolized evidence is recorded.
name: Graphics driver lifecycle diagnostic

on:
  push:
    branches: [refactor/flexui-salts-unicode]
    paths: [.github/workflows/graphics-driver-lifecycle.yml]

permissions:
  contents: read

jobs:
  mesa-allocation-sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
      DEBUGINFOD_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact Mesa allocation sites
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p build/driver-symbols
          printf 'Stun=%s\nControlHead=1d1bc23dd396d619159208b569ad6c83206c2b4f\nControlRun=35568486976\n' \
            "$EXPECTED_HEAD" > build/driver-symbols/provenance.txt
          sudo apt-get update
          sudo apt-get install -y debuginfod elfutils \
            mesa-libgallium=25.2.8-0ubuntu0.24.04.2
          library=/usr/lib/x86_64-linux-gnu/libgallium-25.2.8-0ubuntu0.24.04.2.so
          test -f "$library"
          dpkg-query -W mesa-libgallium >> build/driver-symbols/provenance.txt
          readelf -n "$library" > build/driver-symbols/elf-notes.txt
          sha256sum "$library" > build/driver-symbols/binary.sha256
          debug=$(debuginfod-find debuginfo "$library")
          test -s "$debug"
          readelf -n "$debug" > build/driver-symbols/debug-notes.txt
          sha256sum "$debug" > build/driver-symbols/debug.sha256
          addr2line -a -f -C -i -e "$debug" \
            0x568c13 0x5690e6 0x85ef32 0xf0f0f 0x83a68c 0x83a5bf 0xf4db4 \
            0xe1c8d1 0xe1c8ad 0x82679b 0x8185f0 0x8187c9 0x7bac5e \
            0x7bda11 0x7b8514 0x75e29f 0x7a1b7b 0x79e167 0x72da42 \
            0x726a24 0x726ebf 0x72738c 0x862c4c 0x314ca7 \
            | tee build/driver-symbols/allocation-sites.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('build/driver-symbols')
          build_ids = [re.search(r'Build ID:\s*(\w+)', (root / name).read_text()).group(1)
                       for name in ('elf-notes.txt', 'debug-notes.txt')]
          assert build_ids[0] == build_ids[1], build_ids
          sites = (root / 'allocation-sites.txt').read_text()
          assert '??' not in sites, 'Exact debug information did not resolve all allocation PCs'
          print('Matched Build-ID:', build_ids[0])
          PY
      - name: Preserve allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-allocation-sites-${{ github.sha }}
          path: build/driver-symbols
          if-no-files-found: error

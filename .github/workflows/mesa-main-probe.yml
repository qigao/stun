name: Mesa main lifecycle probe

on:
  pull_request:
  push:
    branches: [deps/mesa-main-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stun-mesa-main-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:fast_unwind_on_malloc=0:malloc_context_size=64
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: glfw/glfw
          ref: master
          path: .ci/glfw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Dav1dde/glad
          ref: glad2
          path: .ci/glad
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pallets/jinja
          ref: main
          path: .ci/jinja
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pallets/markupsafe
          ref: main
          path: .ci/markupsafe
          persist-credentials: false
      - name: Clone Mesa upstream development branch and record provenance
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p build/mesa-main-evidence "$RUNNER_TEMP/mesa-main-xdg"
          chmod 700 "$RUNNER_TEMP/mesa-main-xdg"
          git clone --depth=1 --branch main https://gitlab.freedesktop.org/mesa/mesa.git "$RUNNER_TEMP/mesa-main"
          mesa_commit="$(git -C "$RUNNER_TEMP/mesa-main" rev-parse HEAD)"
          glfw_commit="$(git -C .ci/glfw rev-parse HEAD)"
          glad_commit="$(git -C .ci/glad rev-parse HEAD)"
          jinja_commit="$(git -C .ci/jinja rev-parse HEAD)"
          markupsafe_commit="$(git -C .ci/markupsafe rev-parse HEAD)"
          {
            echo "Stun=$EXPECTED_HEAD"
            echo "MesaRef=main"
            echo "Mesa=$mesa_commit"
            echo "GLFWRef=master"
            echo "GLFW=$glfw_commit"
            echo "GLADRef=glad2"
            echo "GLAD=$glad_commit"
            echo "JinjaRef=main"
            echo "Jinja=$jinja_commit"
            echo "MarkupSafeRef=main"
            echo "MarkupSafe=$markupsafe_commit"
          } | tee build/mesa-main-evidence/provenance.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.ci/jinja/src:$GITHUB_WORKSPACE/.ci/markupsafe/src" >> "$GITHUB_ENV"
          {
            echo "MESA_SOURCE=$RUNNER_TEMP/mesa-main"
            echo "MESA_BUILD=$RUNNER_TEMP/mesa-main-build"
            echo "MESA_ROOT=$RUNNER_TEMP/mesa-main-sdk"
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/build/mesa-main-evidence"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/mesa-main-xdg"
            echo "MESA_COMMIT=$mesa_commit"
          } >> "$GITHUB_ENV"
      - name: Prepare existing lifecycle-control toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bison flex llvm-20-dev \
            autoconf autoconf-archive automake libtool \
            libdrm-dev libexpat1-dev libelf-dev zlib1g-dev libzstd-dev \
            xorg-dev libwayland-dev libxkbcommon-dev libglvnd-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shm0-dev libxshmfence-dev \
            xvfb xauth mesa-utils
          python3 -m venv "$RUNNER_TEMP/mesa-main-tools"
          "$RUNNER_TEMP/mesa-main-tools/bin/pip" install meson Mako PyYAML packaging
          echo "$RUNNER_TEMP/mesa-main-tools/bin" >> "$GITHUB_PATH"
          dpkg-query -W > "$EVIDENCE_DIR/system-packages.txt"
          {
            echo "GLFWSource=$GITHUB_WORKSPACE/.ci/glfw"
            echo "GLADSource=$GITHUB_WORKSPACE/.ci/glad"
          } > "$EVIDENCE_DIR/control-dependencies.log"
      - name: Configure and build unmodified Mesa main
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          cat > "$RUNNER_TEMP/mesa-main-native.ini" <<'NATIVE'
          [binaries]
          c = 'gcc'
          cpp = 'g++'
          llvm-config = '/usr/bin/llvm-config-20'
          NATIVE
          meson setup "$MESA_BUILD" "$MESA_SOURCE" \
            --native-file "$RUNNER_TEMP/mesa-main-native.ini" \
            --prefix "$MESA_ROOT" --libdir lib --buildtype debugoptimized \
            -Dplatforms=x11 -Dgallium-drivers=llvmpipe -Dvulkan-drivers=[] \
            -Dglx=dri -Dglvnd=enabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dllvm=enabled \
            -Dgallium-va=disabled -Dgallium-rusticl=false \
            -Dbuild-tests=false -Dc_args=-fno-omit-frame-pointer -Dcpp_args=-fno-omit-frame-pointer \
            2>&1 | tee "$EVIDENCE_DIR/mesa-configure.log"
          meson compile -C "$MESA_BUILD" -j 2 2>&1 | tee "$EVIDENCE_DIR/mesa-build.log"
          meson install -C "$MESA_BUILD" 2>&1 | tee "$EVIDENCE_DIR/mesa-install.log"
          driver="$(readlink -e "$MESA_ROOT/lib/dri/swrast_dri.so")"
          glx="$(readlink -e "$MESA_ROOT/lib/libGLX_mesa.so.0")"
          test -f "$driver"
          test -f "$glx"
          {
            echo "MESA_EXPECTED_DRIVER=$driver"
            echo "MESA_EXPECTED_GLX=$glx"
          } >> "$GITHUB_ENV"
          printf 'driver=%s\nglx=%s\n' "$driver" "$glx" | tee "$EVIDENCE_DIR/providers.txt"
          sha256sum "$driver" "$glx" > "$EVIDENCE_DIR/provider-sha256.txt"
          cmake -S cmake/ci/mesa -B build/mesa-main-control -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DSTUN_MESA_GLFW_SOURCE=$GITHUB_WORKSPACE/.ci/glfw" \
            "-DSTUN_MESA_GLAD_SOURCE=$GITHUB_WORKSPACE/.ci/glad"
          cmake --build build/mesa-main-control --parallel 2 --verbose
      - name: Establish matching current-runner GLFW/X11 lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS LIBGL_DRIVERS_PATH __GLX_VENDOR_LIBRARY_NAME
          xvfb-run -a python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          binary = Path('build/mesa-main-control/mesa_driver_control').resolve(strict=True)
          evidence = Path(os.environ['EVIDENCE_DIR'])
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          leak_block_re = re.compile(
              r'(?:Direct|Indirect) leak of (?P<bytes>\d+) byte\(s\) in '
              r'(?P<objects>\d+) object\(s\) allocated from:\n'
              r'(?P<stack>(?:    #.*\n)+)')
          def classify_leaks(log):
              owners = {'x11': {'bytes': 0, 'objects': 0, 'blocks': 0},
                        'non_x11': {'bytes': 0, 'objects': 0, 'blocks': 0}}
              for match in leak_block_re.finditer(log):
                  owner = 'x11' if '/glfw/src/x11_init.c:' in match.group('stack') else 'non_x11'
                  owners[owner]['bytes'] += int(match.group('bytes'))
                  owners[owner]['objects'] += int(match.group('objects'))
                  owners[owner]['blocks'] += 1
              return owners
          rows = []
          for cycles in (1, 4):
              result = subprocess.run([str(binary), 'init', str(cycles)], text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      timeout=180)
              log = result.stdout
              (evidence / f'system-init-{cycles}.log').write_text(log)
              owners = classify_leaks(log)
              row = {
                  'mode': 'init',
                  'cycles': cycles,
                  'exit_code': result.returncode,
                  'pixel_checks': 0,
                  'completed': 'application-checks=passed;' in log,
                  'owners': owners,
                  'leaks': re.findall(r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log),
                  'asan_errors': len(re.findall(r'ERROR: AddressSanitizer:(?!.*LeakSanitizer)', log)),
                  'ubsan_errors': len(re.findall(r'runtime error:', log)),
              }
              assert row['completed'], row
              assert log.count('teardown=completed') == cycles, row
              assert row['asan_errors'] == 0 and row['ubsan_errors'] == 0, row
              assert len(row['leaks']) == 1, row
              assert owners['x11']['blocks'] > 0, row
              assert owners['non_x11']['blocks'] == 0, (
                  'System init must isolate the X11 locale baseline', row)
              rows.append(row)
              print(json.dumps(row), flush=True)
          assert len(rows) == 2
          (evidence / 'system-init-baselines.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY
      - name: Execute unchanged lifecycle control against Mesa main
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS LIBGL_DRIVERS_PATH
          xvfb-run -a python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_DIR'])
          binary = Path('build/mesa-main-control/mesa_driver_control').resolve(strict=True)
          driver = Path(os.environ['MESA_EXPECTED_DRIVER']).resolve(strict=True)
          glx = Path(os.environ['MESA_EXPECTED_GLX']).resolve(strict=True)
          env = os.environ.copy()
          # Select the exact main-built GLX vendor and DRI module; do not mix
          # the probe with the runner's distribution Mesa.
          env['LD_LIBRARY_PATH'] = str(glx.parent)
          env['LIBGL_DRIVERS_PATH'] = str(driver.parent)
          env['__GLX_VENDOR_LIBRARY_NAME'] = 'mesa'
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          leak_block_re = re.compile(
              r'(?:Direct|Indirect) leak of (?P<bytes>\d+) byte\(s\) in '
              r'(?P<objects>\d+) object\(s\) allocated from:\n'
              r'(?P<stack>(?:    #.*\n)+)')
          historical_patch = Path('cmake/ci/mesa/module-cleanup.patch').resolve(strict=True)
          historical_owner_paths = {
              line.removeprefix('+++ b/').strip()
              for line in historical_patch.read_text().splitlines()
              if line.startswith('+++ b/')
          }
          assert historical_owner_paths == {
              'src/util/u_cpu_detect.c',
              'src/gallium/auxiliary/rtasm/rtasm_execmem.c',
          }, historical_owner_paths

          def driver_mappings(log):
              mappings = []
              expected = str(driver.resolve(strict=True))
              for line in log.splitlines():
                  if not line.startswith('driver-map='):
                      continue
                  fields = line.split()
                  if len(fields) < 6 or fields[-1] != expected:
                      continue
                  start_text, end_text = fields[0].removeprefix('driver-map=').split('-', 1)
                  mappings.append((int(start_text, 16), int(end_text, 16),
                                   int(fields[2], 16)))
              return mappings

          def resolve_historical_sources(log, stack):
              mappings = driver_mappings(log)
              resolved = set()
              for address_text in re.findall(r'#\d+\s+0x([0-9a-fA-F]+)', stack):
                  address = int(address_text, 16)
                  for start, end, file_offset in mappings:
                      if not start <= address < end:
                          continue
                      vma = address - start + file_offset
                      decoded = subprocess.check_output(
                          ['addr2line', '-f', '-C', '-e', str(driver), hex(vma)],
                          text=True, errors='replace')
                      for owner_path in historical_owner_paths:
                          if owner_path in decoded:
                              resolved.add(owner_path)
                      break
              return resolved

          def classify_leaks(log):
              owners = {
                  'x11': {'bytes': 0, 'objects': 0, 'blocks': 0},
                  'historical_patch_owner': {'bytes': 0, 'objects': 0, 'blocks': 0,
                                             'sources': []},
                  'other_non_x11': {'bytes': 0, 'objects': 0, 'blocks': 0},
              }
              historical_sources = set()
              for match in leak_block_re.finditer(log):
                  stack = match.group('stack')
                  if '/glfw/src/x11_init.c:' in stack:
                      owner = 'x11'
                  else:
                      resolved = resolve_historical_sources(log, stack)
                      if resolved:
                          owner = 'historical_patch_owner'
                          historical_sources.update(resolved)
                      else:
                          owner = 'other_non_x11'
                  owners[owner]['bytes'] += int(match.group('bytes'))
                  owners[owner]['objects'] += int(match.group('objects'))
                  owners[owner]['blocks'] += 1
              owners['historical_patch_owner']['sources'] = sorted(historical_sources)
              return owners
          system_rows = json.loads((evidence / 'system-init-baselines.json').read_text())
          assert {int(row['cycles']) for row in system_rows} == {1, 4}, system_rows
          rows = []
          for mode, expected_pixels in readbacks.items():
              for cycles in (1, 4):
                  result = subprocess.run([str(binary), mode, str(cycles)], text=True,
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          timeout=180, env=env)
                  log = result.stdout
                  (evidence / f'{mode}-{cycles}.log').write_text(log)
                  owners = classify_leaks(log)
                  row = {
                      'mode': mode,
                      'cycles': cycles,
                      'exit_code': result.returncode,
                      'pixel_checks': log.count('pixel-readback=passed'),
                      'completed': 'application-checks=passed;' in log,
                      'owners': owners,
                      'leaks': re.findall(r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log),
                      'asan_errors': len(re.findall(r'ERROR: AddressSanitizer:(?!.*LeakSanitizer)', log)),
                      'ubsan_errors': len(re.findall(r'runtime error:', log)),
                  }
                  rows.append(row)
                  print(json.dumps(row), flush=True)
                  assert row['completed'], row
                  assert row['pixel_checks'] == expected_pixels * cycles, row
                  assert log.count('teardown=completed') == cycles, row
                  assert row['asan_errors'] == 0 and row['ubsan_errors'] == 0, row
                  leak_tuple = tuple(map(int, row['leaks'][0])) if row['leaks'] else (0, 0)
                  row['leak_tuple'] = leak_tuple
                  row['mesa_incremental'] = (
                      owners['historical_patch_owner']['blocks'] > 0
                      or owners['other_non_x11']['blocks'] > 0)
                  assert owners['x11']['blocks'] > 0, row
                  if mode == 'init':
                      assert owners['historical_patch_owner']['blocks'] == 0, row
                      assert owners['other_non_x11']['blocks'] == 0, row
                  assert result.returncode != 0 if row['leaks'] else result.returncode == 0
          assert len(rows) == 10
          (evidence / 'results.json').write_text(json.dumps(rows, indent=2) + '\n')
          clean = [r for r in rows if r['exit_code'] == 0 and not r['leaks']]
          leaking = [r for r in rows if r['leaks']]
          summary = {
              'stun': os.environ['GITHUB_SHA'],
              'mesa_ref': 'main',
              'mesa_commit': os.environ['MESA_COMMIT'],
              'processes': len(rows),
              'clean': len(clean),
              'leaking': len(leaking),
              'system_init_baselines': system_rows,
              'mesa_incremental_processes': sum(1 for r in rows if r.get('mesa_incremental')),
              'historical_patch_owner_processes': sum(
                  1 for r in rows
                  if r['owners']['historical_patch_owner']['blocks'] > 0),
              'historical_patch_sources': sorted({
                  source_name
                  for r in rows
                  for source_name in r['owners']['historical_patch_owner']['sources']
              }),
              'other_non_x11_processes': sum(
                  1 for r in rows if r['owners']['other_non_x11']['blocks'] > 0),
              'driver': str(driver),
              'glx': str(glx),
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          assert summary['historical_patch_owner_processes'] == 0, (
              'Mesa main still reproduces a historical cleanup-patch owner', summary)
          assert summary['other_non_x11_processes'] == 0, (
              'Mesa main has a different non-X11 leak owner; inspect results.json', summary)
          PY
          cp "$MESA_BUILD/compile_commands.json" "$EVIDENCE_DIR/mesa-compile-commands.json"
          cp "$MESA_BUILD/meson-info/intro-buildoptions.json" "$EVIDENCE_DIR/mesa-build-options.json"
          git -C "$MESA_SOURCE" diff --exit-code
          git diff --exit-code
      - name: Preserve mainline probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-main-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/mesa-main-evidence
            ${{ runner.temp }}/mesa-main-build/meson-logs/meson-log.txt
          if-no-files-found: error

name: gCanvas Android EGL compile

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "shared/gcanvas/**"
      - ".github/workflows/gcanvas-android-egl.yml"
      - ".github/scripts/ci-affected.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci/full' && github.run_id || 'qualification' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci/full'
    name: Component change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: bash .github/scripts/ci-affected.sh 'shared/gcanvas/*' '.github/workflows/gcanvas-android-egl.yml' '.github/scripts/ci-affected.sh'

  android-egl-compile:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Resolve installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          # The configured NDK is a required input; the compiler invocation
          # fails directly when the Android toolchain is unavailable.
          echo "GCANVAS_ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Compile and link Android EGL adapter against NDK
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$GCANVAS_ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cxx="$toolchain/aarch64-linux-android24-clang++"
          mkdir -p build/android-egl

          "$cxx" -std=c++17 -Wall -Wextra -Werror -fPIC -shared \
            -Wl,--no-undefined \
            -Ishared/gcanvas/include \
            shared/gcanvas/src/platform/android/egl_host.cpp \
            -lEGL -landroid \
            -o build/android-egl/libgcanvas_android_egl.so

          "$cxx" -std=c++17 -Wall -Wextra -Werror \
            -Ishared/gcanvas/include \
            -c shared/gcanvas/tests/android_egl_contract_test.cpp \
            -o build/android-egl/android_egl_contract_test.o


name: gCanvas shader toolchain cache contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "shared/gcanvas/**"
      - "tools/gcanvas-shaderc/**"
      - ".github/workflows/gcanvas-shader-tools-cache.yml"
      - ".github/scripts/ci-affected.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Component change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: bash .github/scripts/ci-affected.sh 'shared/gcanvas/*' 'tools/gcanvas-shaderc/*' '.github/workflows/gcanvas-shader-tools-cache.yml' '.github/scripts/ci-affected.sh'

  linux-cache-only:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    name: Linux shared shader-tool cache
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Stun head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Use empty repository-local L1
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/stun-gcanvas-shader-tools-empty-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Configure exact-ABI curl GitHub Packages cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@b4952760bf85d666d834c5b0c75ff4d9d0f8ddad
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: .ci/gcanvas-shader-tools

      - name: Prepare host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore canonical gCanvas shader tools from GitHub Packages only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VCPKG_CACHE_REPOSITORY_ROOT"
          manifest="$GITHUB_WORKSPACE/.ci/gcanvas-shader-tools"
          test -f "$manifest/vcpkg.json"

          # Product dependency policy belongs to Stun; vcpkg-cache owns only
          # the shared toolchain, overlays and binary-cache transport.
          log="$RUNNER_TEMP/stun-gcanvas-shader-tools-cache.log"
          install_root="$RUNNER_TEMP/stun-gcanvas-shader-tools-installed"
          rm -rf "$install_root"

          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"

          ! grep -Eq '^Building [^:]+:x64-linux' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\)' "$log"

          status="$install_root/vcpkg/status"
          test -f "$status"
          for package in \
            shaderc glslang spirv-cross spirv-headers spirv-tools \
            vcpkg-cmake vcpkg-cmake-config
          do
            grep -Fqx "Package: $package" "$status"
          done

      - name: Verify Stun remains a read-only shared-cache consumer
        shell: bash
        run: |
          set -euo pipefail
          # The local files provider is writable only inside this runner.
          # Remote GitHub Packages transport is an authenticated curl GET.
          case "$VCPKG_BINARY_SOURCES" in
            "clear;files,$VCPKG_BINARY_CACHE,readwrite") ;;
            *)
              echo "unexpected non-local vcpkg binary provider: $VCPKG_BINARY_SOURCES" >&2
              exit 1
              ;;
          esac
          if printf '%s' "$VCPKG_BINARY_SOURCES" | grep -Eiq 'nuget|http|azblob'; then
            echo "remote vcpkg binary providers are forbidden" >&2
            exit 1
          fi

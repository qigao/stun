name: Prepare master checkout cleanup

on:
  push:
    branches: [feat/turboscript-desktop-runtime]
    paths: [.github/workflows/prepare-master-checkouts.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'qigao/stun'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact source and the reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/qigao/stun.git
          git fetch --no-tags --depth=3 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Recover transformed blob identities without remote writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import textwrap

          publisher = '.github/workflows/prepare-master-checkouts.yml'
          previous = '4038e92eb6f89cc0b7c9f8d918c20581344be7ff'
          raw = subprocess.check_output(['git', 'show', previous + ':' + publisher])
          digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert digest == '8613da0570b8a8d9e3920167a913812cb078aa82'
          # Reuse only the reviewed local transformation/validation portion.
          # Stop before any Git object API call. The old helper is not executed
          # as a workflow and this job holds no write permission or API token.
          body = raw.decode().split("          python3 - <<'PY'\n", 1)[1]
          body = body.split('          changes = []\n', 1)[0]
          body = textwrap.dedent(body)
          old = "expected_parent = 'decda36395266d4b753522ca9b9ca5f663222eb6'"
          assert body.count(old) == 1
          body = body.replace(old, 'expected_parent = ' + repr(previous), 1)
          namespace = {'__name__': '__main__'}
          exec(compile(body, 'reviewed-master-checkout-transformation', 'exec'), namespace)
          record = {
              'parent': os.environ['GITHUB_SHA'],
              'files': namespace['edits'],
              'direct_master_checkouts': namespace['audit'],
              'bash_blocks_checked': namespace['shell_blocks'],
              'python_blocks_checked': namespace['python_blocks'],
              'ref_updated': False,
          }
          print('RECOVERED_RESULT=' + json.dumps(record, sort_keys=True))
          PY

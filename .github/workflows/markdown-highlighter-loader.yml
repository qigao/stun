name: Markdown highlighter loader portability

on:
  push:
    branches:
      - draft/markdownwidget-single-c11-parser-229
    paths:
      - "flexUI/src/highlighters/**"
      - "flexUI/src/syntax_highlighter.cpp"
      - "flexUI/include/flexUI/syntax_highlighter.h"
      - "flexUI/tests/highlighter_loader_contract/**"
      - ".github/workflows/markdown-highlighter-loader.yml"
      - ".github/actions/setup-ccache/**"
      - ".github/scripts/report-ccache.sh"
  pull_request:
    paths:
      - "flexUI/src/highlighters/**"
      - "flexUI/src/syntax_highlighter.cpp"
      - "flexUI/include/flexUI/syntax_highlighter.h"
      - "flexUI/tests/highlighter_loader_contract/**"
      - ".github/workflows/markdown-highlighter-loader.yml"
      - ".github/actions/setup-ccache/**"
      - ".github/scripts/report-ccache.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: highlighter-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  highlighter-loader:
    name: DSO loader / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Activate real Windows x64 MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install verified native C11/C++ compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: markdown-loader
          source_sha: ${{ steps.run_head.outputs.sha }}
      - name: Require real Ninja C/C++ compiler launcher
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja
          ninja --version
          if [[ "$RUNNER_OS" == Windows ]]; then command -v cl; fi
      - name: Configure standalone C11 plugin loader conformance
        shell: bash
        run: |
          set -euo pipefail
          # CMake's Visual Studio generator does not provide the same
          # compiler-launcher contract; Ninja drives real MSVC under ccache.
          cmake_args=(-S flexUI/tests/highlighter_loader_contract
                      -B build/highlighter-loader-contract -G Ninja
                      -DCMAKE_BUILD_TYPE=Debug)
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Ninja/Debug MSVC defaults to /Zi compiler PDB output, which
            # ccache 4.14.2 rejects as an unsupported compiler option.
            # /Z7 embeds the SAME Debug symbols in each object, retaining
            # /MDd, /RTC1, unoptimized builds and the original CTest gates.
            cmake_args+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
                         "-DCMAKE_C_FLAGS_DEBUG=/MDd /Z7 /Ob0 /Od /RTC1"
                         "-DCMAKE_CXX_FLAGS_DEBUG=/MDd /Z7 /Ob0 /Od /RTC1")
            # Git Bash rewrites bare MSVC /Z7 and /MDd into paths unless
            # conversion is disabled for this CMake subprocess alone.
            MSYS_NO_PATHCONV=1 cmake "${cmake_args[@]}"
          else
            cmake "${cmake_args[@]}"
          fi
      - name: Build C11 provider and C++17 loader
        shell: bash
        run: |
          cmake --build build/highlighter-loader-contract --config Debug --parallel 2
      - name: Execute extension, reload and concurrent lease tests
        shell: bash
        run: |
          ctest --test-dir build/highlighter-loader-contract -C Debug \
            --no-tests=error --output-on-failure --timeout 120 --verbose
      - name: Require real native compiler cache statistics
        shell: bash
        run: bash .github/scripts/report-ccache.sh markdown-loader
      - name: Preserve exact-head DSO and compiler cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-loader-${{ matrix.os }}-${{ steps.run_head.outputs.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/highlighter-loader-contract/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/stun-ccache-stats-markdown-loader.tsv

  highlighter-tsan:
    name: Highlighter ownership / Linux TSan
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Install verified TSan C11/C++ compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: markdown-loader-tsan
          source_sha: ${{ steps.run_head.outputs.sha }}
      - name: Configure C11 provider and C++17 loader with TSan
        shell: bash
        run: |
          cmake -S flexUI/tests/highlighter_loader_contract \
            -B build/highlighter-loader-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTUN_HIGHLIGHTER_TSAN=ON
      - name: Build both sides with TSan
        shell: bash
        run: |
          cmake --build build/highlighter-loader-tsan --parallel 2 --verbose
          test -x build/highlighter-loader-tsan/test_highlighter_loader_contract
          test -f build/highlighter-loader-tsan/ts-lang-contract.so
          nm -D build/highlighter-loader-tsan/test_highlighter_loader_contract | grep '__tsan_' | head -3
          nm -D build/highlighter-loader-tsan/ts-lang-contract.so | grep '__tsan_' | head -3
      - name: Execute concurrent unload and replacement under TSan
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:report_signal_unsafe=1:second_deadlock_stack=1
        run: |
          ctest --test-dir build/highlighter-loader-tsan \
            --no-tests=error --output-on-failure --timeout 120 --verbose
      - name: Require independent TSan compiler cache evidence
        shell: bash
        run: bash .github/scripts/report-ccache.sh markdown-loader-tsan
      - name: Preserve exact-head TSan and compiler cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-loader-tsan-${{ steps.run_head.outputs.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/highlighter-loader-tsan/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/stun-ccache-stats-markdown-loader-tsan.tsv

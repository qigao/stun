name: Stun required acceptance publisher

# Publish one commit-status context on the exact PR HEAD.
# Execute only trusted default-branch source, never PR code or artifacts.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_run:
    workflows:
      - Public dependency compile contract
      - Stun runtime conformance
      - UI C11 Reflection Contract
      - GraphLayout native algorithm qualification
      - gCanvas OpenGLES runtime
      - gCanvas package contract
      - gCanvas Android EGL compile
      - gCanvas Android runtime
      - gCanvas shader toolchain cache contract
      - Markdown highlighter loader portability
      - FlexUI Tango cross-platform headless
      - Tango Native C Core
    types: [requested, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  statuses: write

# Serialize updates per SHA. Never poll or hold native runners.
concurrency:
  group: stun-required-acceptance-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish required acceptance status
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ci/full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch verifier (never the PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish exact-head fail-closed status from real native jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_required_acceptance.py

            --output-junit "$EVIDENCE_DIR/chart-json-results.xml" \
            2>&1 | tee "$EVIDENCE_DIR/chart-json-ctest.log"

          # #186: Tango C11 candidate is a regular CTest, not a TinyTest
          # binary. Its mandatory denominator is kept separate.
          cmake --build "$production_build" --target stun_markdown_tango_candidate_test \
            --parallel 2 --verbose \
            2>&1 | tee "$EVIDENCE_DIR/tango-candidate-build.log"
          ctest --test-dir "$production_build" -R '^stun_markdown_tango_candidate_test$' \
            --no-tests=error --verbose --output-on-failure --timeout 120 \
            --output-junit "$EVIDENCE_DIR/tango-candidate-results.xml" \
            2>&1 | tee "$EVIDENCE_DIR/tango-candidate-ctest.log"
          cmake --install "$production_build" --component FlexUIPlugin \
            2>&1 | tee "$EVIDENCE_DIR/flexui-install.log"
          cp "$production_build/install_manifest_FlexUIPlugin.txt" "$EVIDENCE_DIR/"

      - name: Prove bounded native Tree-sitter C highlighter
        if: ${{ inputs.run_runtime && success() }}

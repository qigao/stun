          ctest --test-dir "$production_build" \
            -R '^(test_ts_lang_c|test_ts_highlighter_dso_lifetime)$' \
            --no-tests=error --verbose --output-on-failure --timeout 120 \
            --output-junit "$EVIDENCE_DIR/tree-sitter-c-results.xml" \
            2>&1 | tee "$EVIDENCE_DIR/tree-sitter-c-ctest.log"
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import os
          evidence = Path(os.environ["EVIDENCE_DIR"])
          cases = list(ET.parse(evidence / "tree-sitter-c-results.xml")
                       .getroot().iter("testcase"))
          expected = {"test_ts_lang_c", "test_ts_highlighter_dso_lifetime"}
          assert len(cases) == 2 and {c.attrib["name"] for c in cases} == expected
          assert not any(list(c.iter(t)) for c in cases
                         for t in ("failure", "error", "skipped"))
          print("Bounded C Tree-sitter + leased DSO lifetime CTests: 2/2")
          PY

      - name: Consume installed PluginSDK and Services without host dependencies
        if: ${{ inputs.run_runtime && success() }}

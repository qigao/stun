        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$SALTS_ROOT" "$PORTS_ROOT" "$RUNNER_TEMP/stun-vcpkg-cache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
          grep -Fqx "Salts=$SALTS_SHA" build/unicode-install-evidence/provenance.txt
          grep -Fqx "SaltsUtils=$SALTS_UTILS_SHA" build/unicode-install-evidence/provenance.txt

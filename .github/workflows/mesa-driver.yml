name: Mesa driver lifecycle

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_runtime:
        type: boolean
        required: false
        default: false
      salts_sha:
        type: string
        required: false
        default: ''
      salts_utils_sha:
        type: string
        required: false
        default: ''
      salts_release:
        type: string
        required: false
        default: ''
      salts_utils_release:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: stun-mesa-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  MESA_VERSION: 25.2.8
  MESA_ARCHIVE_SHA256: 097842f3e49d996868b38688db87b006f7d4541e93ce86d2f341d8b3e7be7c93
  VCPKG_PORT_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:fast_unwind_on_malloc=0:malloc_context_size=64
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe
  # Compiler cache is an acceleration layer only: no object files or SDK
  # runtime state bypasses our original CTest, sanitizer, and driver gates.
  CCACHE_DIR: ${{ github.workspace }}/build/runtime-ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 512M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  mesa-lifecycle:
    name: ${{ inputs.run_runtime && 'Linux gCanvas windows and pixels ASan and UBSan' || 'Mesa driver baseline/patched lifecycle' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SALTS_SHA: ${{ inputs.salts_sha }}
      SALTS_UTILS_SHA: ${{ inputs.salts_utils_sha }}
      SALTS_RELEASE: ${{ inputs.salts_release }}
      SALTS_UTILS_RELEASE: ${{ inputs.salts_utils_release }}
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Mesa vcpkg L1 cache
        shell: bash
        run: echo "VCPKG_BINARY_CACHE=$RUNNER_TEMP/mesa-vcpkg-cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg cache and canonical tool
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore Mesa control dependency cache
        id: mesa_vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-vcpkg-cache
          key: stun-mesa-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-glfw3-glad-v1

      - name: Restore Mesa Python download cache
        id: mesa_pip_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: stun-mesa-pip-ubuntu24-meson-1.5.2-mako-1.3.10-pyyaml-6.0.2-packaging-24.2-v1

      - name: Restore bounded native compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: stun-runtime-ccache-ubuntu24-v1-${{ env.MESA_VERSION }}-${{ env.VCPKG_PORT_BASELINE }}-${{ inputs.salts_sha }}-${{ inputs.salts_utils_sha }}-${{ github.sha }}
          restore-keys: |
            stun-runtime-ccache-ubuntu24-v1-${{ env.MESA_VERSION }}-${{ env.VCPKG_PORT_BASELINE }}-${{ inputs.salts_sha }}-${{ inputs.salts_utils_sha }}-
            stun-runtime-ccache-ubuntu24-v1-${{ env.MESA_VERSION }}-${{ env.VCPKG_PORT_BASELINE }}-

      - name: Restore pinned Mesa source archive
        id: mesa_source_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-download-cache
          key: stun-mesa-source-${{ env.MESA_VERSION }}-${{ env.MESA_ARCHIVE_SHA256 }}

      - name: Prepare explicit build tools and driver paths
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -n "$VCPKG_TOOL_REVISION"
          test -n "$VCPKG_SCRIPTS_REVISION"
          test -n "$VCPKG_CACHE_REVISION"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_SCRIPTS_REVISION"
          mkdir -p build/mesa-evidence "$RUNNER_TEMP/mesa-xdg" \
            "$RUNNER_TEMP/mesa-vcpkg-cache" "$RUNNER_TEMP/mesa-download-cache"
          chmod 700 "$RUNNER_TEMP/mesa-xdg"
          {
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/build/mesa-evidence"
            echo "MESA_ROOT=$RUNNER_TEMP/stun-mesa-sdk"
            echo "MESA_SOURCE=$RUNNER_TEMP/mesa-$MESA_VERSION"
            echo "MESA_BUILD=$RUNNER_TEMP/mesa-build"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/mesa-xdg"
          } >> "$GITHUB_ENV"
          printf 'Stun=%s\nMesa=%s\nArchiveSHA256=%s\nvcpkg_port_baseline=%s\nvcpkg_tool=%s\nvcpkg_scripts=%s\nvcpkg_cache_revision=%s\n' \
            "$EXPECTED_HEAD" "$MESA_VERSION" "$MESA_ARCHIVE_SHA256" \
            "$VCPKG_PORT_BASELINE" "$VCPKG_TOOL_REVISION" \
            "$VCPKG_SCRIPTS_REVISION" "$VCPKG_CACHE_REVISION" \
            > build/mesa-evidence/provenance.txt
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build pkg-config bison flex llvm-20-dev \
            autoconf autoconf-archive automake libtool \
            libdrm-dev libexpat1-dev libelf-dev zlib1g-dev libzstd-dev \
            xorg-dev libwayland-dev libxkbcommon-dev libglvnd-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shm0-dev libxshmfence-dev \
            xvfb xauth mesa-utils
          command -v ccache
          ccache --version
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats
          python3 -m venv "$RUNNER_TEMP/mesa-tools"
          "$RUNNER_TEMP/mesa-tools/bin/pip" install meson==1.5.2 Mako==1.3.10 PyYAML==6.0.2 packaging==24.2
          echo "$RUNNER_TEMP/mesa-tools/bin" >> "$GITHUB_PATH"
          dpkg-query -W > build/mesa-evidence/system-packages.txt
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=cmake/ci/mesa \
            "--x-install-root=$RUNNER_TEMP/mesa-control-ports" \
            --triplet x64-linux \
            2>&1 | tee build/mesa-evidence/control-dependencies.log
      - name: Save Mesa control dependency cache
        if: steps.mesa_vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-vcpkg-cache
          key: ${{ steps.mesa_vcpkg_cache.outputs.cache-primary-key }}

      - name: Save Mesa Python download cache
        if: steps.mesa_pip_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.mesa_pip_cache.outputs.cache-primary-key }}

      - name: Verify and build the unchanged upstream driver
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          archive="$RUNNER_TEMP/mesa-download-cache/mesa-$MESA_VERSION.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://archive.mesa3d.org/mesa-$MESA_VERSION.tar.xz" -o "$archive"
          fi
          printf '%s  %s\n' "$MESA_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          test "$(cat "$MESA_SOURCE/VERSION")" = "$MESA_VERSION"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['MESA_SOURCE'])
          expected = {'src/util/u_cpu_detect.c': 'd9bf9cca7e72b44e7901c1638150df3597caf24a',
                      'src/gallium/auxiliary/rtasm/rtasm_execmem.c': '82c4d2f019cff8f7594a46c3057721401e9adb6b'}
          for name, expected_sha in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_sha, (name, actual)
          PY
          cat > "$RUNNER_TEMP/mesa-native.ini" <<'NATIVE'
          [binaries]
          c = ['ccache', 'gcc']
          cpp = ['ccache', 'g++']
          llvm-config = '/usr/bin/llvm-config-20'
          NATIVE
          meson setup "$MESA_BUILD" "$MESA_SOURCE" \
            --native-file "$RUNNER_TEMP/mesa-native.ini" \
            --prefix "$MESA_ROOT" --libdir lib --buildtype debugoptimized \
            -Dplatforms=x11 -Dgallium-drivers=llvmpipe -Dvulkan-drivers=[] \
            -Dglx=dri -Dglvnd=enabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dllvm=enabled \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-rusticl=false \
            -Dbuild-tests=false -Dc_args=-fno-omit-frame-pointer -Dcpp_args=-fno-omit-frame-pointer \
            2>&1 | tee "$EVIDENCE_DIR/mesa-configure.log"
          meson compile -C "$MESA_BUILD" -j 2 2>&1 | tee "$EVIDENCE_DIR/mesa-baseline-build.log"
          meson install -C "$MESA_BUILD" 2>&1 | tee "$EVIDENCE_DIR/mesa-baseline-install.log"
          driver="$MESA_ROOT/lib/libgallium-$MESA_VERSION.so"
          test -f "$driver"
          glx=$(readlink -e "$MESA_ROOT/lib/libGLX_mesa.so.0")
          test "$glx" = "$MESA_ROOT/lib/libGLX_mesa.so.0.0.0"
          {
            echo "MESA_EXPECTED_DRIVER=$driver"
            echo "MESA_EXPECTED_GLX=$glx"
          } >> "$GITHUB_ENV"
          readelf -d "$glx" > "$EVIDENCE_DIR/baseline-glx-dynamic.txt"
          sha256sum "$driver" > "$EVIDENCE_DIR/baseline-driver.sha256"
          readelf -d "$driver" > "$EVIDENCE_DIR/baseline-driver-dynamic.txt"
          cmake -S cmake/ci/mesa -B build/mesa-control -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$RUNNER_TEMP/mesa-control-ports"
          cmake --build build/mesa-control --parallel 2 --verbose
          cp build/mesa-control/compile_commands.json "$EVIDENCE_DIR/control-compile-commands.json"

      - name: Save pinned Mesa source archive
        if: steps.mesa_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-download-cache
          key: ${{ steps.mesa_source_cache.outputs.cache-primary-key }}
      - name: Compare identical controls before and after the owner fix
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          xvfb-run -a python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          binary = Path('build/mesa-control/mesa_driver_control').resolve(strict=True)
          driver = Path(os.environ['MESA_EXPECTED_DRIVER'])
          source = Path(os.environ['MESA_SOURCE'])
          build = Path(os.environ['MESA_BUILD'])
          patch = Path('cmake/ci/mesa/module-cleanup.patch').resolve(strict=True)
          binary_hash = hashlib.sha256(binary.read_bytes()).hexdigest()
          rows = []
          glx = Path(os.environ['MESA_EXPECTED_GLX']).resolve(strict=True)
          control_env = os.environ.copy()
          # Only the control selects this installed GLX/Gallium pair. Build tools
          # and Xvfb keep their normal environment; no source-tree driver is used.
          control_env['LD_LIBRARY_PATH'] = str(driver.parent)
          control_env['__GLX_VENDOR_LIBRARY_NAME'] = 'mesa'
          control_env.pop('LIBGL_DRIVERS_PATH', None)
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          for variant in ('baseline', 'patched'):
              if variant == 'patched':
                  subprocess.run(['git', 'apply', '--check', str(patch)], cwd=source, check=True)
                  subprocess.run(['git', 'apply', str(patch)], cwd=source, check=True)
                  (evidence / 'module-cleanup.patch').write_bytes(patch.read_bytes())
                  for operation in ('compile', 'install'):
                      command = ['meson', operation, '-C', str(build)]
                      if operation == 'compile': command += ['-j', '2']
                      with (evidence / f'mesa-patched-{operation}.log').open('w') as log:
                          subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True)
                  assert hashlib.sha256(binary.read_bytes()).hexdigest() == binary_hash
              for mode in readbacks:
                  for cycles in (1, 4):
                      result = subprocess.run([str(binary), mode, str(cycles)], text=True,
                                              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180, env=control_env)
                      log = result.stdout
                      name = f'{variant}-{mode}-{cycles}.log'
                      (evidence / name).write_text(log)
                      row = {'variant': variant, 'mode': mode, 'cycles': cycles,
                             'exit_code': result.returncode, 'pixel_checks': log.count('pixel-readback=passed'),
                             'completed': 'application-checks=passed;' in log,
                             'leaks': re.findall(r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log)}
                      rows.append(row)
                      (evidence / 'results.json').write_text(json.dumps(rows, indent=2) + '\n')
                      print(json.dumps(row), flush=True)
                      assert row['completed'] and row['pixel_checks'] == readbacks[mode] * cycles, row
                      assert log.count('teardown=completed') == cycles, row
                      assert 'runtime error:' not in log and 'ERROR: AddressSanitizer:' not in log, row
                      if variant == 'patched' or mode == 'init':
                          assert result.returncode == 0 and not row['leaks'], row
                      elif mode in ('draw', 'overlap', 'threads'):
                          assert result.returncode != 0 and row['leaks'], 'Baseline must reproduce the lost caches'
              (evidence / f'{variant}-driver.sha256').write_text(
                  hashlib.sha256(driver.read_bytes()).hexdigest() + '  ' + str(driver) + '\n')
              (evidence / f'{variant}-glx.sha256').write_text(
                  hashlib.sha256(glx.read_bytes()).hexdigest() + '  ' + str(glx) + '\n')
          assert len(rows) == 20
          assert (evidence / 'baseline-driver.sha256').read_text() != (evidence / 'patched-driver.sha256').read_text()
          (evidence / 'control-binary.sha256').write_text(binary_hash + '\n')
          print('Unchanged control binary; baseline leaks reproduced; all ten patched processes passed.')
          PY
          cp "$MESA_BUILD/compile_commands.json" "$EVIDENCE_DIR/mesa-compile-commands.json"
          cp "$MESA_BUILD/meson-info/intro-buildoptions.json" "$EVIDENCE_DIR/mesa-build-options.json"
          cp "$MESA_SOURCE/src/util/u_cpu_detect.c" "$EVIDENCE_DIR/patched-u_cpu_detect.c"
          cp "$MESA_SOURCE/src/gallium/auxiliary/rtasm/rtasm_execmem.c" "$EVIDENCE_DIR/patched-rtasm_execmem.c"
          readelf -d "$MESA_EXPECTED_DRIVER" > "$EVIDENCE_DIR/patched-driver-dynamic.txt"
          tar -C "$MESA_ROOT" -cJf "$EVIDENCE_DIR/mesa-sdk.tar.xz" .
          sha256sum "$EVIDENCE_DIR/mesa-sdk.tar.xz" > "$EVIDENCE_DIR/mesa-sdk.sha256"
          git diff --exit-code
      - name: Collect available configure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$MESA_BUILD/meson-logs/meson-log.txt" ]; then
            cp "$MESA_BUILD/meson-logs/meson-log.txt" "$EVIDENCE_DIR/meson-log.txt"
          fi
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-driver-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/mesa-evidence
          if-no-files-found: error

      # All runtime gates reuse this Mesa runner and exact SDK graph.
      - name: Checkout released Salts
        if: ${{ inputs.run_runtime && success() }}
        id: unicode_source_checkout
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: .ci/salts
          persist-credentials: false

      - name: Restore shared re2c binary
        if: ${{ inputs.run_runtime && success() }}
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Record source provenance
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
          test "$(git -C .ci/salts rev-parse HEAD)" = "$SALTS_SHA"
          printf 'Stun: %s\nSalts: %s\n' "$EXPECTED_STUN_SHA" "$SALTS_SHA"
          cc --version
          c++ --version


      # This is an executable source-level bridge test, not an installed SDK
      # or full FlexUI build. No mock decoder or replacement Salts target is used.
      - name: Generate and compile the real Unicode scanner and TinyTest
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unicode-runtime
          test "$(re2c --version)" = 're2c 4.6'
          re2c --lang c --utf8 --encoding-policy fail --no-generation-date -W -Werror \
            -I "$RE2C_ROOT/share/re2c/stdlib" \
            -o build/unicode-runtime/salts_unicode_gen.c \
            .ci/salts/unicode/src/salts_unicode.re
          headers=(
            -I .ci/salts/unicode/src
            -isystem .ci/salts/unicode/include
            -isystem .ci/salts/utils/include
            -isystem .ci/salts/utils/parser
            -isystem .ci/salts/platform/include
            -isystem .ci/salts/concurrency/include
            -isystem .ci/salts/cmeta/include
            -isystem .ci/salts/tinytest/include
          )
          flags=(-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer)
          cc -std=c11 -D_DEFAULT_SOURCE -D_POSIX_C_SOURCE=200809L "${flags[@]}" "${headers[@]}" \
            -c build/unicode-runtime/salts_unicode_gen.c -o build/unicode-runtime/unicode.o
          cc -std=c11 -D_DEFAULT_SOURCE -D_POSIX_C_SOURCE=200809L "${flags[@]}" "${headers[@]}" \
            -c .ci/salts/unicode/src/salts_unicode_emoji.c -o build/unicode-runtime/unicode_emoji.o
          cc -std=c11 -D_DEFAULT_SOURCE -D_POSIX_C_SOURCE=200809L "${flags[@]}" "${headers[@]}" \
            -c .ci/salts/tinytest/src/tinytest.c -o build/unicode-runtime/tinytest.o
          c++ -std=c++17 -Wall -Wextra -Werror "${flags[@]}" "${headers[@]}" -IflexUI/include \
            flexUI/src/text_util.cpp flexUI/tests/test_text_util_unicode.cpp \
            build/unicode-runtime/unicode.o build/unicode-runtime/unicode_emoji.o \
            build/unicode-runtime/tinytest.o -pthread -ldl -lm \
            -o build/unicode-runtime/test_text_util_unicode

      - name: Run strict Unicode behavior tests
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          timeout 120s build/unicode-runtime/test_text_util_unicode 2>&1 \
            | tee build/unicode-runtime/test.log
          {
            echo '### Unicode runtime validation'
            echo 'Executed the released Salts::Unicode scanner and FlexUI text utility tests with ASan/UBSan.'
            echo 'Scope: source-level runtime; installed-package and full-GUI integration are separate gates.'
            echo '```text'
            cat build/unicode-runtime/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tracked source was not modified
        if: ${{ always() && inputs.run_runtime && steps.unicode_source_checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git -C .ci/salts diff --exit-code

      - name: Reuse exact Salts checkout for installed SDK
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/install-sources
          test ! -e .ci/install-sources/salts
          mv .ci/salts .ci/install-sources/salts
          test "$(git -C .ci/install-sources/salts rev-parse HEAD)" = "$SALTS_SHA"
          git -C .ci/install-sources/salts diff --exit-code

      - name: Checkout released SaltsUtils
        if: ${{ inputs.run_runtime && success() }}
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_SHA }}
          path: .ci/install-sources/salts-utils
          persist-credentials: false


      - name: Select Unicode vcpkg L1 cache
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        run: echo "VCPKG_BINARY_CACHE=$RUNNER_TEMP/stun-vcpkg-cache" >> "$GITHUB_ENV"

      - name: Define isolated paths on the runner
        if: ${{ inputs.run_runtime && success() }}
        id: unicode_paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'EVIDENCE_DIR=%s/build/unicode-install-evidence\n' "$GITHUB_WORKSPACE"
            printf 'SALTS_ROOT=%s/stun-unicode-sdk\n' "$RUNNER_TEMP"
            printf 'PACKAGE_BUILD_ROOT=%s/stun-unicode-package-build\n' "$RUNNER_TEMP"
            printf 'EXTERNAL_PORTS_ROOT=%s/stun-unicode-external-ports\n' "$RUNNER_TEMP"
            printf 'FLEXUI_INSTALL_ROOT=%s/stun-flexui-sdk\n' "$RUNNER_TEMP"
            printf 'LD_LIBRARY_PATH=%s/stun-unicode-sdk/lib\n' "$RUNNER_TEMP"
            printf 'ASAN_OPTIONS=detect_leaks=1:halt_on_error=1\n'
            printf 'UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1\n'
          } >> "$GITHUB_ENV"

      - name: Cache pinned third-party packages
        if: ${{ inputs.run_runtime && success() }}
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/stun-vcpkg-cache
          key: stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}-flexui-v2
          restore-keys: |
            stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}-flexui-v1
            stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}

      - name: Prepare isolated tools and evidence
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$SALTS_ROOT" "$EXTERNAL_PORTS_ROOT" "$RUNNER_TEMP/stun-vcpkg-cache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
          test "$(git -C .ci/install-sources/salts rev-parse HEAD)" = "$SALTS_SHA"
          test "$(git -C .ci/install-sources/salts-utils rev-parse HEAD)" = "$SALTS_UTILS_SHA"
          test -n "$VCPKG_TOOL_REVISION"
          test -n "$VCPKG_SCRIPTS_REVISION"
          test -n "$VCPKG_CACHE_REVISION"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_SCRIPTS_REVISION"
          printf 'Stun=%s\nSalts=%s\nSaltsUtils=%s\nvcpkg_port_baseline=%s\nvcpkg_tool=%s\nvcpkg_scripts=%s\nvcpkg_cache_revision=%s\n' \
            "$EXPECTED_STUN_SHA" "$SALTS_SHA" "$SALTS_UTILS_SHA" \
            "$VCPKG_PORT_BASELINE" "$VCPKG_TOOL_REVISION" \
            "$VCPKG_SCRIPTS_REVISION" "$VCPKG_CACHE_REVISION" \
            | tee "$EVIDENCE_DIR/provenance.txt"
          # Mesa already refreshed apt package indices.
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/stun-build-tools" \
            cmake==3.31.6
          printf '%s\n' "$RUNNER_TEMP/stun-build-tools/cmake/data/bin" >> "$GITHUB_PATH"


      - name: Restore published Salts Native SDKs from GitHub Packages
        if: ${{ inputs.run_runtime && success() }}
        id: dependency_packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "$SALTS_RELEASE" "$SALTS_UTILS_RELEASE" "$SALTS_SHA" "$SALTS_UTILS_SHA"
          salts_version="$(printf '%s' "$SALTS_RELEASE" | sed 's/^v//')"
          utils_version="$(printf '%s' "$SALTS_UTILS_RELEASE" | sed 's/^v//')"
          test "$(gh api "repos/qigao/salts/commits/$SALTS_RELEASE" --jq .sha)" = "$SALTS_SHA"
          test "$(gh api "repos/qigao/salts-utils/commits/$SALTS_UTILS_RELEASE" --jq .sha)" = "$SALTS_UTILS_SHA"
          config=".ci/install-sources/salts/cmake/vcpkg-cache.nuget.config"
          test -f "$config"
          sdk_packages="$RUNNER_TEMP/stun-native-nuget"
          restore_root="$RUNNER_TEMP/stun-native-restore"
          mkdir -p "$sdk_packages" "$restore_root" "$SALTS_ROOT"
          cat > "$restore_root/NativeSdk.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="$salts_version" />
              <PackageReference Include="SaltsUtils.Native" Version="$utils_version" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$restore_root/NativeSdk.csproj" \
            --configfile "$config" --packages "$sdk_packages" \
            --no-cache --force-evaluate --verbosity minimal
          # Fail closed if either NuGet archive differs from the publishing
          # repository's immutable GitHub Release SHA256SUMS artifact.
          for item in "qigao/salts|$SALTS_RELEASE|salts.native" \
                      "qigao/salts-utils|$SALTS_UTILS_RELEASE|saltsutils.native"; do
            IFS='|' read -r source tag package <<< "$item"
            checks="$restore_root/checks/$package"
            mkdir -p "$checks"
            gh release download "$tag" --repo "$source" \
              --pattern SHA256SUMS --dir "$checks" --clobber
            archive="$sdk_packages/$package/$(printf '%s' "$tag" | sed 's/^v//')/$package.$(printf '%s' "$tag" | sed 's/^v//').nupkg"
            test -s "$archive"
            python3 - "$checks/SHA256SUMS" "$archive" <<'PY'
          import hashlib, pathlib, sys
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          name=pathlib.Path(sys.argv[2]).name.lower()
          matches=[row.split()[0] for row in lines if row.split() and
                   pathlib.Path(row.split()[-1].lstrip("*")).name.lower()==name]
          if len(matches)!=1: raise SystemExit("missing or duplicate official package SHA256: "+name)
          actual=hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()
          if actual.lower()!=matches[0].lower(): raise SystemExit("published package checksum mismatch: "+name)
          print("Verified published package:",name,actual)
          PY
          done
          # Preserve existing installed consumer invariant: both CMake SDKs
          # are imported from ONE isolated prefix, without source fallbacks.
          python3 - "$restore_root/obj/project.assets.json" "$sdk_packages" "$SALTS_ROOT" \
                    "$salts_version" "$utils_version" "$EVIDENCE_DIR" <<'PY'
          import hashlib,json,os,pathlib,shutil,sys
          assets=json.loads(pathlib.Path(sys.argv[1]).read_text())
          packages=pathlib.Path(sys.argv[2]); target=pathlib.Path(sys.argv[3])
          manifest={"kind":"published-native-NuGet","packages":{},"rid":"linux-x64","copied":0}
          for name,version in (("Salts.Native",sys.argv[4]),("SaltsUtils.Native",sys.argv[5])):
              ids=[v["path"] for k,v in assets["libraries"].items() if k.lower()==f"{name.lower()}/{version.lower()}"]
              if len(ids)!=1: raise SystemExit(f"missing exactly one {name}/{version}")
              root=packages/ids[0]/"sdk/linux-x64"
              archive=packages/ids[0]/f"{name.lower()}.{version}.nupkg"
              if not root.is_dir() or not archive.is_file(): raise SystemExit("published SDK payload absent "+str(root))
              manifest["packages"][name]={"version":version,"sha256":hashlib.sha256(archive.read_bytes()).hexdigest()}
              for src in sorted(root.rglob("*")):
                  dst=target/src.relative_to(root)
                  if src.is_dir() and not src.is_symlink():
                      dst.mkdir(parents=True,exist_ok=True); continue
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  if dst.exists() or dst.is_symlink():
                      if src.is_symlink() and dst.is_symlink() and os.readlink(src)==os.readlink(dst): continue
                      if src.is_file() and dst.is_file() and src.read_bytes()==dst.read_bytes(): continue
                      raise SystemExit("conflicting published SDK file "+str(dst))
                  if src.is_symlink(): dst.symlink_to(os.readlink(src))
                  elif src.is_file(): shutil.copy2(src,dst)
                  else: raise SystemExit("unexpected SDK entry "+str(src))
                  manifest["copied"]+=1
          # NuGet's ZIP format flattened native POSIX SONAME symlinks into
          # independent byte-identical files. Reconstruct *only* the verified
          # libsalts Core chain so dlopen/ldd canonicalizes to the very same
          # imported Salts::Core provider; never bypass Core identity checks.
          import re,subprocess
          core_version=sys.argv[4].split("-",1)[0]
          core=target/"lib"/("libsalts.so."+core_version)
          if not core.is_file() or core.is_symlink():
              raise SystemExit(f"missing canonical published Core DSO: {core}")
          metadata=subprocess.check_output(["readelf","-d",str(core)],text=True)
          sonames=re.findall(r"\(SONAME\).*?\[([^\]]+)\]",metadata)
          if len(sonames)!=1 or not re.fullmatch(r"libsalts[.]so[.][0-9]+(?:[.][0-9]+)*",sonames[0]):
              raise SystemExit(f"invalid released Salts Core ELF SONAME: {sonames}")
          if not core.name.startswith(sonames[0]+"."):
              raise SystemExit(f"Core SONAME is inconsistent with release: {sonames[0]} / {core.name}")
          canonical_digest=hashlib.sha256(core.read_bytes()).hexdigest()
          aliases={}
          for alias in (sonames[0],"libsalts.so"):
              path=core.parent/alias
              if not path.is_file():
                  raise SystemExit(f"missing published Core SONAME alias: {path}")
              if hashlib.sha256(path.read_bytes()).hexdigest()!=canonical_digest:
                  raise SystemExit(f"conflicting Core SONAME bytes: {path}")
              if path.is_symlink():
                  if path.resolve(strict=True)!=core.resolve(strict=True):
                      raise SystemExit(f"noncanonical Core symlink: {path}")
              else:
                  # Preserve the verified canonical ELF bytes. Only convert a
                  # byte-identical NuGet-flattened alias into a relative link.
                  path.unlink()
                  path.symlink_to(core.name)
              if path.resolve(strict=True)!=core.resolve(strict=True):
                  raise SystemExit(f"Core alias fails canonical identity: {path}")
              aliases[alias]={"target":core.name,"sha256":canonical_digest}
          manifest["canonical_core"]={"soname":sonames[0],"sha256":canonical_digest,
                                       "aliases":aliases}
          for rel in ("lib/cmake/Salts/SaltsConfig.cmake","lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"):
              if not (target/rel).is_file(): raise SystemExit("missing CMake package config "+rel)
          (pathlib.Path(sys.argv[6])/"native-sdk-provenance.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
          # vcpkg-cache remains only for third-party manifest dependencies.
          for package in salts salts-utils; do
            "$VCPKG_ROOT/vcpkg" install \
              "--x-manifest-root=$GITHUB_WORKSPACE/.ci/install-sources/$package" \
              "--x-install-root=$EXTERNAL_PORTS_ROOT/$package" \
              --triplet x64-linux --only-binarycaching \
              2>&1 | tee "$EVIDENCE_DIR/$package-ports-install.log"
          done
          test -f "$EXTERNAL_PORTS_ROOT/salts-utils/x64-linux/tools/pkgconf/pkgconf"
          printf 'NativeSDKSource=GitHubPackages\nSaltsNative=%s\nSaltsUtilsNative=%s\n' \
            "$salts_version" "$utils_version" | tee -a "$EVIDENCE_DIR/provenance.txt"


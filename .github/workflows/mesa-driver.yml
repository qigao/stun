            LD_DEBUG=files LD_DEBUG_OUTPUT="$EVIDENCE_DIR/loader" \
            ctest --test-dir build/desktop-runtime -R "$pattern" \
            --no-tests=error --verbose --output-on-failure --timeout 180 \
            --output-junit "$EVIDENCE_DIR/desktop-results.xml" \
            2>&1 | tee "$EVIDENCE_DIR/desktop-ctest.log"
      - name: Verify execution, instrumentation, and runtime ownership
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD
          sha256sum --check "$EVIDENCE_DIR/vulkan-library.sha256"
          sha256sum --check "$EVIDENCE_DIR/vulkan-loader.sha256"
          python3 cmake/ci/mesa/verify_desktop_drivers.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ['EVIDENCE_DIR'])
          build = Path('build/desktop-runtime').resolve(strict=True)
          sdk = Path(os.environ['SALTS_ROOT']).resolve(strict=True)
          expected_vulkan_loader = Path(os.environ['VULKAN_EXPECTED_LOADER']).resolve(strict=True)
          expected = {'test_gcanvas_window_host', 'test_gcanvas_plugin_window_host',
                      'gcanvas_gpu_opengl', 'gcanvas_gpu_vulkan',
                      'gcanvas_showcase_opengl', 'gcanvas_showcase_vulkan'}
          selected = json.loads((evidence / 'selected-tests.json').read_text())['tests']
          assert len(selected) == len(expected) and {t['name'] for t in selected} == expected
          cases = list(ET.parse(evidence / 'desktop-results.xml').getroot().iter('testcase'))
          assert len(cases) == len(expected) and {c.attrib['name'] for c in cases} == expected
          assert not any(list(c.iter(tag)) for c in cases for tag in ('failure', 'error', 'skipped'))
          log = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', (evidence / 'desktop-ctest.log').read_text())
          assert not re.search(r'VULKAN VALIDATION \[(ERROR|WARNING)\]|ERROR: AddressSanitizer:|runtime error:', log)

          # LeakSanitizer stays enabled. Only independently tracked upstream
          # GLFW/X11 owners (#45/#47/#65) may remain; any new owner is fatal.
          leak_blocks = re.findall(
              r'((?:\d+: )?(?:Direct|Indirect) leak of \d+ byte\(s\).*?)(?=(?:\n(?:\d+: )?(?:Direct|Indirect) leak of \d+ byte\(s\))|(?:\n(?:\d+: )?SUMMARY: AddressSanitizer:)|\Z)',
              log, re.S)
          leak_owners = {'x11_init': 0, 'glfw_glx': 0}
          for block in leak_blocks:
              if re.search(r'_glfw(?:Connect|Init)X11.*?src/x11_init\.c', block, re.S):
                  leak_owners['x11_init'] += 1
              elif re.search(r'(?:extensionSupportedGLX|_glfwInitGLX).*?src/glx_context\.c', block, re.S):
                  leak_owners['glfw_glx'] += 1
              else:
                  raise AssertionError(block)
              assert not re.search(r'libgallium|rtasm_execmem|u_cpu_detect|mesa-build', block, re.I), block
          leak_summaries = re.findall(
              r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log)
          assert bool(leak_blocks) == bool(leak_summaries)
          totals = {}
          for status in ('PASSED', 'FAILED', 'SKIPPED', 'FILTERED', 'TODO'):
              counts = [int(n) for n in re.findall(rf'Total tests \[{status}\]:\s*(\d+)', log)]
              assert len(counts) == 2, (status, counts)
              assert all(n > 0 if status == 'PASSED' else n == 0 for n in counts), (status, counts)
              totals[status] = sum(counts)
          assertions = re.findall(r'Assertions:\s*(\d+) passed,\s*(\d+) failed', log)
          assert len(assertions) == 2 and all(int(f) == 0 for _, f in assertions)
          totals['assertions_passed'] = sum(int(p) for p, _ in assertions)
          commands_text = (build / 'compile_commands.json').read_text()
          commands = json.loads(commands_text)
          for suffix in ('flexUI/modules/desktop/gcanvas_window_host.cpp',
                         'flexUI/modules/desktop/gcanvas_plugin_window_host.cpp',
                         'flex/render/engines/gcanvas/renderer.cpp',
                         'shared/gcanvas/src/window_impl.cpp',
                         'shared/gcanvas/src/backends/gl/context_impl_gl.cpp',
                         'shared/gcanvas/src/backends/opengl/context_opengl.cpp',
                         'shared/gcanvas/src/backends/vulkan/context_impl_vulkan.cpp'):
              matching = [c for c in commands if c['file'].endswith(suffix)]
              assert len(matching) == 1, suffix
              assert all(flag in matching[0]['command'] for flag in ('-fsanitize=address', '-fsanitize=undefined')), suffix
          forbidden = [str(Path(os.environ['GITHUB_WORKSPACE']) / '.ci/sources'),
                       os.environ['PACKAGE_BUILD_ROOT'],
                       str(Path(os.environ['RUNNER_TEMP']) / 'stun-desktop-quarantine')]
          assert all(not Path(p).exists() for p in forbidden[:2])
          link_text = (evidence / 'desktop-build.log').read_text()
          assert all(p not in commands_text + link_text for p in forbidden)
          providers = {}
          for name in ('test_gcanvas_window_host', 'test_gcanvas_plugin_window_host',
                       'gcanvas_gpu_test', 'gcanvas_showcase'):
              binary = build / 'bin' / name
              dynamic = subprocess.check_output(['readelf', '-d', str(binary)], text=True)
              loader = subprocess.check_output(['ldd', str(binary)], text=True)
              (evidence / f'{name}-dynamic.txt').write_text(dynamic + '\n' + loader)
              assert 'not found' not in loader and not re.search(r'libturbo[^/\s]*\.(?:so|a)', loader, re.I)
              assert all(p not in dynamic + loader for p in forbidden)
              core = set()
              vulkan_loaders = set()
              for raw in re.findall(r'=>\s+(/\S+)\s+\(', loader):
                  path = Path(raw).resolve(strict=True)
                  if path.name.startswith('libsalts'):
                      assert path.is_relative_to(sdk), path
                  if re.fullmatch(r'libsalts(?:[_-]core)?\.so(?:\.\d+)*', path.name, re.I):
                      core.add(str(path))
                  if re.fullmatch(r'libvulkan\.so(?:\.\d+)*', path.name):
                      vulkan_loaders.add(path)
              assert vulkan_loaders <= {expected_vulkan_loader}, (name, vulkan_loaders)
              assert len(core) == (1 if name.startswith('test_') else 0), (name, core)
              providers[name] = {'core': sorted(core),
                                 'vulkan_loader': sorted(map(str, vulkan_loaders))}
          result = {'ctest_passed': len(cases), 'tinytest': totals,
                    'runtime_providers': providers,
                    'known_upstream_leak_blocks': len(leak_blocks),
                    'known_upstream_leak_owners': leak_owners,
                    'known_upstream_leak_summaries': leak_summaries,
                    'driver_runtime_providers': json.loads((evidence / 'desktop-driver-providers.json').read_text()),
                    'scope': 'Linux Xvfb, patched Mesa llvmpipe and distribution Lavapipe; real FlexUI window/plugin lifecycle and gCanvas pixel/showcase tests. No physical GPU, TurboScript editor, installed desktop, or Windows/macOS claim.'}
          (evidence / 'desktop-evidence.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
          git diff --exit-code
          {
            echo '### Real gCanvas window and renderer validation'
            echo '```json'
            cat "$EVIDENCE_DIR/desktop-evidence.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Cache telemetry includes Mesa Meson + all CMake compiler-launcher
      # invocations in this one runner. No semantic assertion depends on hits.
      - name: Report compiler cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then

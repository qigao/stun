              elif component == 'host':
                  expected.update(('Services', 'Host', 'Core', 'Toml'))
              assert len(pairs) == len(expected) and {key for key, _ in pairs} == expected
              for key, raw in pairs:
                  prefix = sdk if key in ('Core', 'Toml') else flexui_sdk
                  for value in raw.split(';'):

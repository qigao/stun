              assert all(path not in command_text for path in forbidden), component
              pairs = [line.split('=', 1) for line in (build / 'installed-component-Debug.txt').read_text().splitlines()]
              expected = {'FlexUIConfig', 'Includes'}
              if component == 'Services':

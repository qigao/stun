      - name: Define isolated paths
        if: ${{ inputs.run_runtime && success() }}
        id: desktop_paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SALTS_SHA" && test -n "$SALTS_UTILS_SHA"
          test -f "$RUNNER_TEMP/stun-unicode-sdk/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$RUNNER_TEMP/stun-unicode-sdk/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"

name: Mesa driver lifecycle

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: stun-mesa-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  MESA_VERSION: 25.2.8
  MESA_ARCHIVE_SHA256: 097842f3e49d996868b38688db87b006f7d4541e93ce86d2f341d8b3e7be7c93
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:fast_unwind_on_malloc=0:malloc_context_size=64
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe

jobs:
  mesa-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_SHA }}
          path: .ci/vcpkg
          persist-credentials: false
      - name: Restore Mesa control dependency cache
        id: mesa_vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-vcpkg-cache
          key: stun-mesa-vcpkg-ubuntu24-${{ env.VCPKG_SHA }}-glfw3-glad-v1

      - name: Restore Mesa Python download cache
        id: mesa_pip_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: stun-mesa-pip-ubuntu24-meson-1.5.2-mako-1.3.10-pyyaml-6.0.2-packaging-24.2-v1

      - name: Restore pinned Mesa source archive
        id: mesa_source_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-download-cache
          key: stun-mesa-source-${{ env.MESA_VERSION }}-${{ env.MESA_ARCHIVE_SHA256 }}

      - name: Prepare explicit build tools and driver paths
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C .ci/vcpkg rev-parse HEAD)" = "$VCPKG_SHA"
          mkdir -p build/mesa-evidence "$RUNNER_TEMP/mesa-xdg" \
            "$RUNNER_TEMP/mesa-vcpkg-cache" "$RUNNER_TEMP/mesa-download-cache"
          chmod 700 "$RUNNER_TEMP/mesa-xdg"
          {
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/build/mesa-evidence"
            echo "MESA_ROOT=$RUNNER_TEMP/stun-mesa-sdk"
            echo "MESA_SOURCE=$RUNNER_TEMP/mesa-$MESA_VERSION"
            echo "MESA_BUILD=$RUNNER_TEMP/mesa-build"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/mesa-xdg"
            echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/mesa-vcpkg-cache,readwrite"
          } >> "$GITHUB_ENV"
          printf 'Stun=%s\nMesa=%s\nArchiveSHA256=%s\nvcpkg=%s\n' \
            "$EXPECTED_HEAD" "$MESA_VERSION" "$MESA_ARCHIVE_SHA256" "$VCPKG_SHA" \
            > build/mesa-evidence/provenance.txt
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bison flex llvm-20-dev \
            libdrm-dev libexpat1-dev libelf-dev zlib1g-dev libzstd-dev \
            xorg-dev libwayland-dev libxkbcommon-dev libglvnd-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shm0-dev libxshmfence-dev \
            xvfb xauth mesa-utils
          python3 -m venv "$RUNNER_TEMP/mesa-tools"
          "$RUNNER_TEMP/mesa-tools/bin/pip" install meson==1.5.2 Mako==1.3.10 PyYAML==6.0.2 packaging==24.2
          echo "$RUNNER_TEMP/mesa-tools/bin" >> "$GITHUB_PATH"
          dpkg-query -W > build/mesa-evidence/system-packages.txt
          .ci/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          .ci/vcpkg/vcpkg install --classic --triplet x64-linux \
            "--x-install-root=$RUNNER_TEMP/mesa-control-ports" glfw3 glad \
            2>&1 | tee build/mesa-evidence/control-dependencies.log
      - name: Save Mesa control dependency cache
        if: steps.mesa_vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-vcpkg-cache
          key: ${{ steps.mesa_vcpkg_cache.outputs.cache-primary-key }}

      - name: Save Mesa Python download cache
        if: steps.mesa_pip_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.mesa_pip_cache.outputs.cache-primary-key }}

      - name: Verify and build the unchanged upstream driver
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          archive="$RUNNER_TEMP/mesa-download-cache/mesa-$MESA_VERSION.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://archive.mesa3d.org/mesa-$MESA_VERSION.tar.xz" -o "$archive"
          fi
          printf '%s  %s\n' "$MESA_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          test "$(cat "$MESA_SOURCE/VERSION")" = "$MESA_VERSION"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['MESA_SOURCE'])
          expected = {'src/util/u_cpu_detect.c': 'd9bf9cca7e72b44e7901c1638150df3597caf24a',
                      'src/gallium/auxiliary/rtasm/rtasm_execmem.c': '82c4d2f019cff8f7594a46c3057721401e9adb6b'}
          for name, expected_sha in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_sha, (name, actual)
          PY
          cat > "$RUNNER_TEMP/mesa-native.ini" <<'NATIVE'
          [binaries]
          c = 'gcc'
          cpp = 'g++'
          llvm-config = '/usr/bin/llvm-config-20'
          NATIVE
          meson setup "$MESA_BUILD" "$MESA_SOURCE" \
            --native-file "$RUNNER_TEMP/mesa-native.ini" \
            --prefix "$MESA_ROOT" --libdir lib --buildtype debugoptimized \
            -Dplatforms=x11 -Dgallium-drivers=llvmpipe -Dvulkan-drivers=[] \
            -Dglx=dri -Dglvnd=enabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dllvm=enabled \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-rusticl=false \
            -Dbuild-tests=false -Dc_args=-fno-omit-frame-pointer -Dcpp_args=-fno-omit-frame-pointer \
            2>&1 | tee "$EVIDENCE_DIR/mesa-configure.log"
          meson compile -C "$MESA_BUILD" -j 2 2>&1 | tee "$EVIDENCE_DIR/mesa-baseline-build.log"
          meson install -C "$MESA_BUILD" 2>&1 | tee "$EVIDENCE_DIR/mesa-baseline-install.log"
          driver="$MESA_ROOT/lib/libgallium-$MESA_VERSION.so"
          test -f "$driver"
          glx=$(readlink -e "$MESA_ROOT/lib/libGLX_mesa.so.0")
          test "$glx" = "$MESA_ROOT/lib/libGLX_mesa.so.0.0.0"
          {
            echo "MESA_EXPECTED_DRIVER=$driver"
            echo "MESA_EXPECTED_GLX=$glx"
          } >> "$GITHUB_ENV"
          readelf -d "$glx" > "$EVIDENCE_DIR/baseline-glx-dynamic.txt"
          sha256sum "$driver" > "$EVIDENCE_DIR/baseline-driver.sha256"
          readelf -d "$driver" > "$EVIDENCE_DIR/baseline-driver-dynamic.txt"
      - name: Save pinned Mesa source archive
        if: steps.mesa_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-download-cache
          key: ${{ steps.mesa_source_cache.outputs.cache-primary-key }}
          cmake -S cmake/ci/mesa -B build/mesa-control -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.ci/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$RUNNER_TEMP/mesa-control-ports"
          cmake --build build/mesa-control --parallel 2 --verbose
          cp build/mesa-control/compile_commands.json "$EVIDENCE_DIR/control-compile-commands.json"
      - name: Compare identical controls before and after the owner fix
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          xvfb-run -a python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          binary = Path('build/mesa-control/mesa_driver_control').resolve(strict=True)
          driver = Path(os.environ['MESA_EXPECTED_DRIVER'])
          source = Path(os.environ['MESA_SOURCE'])
          build = Path(os.environ['MESA_BUILD'])
          patch = Path('cmake/ci/mesa/module-cleanup.patch').resolve(strict=True)
          binary_hash = hashlib.sha256(binary.read_bytes()).hexdigest()
          rows = []
          glx = Path(os.environ['MESA_EXPECTED_GLX']).resolve(strict=True)
          control_env = os.environ.copy()
          # Only the control selects this installed GLX/Gallium pair. Build tools
          # and Xvfb keep their normal environment; no source-tree driver is used.
          control_env['LD_LIBRARY_PATH'] = str(driver.parent)
          control_env['__GLX_VENDOR_LIBRARY_NAME'] = 'mesa'
          control_env.pop('LIBGL_DRIVERS_PATH', None)
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          for variant in ('baseline', 'patched'):
              if variant == 'patched':
                  subprocess.run(['git', 'apply', '--check', str(patch)], cwd=source, check=True)
                  subprocess.run(['git', 'apply', str(patch)], cwd=source, check=True)
                  (evidence / 'module-cleanup.patch').write_bytes(patch.read_bytes())
                  for operation in ('compile', 'install'):
                      command = ['meson', operation, '-C', str(build)]
                      if operation == 'compile': command += ['-j', '2']
                      with (evidence / f'mesa-patched-{operation}.log').open('w') as log:
                          subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True)
                  assert hashlib.sha256(binary.read_bytes()).hexdigest() == binary_hash
              for mode in readbacks:
                  for cycles in (1, 4):
                      result = subprocess.run([str(binary), mode, str(cycles)], text=True,
                                              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180, env=control_env)
                      log = result.stdout
                      name = f'{variant}-{mode}-{cycles}.log'
                      (evidence / name).write_text(log)
                      row = {'variant': variant, 'mode': mode, 'cycles': cycles,
                             'exit_code': result.returncode, 'pixel_checks': log.count('pixel-readback=passed'),
                             'completed': 'application-checks=passed;' in log,
                             'leaks': re.findall(r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log)}
                      rows.append(row)
                      (evidence / 'results.json').write_text(json.dumps(rows, indent=2) + '\n')
                      print(json.dumps(row), flush=True)
                      assert row['completed'] and row['pixel_checks'] == readbacks[mode] * cycles, row
                      assert log.count('teardown=completed') == cycles, row
                      assert 'runtime error:' not in log and 'ERROR: AddressSanitizer:' not in log, row
                      if variant == 'patched' or mode == 'init':
                          assert result.returncode == 0 and not row['leaks'], row
                      elif mode in ('draw', 'overlap', 'threads'):
                          assert result.returncode != 0 and row['leaks'], 'Baseline must reproduce the lost caches'
              (evidence / f'{variant}-driver.sha256').write_text(
                  hashlib.sha256(driver.read_bytes()).hexdigest() + '  ' + str(driver) + '\n')
              (evidence / f'{variant}-glx.sha256').write_text(
                  hashlib.sha256(glx.read_bytes()).hexdigest() + '  ' + str(glx) + '\n')
          assert len(rows) == 20
          assert (evidence / 'baseline-driver.sha256').read_text() != (evidence / 'patched-driver.sha256').read_text()
          (evidence / 'control-binary.sha256').write_text(binary_hash + '\n')
          print('Unchanged control binary; baseline leaks reproduced; all ten patched processes passed.')
          PY
          cp "$MESA_BUILD/compile_commands.json" "$EVIDENCE_DIR/mesa-compile-commands.json"
          cp "$MESA_BUILD/meson-info/intro-buildoptions.json" "$EVIDENCE_DIR/mesa-build-options.json"
          cp "$MESA_SOURCE/src/util/u_cpu_detect.c" "$EVIDENCE_DIR/patched-u_cpu_detect.c"
          cp "$MESA_SOURCE/src/gallium/auxiliary/rtasm/rtasm_execmem.c" "$EVIDENCE_DIR/patched-rtasm_execmem.c"
          readelf -d "$MESA_EXPECTED_DRIVER" > "$EVIDENCE_DIR/patched-driver-dynamic.txt"
          tar -C "$MESA_ROOT" -cJf "$EVIDENCE_DIR/mesa-sdk.tar.xz" .
          sha256sum "$EVIDENCE_DIR/mesa-sdk.tar.xz" > "$EVIDENCE_DIR/mesa-sdk.sha256"
          git diff --exit-code
      - name: Collect available configure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$MESA_BUILD/meson-logs/meson-log.txt" ]; then
            cp "$MESA_BUILD/meson-logs/meson-log.txt" "$EVIDENCE_DIR/meson-log.txt"
          fi
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-driver-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/mesa-evidence
          if-no-files-found: error

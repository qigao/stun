            echo "SALTS_UTILS_ROOT=$RUNNER_TEMP/stun-unicode-sdk"
            echo "PACKAGE_BUILD_ROOT=$RUNNER_TEMP/stun-unicode-package-build"
            echo "PORTS_ROOT=$RUNNER_TEMP/stun-unicode-external-ports"
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/build/desktop-evidence"
            echo "MESA_ROOT=$RUNNER_TEMP/stun-mesa-sdk"
            echo "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1"
            echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"

          assert not any(list(c.iter(t)) for c in cases
                         for t in ("failure", "error", "skipped"))
          print("Bounded C Tree-sitter + leased DSO lifetime CTests: 2/2")
          PY

      - name: Consume installed PluginSDK and Services without host dependencies
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        run: |
          set -euo pipefail

      - name: Verify driver package and exact-head lifecycle receipt
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          source = Path('build/mesa-evidence')
          root = Path(os.environ['MESA_ROOT'])
          evidence = Path(os.environ['EVIDENCE_DIR'])
          provenance = dict(line.split('=', 1) for line in (source / 'provenance.txt').read_text().splitlines())
          assert provenance['Stun'] == os.environ['EXPECTED_STUN_SHA'], provenance
          assert provenance['vcpkg_port_baseline'] == os.environ['VCPKG_PORT_BASELINE'], provenance
          patch = Path('cmake/ci/mesa/module-cleanup.patch')
          assert patch.read_bytes() == (source / 'module-cleanup.patch').read_bytes()
          rows = json.loads((source / 'results.json').read_text())
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          assert len(rows) == 20
          assert {(r['variant'], r['mode'], r['cycles']) for r in rows} == {
              (v, m, n) for v in ('baseline', 'patched') for m in readbacks for n in (1, 4)}
          for row in rows:
              assert row['completed'] and row['pixel_checks'] == readbacks[row['mode']] * row['cycles'], row
              if row['variant'] == 'patched' or row['mode'] == 'init':
                  assert row['exit_code'] == 0 and not row['leaks'], row
              elif row['mode'] in ('draw', 'overlap', 'threads'):
                  assert row['exit_code'] != 0 and row['leaks'], row
          archive = source / 'mesa-sdk.tar.xz'
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive_hash == (source / 'mesa-sdk.sha256').read_text().split()[0]
          # Mesa just built and patched this very installation on this
          # runner. Verify its existing bytes without archive re-extraction.
          assert root.is_dir(), root
          assert (root / 'lib').is_dir()
          libs = {}
          for filename, report in ((f"libgallium-{provenance['Mesa']}.so", 'patched-driver.sha256'),
                                   ('libGLX_mesa.so.0.0.0', 'patched-glx.sha256')):
              path = (root / 'lib' / filename).resolve(strict=True)
              assert path.parent == (root / 'lib').resolve(strict=True)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == (source / report).read_text().split()[0], path
              libs[filename] = digest
          assert (root / 'lib/libGLX_mesa.so.0').resolve(strict=True) == root / 'lib/libGLX_mesa.so.0.0.0'
          assert not any(p.name.startswith('libsalts') for p in (root / 'lib').iterdir())
          receipt = {'source_head': provenance['Stun'], 'workflow_run': os.environ['GITHUB_RUN_ID'],
                     'mesa_version': provenance['Mesa'], 'source_archive_sha256': provenance['ArchiveSHA256'],
                     'package_sha256': archive_hash, 'patch_sha256': hashlib.sha256(patch.read_bytes()).hexdigest(),
                     'libraries': libs, 'patched_processes': 10, 'patched_pixel_checks': 65}
          (evidence / 'mesa-package.json').write_text(json.dumps(receipt, indent=2) + '\n')
          shutil.copyfile(source / 'provenance.txt', evidence / 'mesa-provenance.txt')
          shutil.copyfile(source / 'results.json', evidence / 'mesa-lifecycle-results.json')
          print(json.dumps(receipt, indent=2))
          PY


name: Mesa driver lifecycle

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_desktop:
        type: boolean
        required: false
        default: false
      salts_sha:
        type: string
        required: false
        default: ''
      salts_utils_sha:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: stun-mesa-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  MESA_VERSION: 25.2.8
  MESA_ARCHIVE_SHA256: 097842f3e49d996868b38688db87b006f7d4541e93ce86d2f341d8b3e7be7c93
  VCPKG_PORT_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:fast_unwind_on_malloc=0:malloc_context_size=64
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe

jobs:
  mesa-lifecycle:
    name: ${{ inputs.run_desktop && 'Linux gCanvas windows and pixels ASan and UBSan' || 'Mesa driver baseline/patched lifecycle' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SALTS_SHA: ${{ inputs.salts_sha }}
      SALTS_UTILS_SHA: ${{ inputs.salts_utils_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Mesa vcpkg L1 cache
        shell: bash
        run: echo "VCPKG_BINARY_CACHE=$RUNNER_TEMP/mesa-vcpkg-cache" >> "$GITHUB_ENV"

      - name: Configure shared vcpkg cache and canonical tool
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore Mesa control dependency cache
        id: mesa_vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-vcpkg-cache
          key: stun-mesa-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-glfw3-glad-v1

      - name: Restore Mesa Python download cache
        id: mesa_pip_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: stun-mesa-pip-ubuntu24-meson-1.5.2-mako-1.3.10-pyyaml-6.0.2-packaging-24.2-v1

      - name: Restore pinned Mesa source archive
        id: mesa_source_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-download-cache
          key: stun-mesa-source-${{ env.MESA_VERSION }}-${{ env.MESA_ARCHIVE_SHA256 }}

      - name: Prepare explicit build tools and driver paths
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -n "$VCPKG_TOOL_REVISION"
          test -n "$VCPKG_SCRIPTS_REVISION"
          test -n "$VCPKG_CACHE_REVISION"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_SCRIPTS_REVISION"
          mkdir -p build/mesa-evidence "$RUNNER_TEMP/mesa-xdg" \
            "$RUNNER_TEMP/mesa-vcpkg-cache" "$RUNNER_TEMP/mesa-download-cache"
          chmod 700 "$RUNNER_TEMP/mesa-xdg"
          {
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/build/mesa-evidence"
            echo "MESA_ROOT=$RUNNER_TEMP/stun-mesa-sdk"
            echo "MESA_SOURCE=$RUNNER_TEMP/mesa-$MESA_VERSION"
            echo "MESA_BUILD=$RUNNER_TEMP/mesa-build"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/mesa-xdg"
          } >> "$GITHUB_ENV"
          printf 'Stun=%s\nMesa=%s\nArchiveSHA256=%s\nvcpkg_port_baseline=%s\nvcpkg_tool=%s\nvcpkg_scripts=%s\nvcpkg_cache_revision=%s\n' \
            "$EXPECTED_HEAD" "$MESA_VERSION" "$MESA_ARCHIVE_SHA256" \
            "$VCPKG_PORT_BASELINE" "$VCPKG_TOOL_REVISION" \
            "$VCPKG_SCRIPTS_REVISION" "$VCPKG_CACHE_REVISION" \
            > build/mesa-evidence/provenance.txt
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bison flex llvm-20-dev \
            autoconf autoconf-archive automake libtool \
            libdrm-dev libexpat1-dev libelf-dev zlib1g-dev libzstd-dev \
            xorg-dev libwayland-dev libxkbcommon-dev libglvnd-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shm0-dev libxshmfence-dev \
            xvfb xauth mesa-utils
          python3 -m venv "$RUNNER_TEMP/mesa-tools"
          "$RUNNER_TEMP/mesa-tools/bin/pip" install meson==1.5.2 Mako==1.3.10 PyYAML==6.0.2 packaging==24.2
          echo "$RUNNER_TEMP/mesa-tools/bin" >> "$GITHUB_PATH"
          dpkg-query -W > build/mesa-evidence/system-packages.txt
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=cmake/ci/mesa \
            "--x-install-root=$RUNNER_TEMP/mesa-control-ports" \
            --triplet x64-linux \
            2>&1 | tee build/mesa-evidence/control-dependencies.log
      - name: Save Mesa control dependency cache
        if: steps.mesa_vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-vcpkg-cache
          key: ${{ steps.mesa_vcpkg_cache.outputs.cache-primary-key }}

      - name: Save Mesa Python download cache
        if: steps.mesa_pip_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.mesa_pip_cache.outputs.cache-primary-key }}

      - name: Verify and build the unchanged upstream driver
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          archive="$RUNNER_TEMP/mesa-download-cache/mesa-$MESA_VERSION.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://archive.mesa3d.org/mesa-$MESA_VERSION.tar.xz" -o "$archive"
          fi
          printf '%s  %s\n' "$MESA_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          test "$(cat "$MESA_SOURCE/VERSION")" = "$MESA_VERSION"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['MESA_SOURCE'])
          expected = {'src/util/u_cpu_detect.c': 'd9bf9cca7e72b44e7901c1638150df3597caf24a',
                      'src/gallium/auxiliary/rtasm/rtasm_execmem.c': '82c4d2f019cff8f7594a46c3057721401e9adb6b'}
          for name, expected_sha in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_sha, (name, actual)
          PY
          cat > "$RUNNER_TEMP/mesa-native.ini" <<'NATIVE'
          [binaries]
          c = 'gcc'
          cpp = 'g++'
          llvm-config = '/usr/bin/llvm-config-20'
          NATIVE
          meson setup "$MESA_BUILD" "$MESA_SOURCE" \
            --native-file "$RUNNER_TEMP/mesa-native.ini" \
            --prefix "$MESA_ROOT" --libdir lib --buildtype debugoptimized \
            -Dplatforms=x11 -Dgallium-drivers=llvmpipe -Dvulkan-drivers=[] \
            -Dglx=dri -Dglvnd=enabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dllvm=enabled \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-rusticl=false \
            -Dbuild-tests=false -Dc_args=-fno-omit-frame-pointer -Dcpp_args=-fno-omit-frame-pointer \
            2>&1 | tee "$EVIDENCE_DIR/mesa-configure.log"
          meson compile -C "$MESA_BUILD" -j 2 2>&1 | tee "$EVIDENCE_DIR/mesa-baseline-build.log"
          meson install -C "$MESA_BUILD" 2>&1 | tee "$EVIDENCE_DIR/mesa-baseline-install.log"
          driver="$MESA_ROOT/lib/libgallium-$MESA_VERSION.so"
          test -f "$driver"
          glx=$(readlink -e "$MESA_ROOT/lib/libGLX_mesa.so.0")
          test "$glx" = "$MESA_ROOT/lib/libGLX_mesa.so.0.0.0"
          {
            echo "MESA_EXPECTED_DRIVER=$driver"
            echo "MESA_EXPECTED_GLX=$glx"
          } >> "$GITHUB_ENV"
          readelf -d "$glx" > "$EVIDENCE_DIR/baseline-glx-dynamic.txt"
          sha256sum "$driver" > "$EVIDENCE_DIR/baseline-driver.sha256"
          readelf -d "$driver" > "$EVIDENCE_DIR/baseline-driver-dynamic.txt"
          cmake -S cmake/ci/mesa -B build/mesa-control -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$RUNNER_TEMP/mesa-control-ports"
          cmake --build build/mesa-control --parallel 2 --verbose
          cp build/mesa-control/compile_commands.json "$EVIDENCE_DIR/control-compile-commands.json"

      - name: Save pinned Mesa source archive
        if: steps.mesa_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-download-cache
          key: ${{ steps.mesa_source_cache.outputs.cache-primary-key }}
      - name: Compare identical controls before and after the owner fix
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS
          xvfb-run -a python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE_DIR'])
          binary = Path('build/mesa-control/mesa_driver_control').resolve(strict=True)
          driver = Path(os.environ['MESA_EXPECTED_DRIVER'])
          source = Path(os.environ['MESA_SOURCE'])
          build = Path(os.environ['MESA_BUILD'])
          patch = Path('cmake/ci/mesa/module-cleanup.patch').resolve(strict=True)
          binary_hash = hashlib.sha256(binary.read_bytes()).hexdigest()
          rows = []
          glx = Path(os.environ['MESA_EXPECTED_GLX']).resolve(strict=True)
          control_env = os.environ.copy()
          # Only the control selects this installed GLX/Gallium pair. Build tools
          # and Xvfb keep their normal environment; no source-tree driver is used.
          control_env['LD_LIBRARY_PATH'] = str(driver.parent)
          control_env['__GLX_VENDOR_LIBRARY_NAME'] = 'mesa'
          control_env.pop('LIBGL_DRIVERS_PATH', None)
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          for variant in ('baseline', 'patched'):
              if variant == 'patched':
                  subprocess.run(['git', 'apply', '--check', str(patch)], cwd=source, check=True)
                  subprocess.run(['git', 'apply', str(patch)], cwd=source, check=True)
                  (evidence / 'module-cleanup.patch').write_bytes(patch.read_bytes())
                  for operation in ('compile', 'install'):
                      command = ['meson', operation, '-C', str(build)]
                      if operation == 'compile': command += ['-j', '2']
                      with (evidence / f'mesa-patched-{operation}.log').open('w') as log:
                          subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True)
                  assert hashlib.sha256(binary.read_bytes()).hexdigest() == binary_hash
              for mode in readbacks:
                  for cycles in (1, 4):
                      result = subprocess.run([str(binary), mode, str(cycles)], text=True,
                                              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180, env=control_env)
                      log = result.stdout
                      name = f'{variant}-{mode}-{cycles}.log'
                      (evidence / name).write_text(log)
                      row = {'variant': variant, 'mode': mode, 'cycles': cycles,
                             'exit_code': result.returncode, 'pixel_checks': log.count('pixel-readback=passed'),
                             'completed': 'application-checks=passed;' in log,
                             'leaks': re.findall(r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log)}
                      rows.append(row)
                      (evidence / 'results.json').write_text(json.dumps(rows, indent=2) + '\n')
                      print(json.dumps(row), flush=True)
                      assert row['completed'] and row['pixel_checks'] == readbacks[mode] * cycles, row
                      assert log.count('teardown=completed') == cycles, row
                      assert 'runtime error:' not in log and 'ERROR: AddressSanitizer:' not in log, row
                      if variant == 'patched' or mode == 'init':
                          assert result.returncode == 0 and not row['leaks'], row
                      elif mode in ('draw', 'overlap', 'threads'):
                          assert result.returncode != 0 and row['leaks'], 'Baseline must reproduce the lost caches'
              (evidence / f'{variant}-driver.sha256').write_text(
                  hashlib.sha256(driver.read_bytes()).hexdigest() + '  ' + str(driver) + '\n')
              (evidence / f'{variant}-glx.sha256').write_text(
                  hashlib.sha256(glx.read_bytes()).hexdigest() + '  ' + str(glx) + '\n')
          assert len(rows) == 20
          assert (evidence / 'baseline-driver.sha256').read_text() != (evidence / 'patched-driver.sha256').read_text()
          (evidence / 'control-binary.sha256').write_text(binary_hash + '\n')
          print('Unchanged control binary; baseline leaks reproduced; all ten patched processes passed.')
          PY
          cp "$MESA_BUILD/compile_commands.json" "$EVIDENCE_DIR/mesa-compile-commands.json"
          cp "$MESA_BUILD/meson-info/intro-buildoptions.json" "$EVIDENCE_DIR/mesa-build-options.json"
          cp "$MESA_SOURCE/src/util/u_cpu_detect.c" "$EVIDENCE_DIR/patched-u_cpu_detect.c"
          cp "$MESA_SOURCE/src/gallium/auxiliary/rtasm/rtasm_execmem.c" "$EVIDENCE_DIR/patched-rtasm_execmem.c"
          readelf -d "$MESA_EXPECTED_DRIVER" > "$EVIDENCE_DIR/patched-driver-dynamic.txt"
          tar -C "$MESA_ROOT" -cJf "$EVIDENCE_DIR/mesa-sdk.tar.xz" .
          sha256sum "$EVIDENCE_DIR/mesa-sdk.tar.xz" > "$EVIDENCE_DIR/mesa-sdk.sha256"
          git diff --exit-code
      - name: Collect available configure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$MESA_BUILD/meson-logs/meson-log.txt" ]; then
            cp "$MESA_BUILD/meson-logs/meson-log.txt" "$EVIDENCE_DIR/meson-log.txt"
          fi
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-driver-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/mesa-evidence
          if-no-files-found: error

      # Optional full-window conformance uses the same patched Mesa installation
      # in the same runner. Standalone Mesa workflow_dispatch remains Mesa-only.
      - name: Checkout released Salts
        if: ${{ inputs.run_desktop && success() }}
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: .ci/sources/salts
          persist-credentials: false
      - name: Checkout released SaltsUtils
        if: ${{ inputs.run_desktop && success() }}
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_SHA }}
          path: .ci/sources/salts-utils
          persist-credentials: false

      - name: Select STUN vcpkg L1 cache
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: echo "VCPKG_BINARY_CACHE=$RUNNER_TEMP/stun-vcpkg-cache" >> "$GITHUB_ENV"

      - name: Restore shared re2c binary
        if: ${{ inputs.run_desktop && success() }}
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Define isolated paths
        if: ${{ inputs.run_desktop && success() }}
        id: desktop_paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SALTS_SHA" && test -n "$SALTS_UTILS_SHA"
          {
            echo "SALTS_ROOT=$RUNNER_TEMP/stun-desktop-sdk"
            echo "SALTS_UTILS_ROOT=$RUNNER_TEMP/stun-desktop-sdk"
            echo "PACKAGE_BUILD_ROOT=$RUNNER_TEMP/stun-desktop-dependencies"
            echo "PORTS_ROOT=$RUNNER_TEMP/stun-desktop-ports"
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/build/desktop-evidence"
            echo "MESA_ROOT=$RUNNER_TEMP/stun-mesa-sdk"
            echo "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1"
            echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/stun-desktop-sdk/lib"
          } >> "$GITHUB_ENV"
      - name: Restore pinned third-party packages
        if: ${{ inputs.run_desktop && success() }}
        id: ports_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/stun-vcpkg-cache
          key: stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}-desktop-v2
          restore-keys: |
            stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}-flexui-v2
            stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}-desktop-v1
            stun-vcpkg-ubuntu24-${{ env.VCPKG_PORT_BASELINE }}-${{ env.SALTS_SHA }}-${{ env.SALTS_UTILS_SHA }}-flexui-v1
      - name: Prepare tools and record exact provenance
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$SALTS_ROOT" "$PORTS_ROOT" "$RUNNER_TEMP/stun-vcpkg-cache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
          test "$(git -C .ci/sources/salts rev-parse HEAD)" = "$SALTS_SHA"
          test "$(git -C .ci/sources/salts-utils rev-parse HEAD)" = "$SALTS_UTILS_SHA"
          test -n "$VCPKG_TOOL_REVISION"
          test -n "$VCPKG_SCRIPTS_REVISION"
          test -n "$VCPKG_CACHE_REVISION"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_SCRIPTS_REVISION"
          printf 'Stun=%s\nSalts=%s\nSaltsUtils=%s\nvcpkg_port_baseline=%s\nvcpkg_tool=%s\nvcpkg_scripts=%s\nvcpkg_cache_revision=%s\n' \
            "$EXPECTED_STUN_SHA" "$SALTS_SHA" "$SALTS_UTILS_SHA" \
            "$VCPKG_PORT_BASELINE" "$VCPKG_TOOL_REVISION" \
            "$VCPKG_SCRIPTS_REVISION" "$VCPKG_CACHE_REVISION" \
            | tee "$EVIDENCE_DIR/provenance.txt"
          # Mesa already refreshed apt metadata in this same runner.
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils \
            autoconf autoconf-archive automake libtool \
            xorg-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers mesa-utils vulkan-tools libllvm20 \
            vulkan-validationlayers xvfb xauth fonts-dejavu-core
          dpkg-query -W > "$EVIDENCE_DIR/system-packages.txt"
          mapfile -t vulkan_system_libs < <(dpkg -L libvulkan-dev | grep -E '/libvulkan\.so$')
          test "${#vulkan_system_libs[@]}" -eq 1
          test -f /usr/include/vulkan/vulkan.h
          vulkan_system_library="$(readlink -e "${vulkan_system_libs[0]}")"
          test -n "$vulkan_system_library"
          {
            echo "VULKAN_SYSTEM_LIBRARY=$vulkan_system_library"
            echo "VULKAN_SYSTEM_INCLUDE=/usr/include"
            echo "VULKAN_EXPECTED_LOADER=$vulkan_system_library"
          } >> "$GITHUB_ENV"
          sha256sum "$vulkan_system_library" > "$EVIDENCE_DIR/vulkan-loader.sha256"
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/stun-build-tools" cmake==3.31.6
          echo "$RUNNER_TEMP/stun-build-tools/cmake/data/bin" >> "$GITHUB_PATH"
      - name: Verify driver package and exact-head lifecycle receipt
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          source = Path('build/mesa-evidence')
          root = Path(os.environ['MESA_ROOT'])
          evidence = Path(os.environ['EVIDENCE_DIR'])
          provenance = dict(line.split('=', 1) for line in (source / 'provenance.txt').read_text().splitlines())
          assert provenance['Stun'] == os.environ['EXPECTED_STUN_SHA'], provenance
          assert provenance['vcpkg_port_baseline'] == os.environ['VCPKG_PORT_BASELINE'], provenance
          patch = Path('cmake/ci/mesa/module-cleanup.patch')
          assert patch.read_bytes() == (source / 'module-cleanup.patch').read_bytes()
          rows = json.loads((source / 'results.json').read_text())
          readbacks = {'init': 0, 'window': 0, 'draw': 1, 'overlap': 4, 'threads': 8}
          assert len(rows) == 20
          assert {(r['variant'], r['mode'], r['cycles']) for r in rows} == {
              (v, m, n) for v in ('baseline', 'patched') for m in readbacks for n in (1, 4)}
          for row in rows:
              assert row['completed'] and row['pixel_checks'] == readbacks[row['mode']] * row['cycles'], row
              if row['variant'] == 'patched' or row['mode'] == 'init':
                  assert row['exit_code'] == 0 and not row['leaks'], row
              elif row['mode'] in ('draw', 'overlap', 'threads'):
                  assert row['exit_code'] != 0 and row['leaks'], row
          archive = source / 'mesa-sdk.tar.xz'
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive_hash == (source / 'mesa-sdk.sha256').read_text().split()[0]
          # Mesa just built and patched this very installation on this
          # runner. Verify its existing bytes without archive re-extraction.
          assert root.is_dir(), root
          assert (root / 'lib').is_dir()
          libs = {}
          for filename, report in ((f"libgallium-{provenance['Mesa']}.so", 'patched-driver.sha256'),
                                   ('libGLX_mesa.so.0.0.0', 'patched-glx.sha256')):
              path = (root / 'lib' / filename).resolve(strict=True)
              assert path.parent == (root / 'lib').resolve(strict=True)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == (source / report).read_text().split()[0], path
              libs[filename] = digest
          assert (root / 'lib/libGLX_mesa.so.0').resolve(strict=True) == root / 'lib/libGLX_mesa.so.0.0.0'
          assert not any(p.name.startswith('libsalts') for p in (root / 'lib').iterdir())
          receipt = {'source_head': provenance['Stun'], 'workflow_run': os.environ['GITHUB_RUN_ID'],
                     'mesa_version': provenance['Mesa'], 'source_archive_sha256': provenance['ArchiveSHA256'],
                     'package_sha256': archive_hash, 'patch_sha256': hashlib.sha256(patch.read_bytes()).hexdigest(),
                     'libraries': libs, 'patched_processes': 10, 'patched_pixel_checks': 65}
          (evidence / 'mesa-package.json').write_text(json.dumps(receipt, indent=2) + '\n')
          shutil.copyfile(source / 'provenance.txt', evidence / 'mesa-provenance.txt')
          shutil.copyfile(source / 'results.json', evidence / 'mesa-lifecycle-results.json')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Build and install real Salts packages
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cmake --version
            ninja --version
            gcc --version
            g++ --version
            re2c --version

          } >> "$EVIDENCE_DIR/provenance.txt"
          test "$(re2c --version)" = 're2c 4.6'
          cmake -S .ci/sources/salts-utils/tools/lemon -B "$PACKAGE_BUILD_ROOT/host-lemon" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$EVIDENCE_DIR/lemon-configure.log"
          cmake --build "$PACKAGE_BUILD_ROOT/host-lemon" --target lemon --parallel 2 \
            2>&1 | tee "$EVIDENCE_DIR/lemon-build.log"
          for package in salts salts-utils; do
            source="$GITHUB_WORKSPACE/.ci/sources/$package"
            package_build="$PACKAGE_BUILD_ROOT/$package"
            ports="$PORTS_ROOT/$package"
            extra=()
            if [ "$package" = salts-utils ]; then
              extra=(
                -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF
                "-DSALTS_UTILS_HOST_LEMON_EXECUTABLE=$PACKAGE_BUILD_ROOT/host-lemon/lemon"
                "-DDATABIND_HOST_LEMON_EXECUTABLE=$PACKAGE_BUILD_ROOT/host-lemon/lemon"
              )
            fi
            cmake -S "$source" -B "$package_build" -G Ninja \
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_MODE=ON -DVCPKG_TARGET_TRIPLET=x64-linux \
              "-DVCPKG_INSTALLED_DIR=$ports" "-DVCPKG_OVERLAY_PORTS=$VCPKG_OVERLAY_PORTS" \
              "-DCMAKE_PREFIX_PATH=$ports/x64-linux/debug" \
              "-DPKG_CONFIG_EXECUTABLE=$ports/x64-linux/tools/pkgconf/pkgconf" \
              -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON "-DOpenSSL_DIR=$ports/x64-linux/share/OpenSSL" \
              "-DCMAKE_INSTALL_PREFIX=$SALTS_ROOT" -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
              -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
              -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON \
              "${extra[@]}" 2>&1 | tee "$EVIDENCE_DIR/$package-configure.log"
            cmake --build "$package_build" --parallel 2 2>&1 | tee "$EVIDENCE_DIR/$package-build.log"
            cmake --install "$package_build" \
              2>&1 | tee "$EVIDENCE_DIR/$package-install.log"
            cp "$package_build/CMakeCache.txt" "$EVIDENCE_DIR/$package-CMakeCache.txt"
            cp "$package_build/compile_commands.json" "$EVIDENCE_DIR/$package-compile_commands.json"
            git -C "$source" diff --exit-code
          done
      - name: Quarantine dependency source and build trees
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stun-desktop-quarantine"
          mv .ci/sources "$RUNNER_TEMP/stun-desktop-quarantine/sources"
          mv "$PACKAGE_BUILD_ROOT" "$RUNNER_TEMP/stun-desktop-quarantine/builds"
          test ! -e .ci/sources
          test ! -e "$PACKAGE_BUILD_ROOT"
      - name: Restore canonical STUN graphics and FlexUI dependencies
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/.ci/vcpkg/stun-linux"
          test -f "$manifest/vcpkg.json"
          ! grep -Eq '"vulkan-(loader|headers)"' "$manifest/vcpkg.json"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" \
            "--x-install-root=$PORTS_ROOT/flexui" \
            --triplet x64-linux \
            --only-binarycaching \
            2>&1 | tee "$EVIDENCE_DIR/graphics-install.log"
          cp "$PORTS_ROOT/flexui/vcpkg/status" "$EVIDENCE_DIR/graphics-packages.txt"
          status="$PORTS_ROOT/flexui/vcpkg/status"
          test -f "$status"
          ! grep -Fqx 'Package: vulkan-loader' "$status"
          ! grep -Fqx 'Package: vulkan-headers' "$status"
          awk '
            $0 == "Package: lexbor" { found=1; next }
            found && /^Version: / {
              version=$2
              if (version !~ /^3\./) exit 2
              ok=1
              exit
            }
            END { if (!ok) exit 1 }
          ' "$status"
          ! grep -Eq '^Building [^:]+:x64-linux' "$EVIDENCE_DIR/graphics-install.log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$EVIDENCE_DIR/graphics-install.log"
      - name: Save complete dependency cache
        if: ${{ inputs.run_desktop && success() && steps.ports_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/stun-vcpkg-cache
          key: ${{ steps.ports_cache.outputs.cache-primary-key }}
      - name: Configure and build real window and renderer targets
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD
          ports="$PORTS_ROOT/flexui"
          cmake -S . -B build/desktop-runtime -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$ports" \
            "-DCMAKE_PREFIX_PATH=$SALTS_ROOT;$ports/x64-linux/debug" \
            "-DSALTS_ROOT=$SALTS_ROOT" "-DSALTS_UTILS_ROOT=$SALTS_UTILS_ROOT" \
            "-DOpenSSL_DIR=$PORTS_ROOT/salts-utils/x64-linux/share/OpenSSL" \
            "-DPKG_CONFIG_EXECUTABLE=$ports/x64-linux/tools/pkgconf/pkgconf" \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
            "-DVulkan_LIBRARY=$VULKAN_SYSTEM_LIBRARY" \
            "-DVulkan_INCLUDE_DIR=$VULKAN_SYSTEM_INCLUDE" \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DNANOGUI_BUILD_EXAMPLES=OFF \
            -DSTUN_BUILD_APPLICATIONS=OFF -DSTUN_BUILD_CHARTS=OFF -DFLEX_BUILD_TOOLS=OFF \
            -DFLEXUI_ENABLE_PLUGINS=ON -DFLEXUI_ENABLE_TURBOSCRIPT=OFF \
            -DGCANVAS_BUILD_OPENGL=ON -DGCANVAS_BUILD_VULKAN=ON -DGCANVAS_BUILD_SVG=ON \
            -DGCANVAS_BUILD_WINDOW=ON -DGCANVAS_BUILD_TESTS=ON \
            -DGCANVAS_BUILD_GPU_TESTS=ON -DGCANVAS_BUILD_EXAMPLES=ON \
            -DGCANVAS_ENABLE_VULKAN_VALIDATION=ON \
            -DFLEX_BUILD_GCANVAS_GPU_TESTS=ON \
            -DFLEX_BUILD_RENDER_ENGINE_GCANVAS=ON -DFLEX_BUILD_RENDER_ENGINE_NANOVG=OFF \
            -DFLEX_BUILD_BACKEND_OPENGL=OFF -DFLEX_BUILD_BACKEND_VULKAN=OFF \
            -DFLEX_BUILD_BACKEND_D2D=OFF -DFLEX_BUILD_BACKEND_TUI=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON \
            2>&1 | tee "$EVIDENCE_DIR/desktop-configure.log"
          grep -Fq "Found Vulkan: $VULKAN_SYSTEM_LIBRARY" "$EVIDENCE_DIR/desktop-configure.log"
          cmake --build build/desktop-runtime --parallel 2 --verbose --target \
            test_gcanvas_window_host test_gcanvas_plugin_window_host gcanvas_gpu_test gcanvas_showcase \
            2>&1 | tee "$EVIDENCE_DIR/desktop-build.log"
      - name: Select and verify software graphics drivers
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD VK_ICD_FILENAMES VK_ADD_DRIVER_FILES LIBGL_DRIVERS_PATH
          # Select exactly one installed Lavapipe manifest, never a fallback GPU.
          mapfile -t drivers < <(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$')
          test "${#drivers[@]}" -eq 1
          export VK_DRIVER_FILES="${drivers[0]}"
          mapfile -t vk_libs < <(dpkg -L mesa-vulkan-drivers | grep -E '/libvulkan_lvp\.so$')
          test "${#vk_libs[@]}" -eq 1
          export VULKAN_EXPECTED_DRIVER="$(readlink -e "${vk_libs[0]}")"
          sha256sum "$VULKAN_EXPECTED_DRIVER" > "$EVIDENCE_DIR/vulkan-library.sha256"
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stun-desktop-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat "$VK_DRIVER_FILES" > "$EVIDENCE_DIR/vulkan-driver.json"
          sha256sum "$VK_DRIVER_FILES" > "$EVIDENCE_DIR/vulkan-driver.sha256"
          xvfb-run -a env LD_LIBRARY_PATH="$MESA_ROOT/lib" __GLX_VENDOR_LIBRARY_NAME=mesa \
            glxinfo -B 2>&1 | tee "$EVIDENCE_DIR/opengl-driver.log"
          xvfb-run -a vulkaninfo --summary 2>&1 | tee "$EVIDENCE_DIR/vulkan-driver.log"
          grep -q 'OpenGL renderer string: llvmpipe' "$EVIDENCE_DIR/opengl-driver.log"
          grep -q 'PHYSICAL_DEVICE_TYPE_CPU' "$EVIDENCE_DIR/vulkan-driver.log"
          grep -q 'VK_LAYER_KHRONOS_validation' "$EVIDENCE_DIR/vulkan-driver.log"
          {
            echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
            echo "VULKAN_EXPECTED_DRIVER=$VULKAN_EXPECTED_DRIVER"
            echo "LIBGL_ALWAYS_SOFTWARE=$LIBGL_ALWAYS_SOFTWARE"
            echo "GALLIUM_DRIVER=$GALLIUM_DRIVER"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          } >> "$GITHUB_ENV"
      - name: Execute both backends and real FlexUI window lifecycle
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS VK_ICD_FILENAMES VK_ADD_DRIVER_FILES LIBGL_DRIVERS_PATH
          pattern='^(test_gcanvas_window_host|test_gcanvas_plugin_window_host|gcanvas_gpu_opengl|gcanvas_gpu_vulkan|gcanvas_showcase_opengl|gcanvas_showcase_vulkan)$'
          ctest --test-dir build/desktop-runtime -R "$pattern" --show-only=json-v1 \
            > "$EVIDENCE_DIR/selected-tests.json"
          xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' \
            env LD_LIBRARY_PATH="$MESA_ROOT/lib" __GLX_VENDOR_LIBRARY_NAME=mesa \
            LSAN_OPTIONS=exitcode=0 \
            LD_DEBUG=files LD_DEBUG_OUTPUT="$EVIDENCE_DIR/loader" \
            ctest --test-dir build/desktop-runtime -R "$pattern" \
            --no-tests=error --verbose --output-on-failure --timeout 180 \
            --output-junit "$EVIDENCE_DIR/desktop-results.xml" \
            2>&1 | tee "$EVIDENCE_DIR/desktop-ctest.log"
      - name: Verify execution, instrumentation, and runtime ownership
        if: ${{ inputs.run_desktop && success() }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD
          sha256sum --check "$EVIDENCE_DIR/vulkan-library.sha256"
          sha256sum --check "$EVIDENCE_DIR/vulkan-loader.sha256"
          python3 cmake/ci/mesa/verify_desktop_drivers.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ['EVIDENCE_DIR'])
          build = Path('build/desktop-runtime').resolve(strict=True)
          sdk = Path(os.environ['SALTS_ROOT']).resolve(strict=True)
          expected_vulkan_loader = Path(os.environ['VULKAN_EXPECTED_LOADER']).resolve(strict=True)
          expected = {'test_gcanvas_window_host', 'test_gcanvas_plugin_window_host',
                      'gcanvas_gpu_opengl', 'gcanvas_gpu_vulkan',
                      'gcanvas_showcase_opengl', 'gcanvas_showcase_vulkan'}
          selected = json.loads((evidence / 'selected-tests.json').read_text())['tests']
          assert len(selected) == len(expected) and {t['name'] for t in selected} == expected
          cases = list(ET.parse(evidence / 'desktop-results.xml').getroot().iter('testcase'))
          assert len(cases) == len(expected) and {c.attrib['name'] for c in cases} == expected
          assert not any(list(c.iter(tag)) for c in cases for tag in ('failure', 'error', 'skipped'))
          log = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', (evidence / 'desktop-ctest.log').read_text())
          assert not re.search(r'VULKAN VALIDATION \[(ERROR|WARNING)\]|ERROR: AddressSanitizer:|runtime error:', log)

          # LeakSanitizer stays enabled. Only independently tracked upstream
          # GLFW/X11 owners (#45/#47/#65) may remain; any new owner is fatal.
          leak_blocks = re.findall(
              r'((?:\d+: )?(?:Direct|Indirect) leak of \d+ byte\(s\).*?)(?=(?:\n(?:\d+: )?(?:Direct|Indirect) leak of \d+ byte\(s\))|(?:\n(?:\d+: )?SUMMARY: AddressSanitizer:)|\Z)',
              log, re.S)
          leak_owners = {'x11_init': 0, 'glfw_glx': 0}
          for block in leak_blocks:
              if re.search(r'_glfw(?:Connect|Init)X11.*?src/x11_init\.c', block, re.S):
                  leak_owners['x11_init'] += 1
              elif re.search(r'(?:extensionSupportedGLX|_glfwInitGLX).*?src/glx_context\.c', block, re.S):
                  leak_owners['glfw_glx'] += 1
              else:
                  raise AssertionError(block)
              assert not re.search(r'libgallium|rtasm_execmem|u_cpu_detect|mesa-build', block, re.I), block
          leak_summaries = re.findall(
              r'SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)', log)
          assert bool(leak_blocks) == bool(leak_summaries)
          totals = {}
          for status in ('PASSED', 'FAILED', 'SKIPPED', 'FILTERED', 'TODO'):
              counts = [int(n) for n in re.findall(rf'Total tests \[{status}\]:\s*(\d+)', log)]
              assert len(counts) == 2, (status, counts)
              assert all(n > 0 if status == 'PASSED' else n == 0 for n in counts), (status, counts)
              totals[status] = sum(counts)
          assertions = re.findall(r'Assertions:\s*(\d+) passed,\s*(\d+) failed', log)
          assert len(assertions) == 2 and all(int(f) == 0 for _, f in assertions)
          totals['assertions_passed'] = sum(int(p) for p, _ in assertions)
          commands_text = (build / 'compile_commands.json').read_text()
          commands = json.loads(commands_text)
          for suffix in ('flexUI/modules/desktop/gcanvas_window_host.cpp',
                         'flexUI/modules/desktop/gcanvas_plugin_window_host.cpp',
                         'flex/render/engines/gcanvas/renderer.cpp',
                         'vendor/gCanvas/src/window_impl.cpp',
                         'vendor/gCanvas/src/backends/gl/context_impl_gl.cpp',
                         'vendor/gCanvas/src/backends/opengl/context_opengl.cpp',
                         'vendor/gCanvas/src/backends/vulkan/context_impl_vulkan.cpp'):
              matching = [c for c in commands if c['file'].endswith(suffix)]
              assert len(matching) == 1, suffix
              assert all(flag in matching[0]['command'] for flag in ('-fsanitize=address', '-fsanitize=undefined')), suffix
          forbidden = [str(Path(os.environ['GITHUB_WORKSPACE']) / '.ci/sources'),
                       os.environ['PACKAGE_BUILD_ROOT'],
                       str(Path(os.environ['RUNNER_TEMP']) / 'stun-desktop-quarantine')]
          assert all(not Path(p).exists() for p in forbidden[:2])
          link_text = (evidence / 'desktop-build.log').read_text()
          assert all(p not in commands_text + link_text for p in forbidden)
          providers = {}
          for name in ('test_gcanvas_window_host', 'test_gcanvas_plugin_window_host',
                       'gcanvas_gpu_test', 'gcanvas_showcase'):
              binary = build / 'bin' / name
              dynamic = subprocess.check_output(['readelf', '-d', str(binary)], text=True)
              loader = subprocess.check_output(['ldd', str(binary)], text=True)
              (evidence / f'{name}-dynamic.txt').write_text(dynamic + '\n' + loader)
              assert 'not found' not in loader and not re.search(r'libturbo[^/\s]*\.(?:so|a)', loader, re.I)
              assert all(p not in dynamic + loader for p in forbidden)
              core = set()
              vulkan_loaders = set()
              for raw in re.findall(r'=>\s+(/\S+)\s+\(', loader):
                  path = Path(raw).resolve(strict=True)
                  if path.name.startswith('libsalts'):
                      assert path.is_relative_to(sdk), path
                  if re.fullmatch(r'libsalts(?:[_-]core)?\.so(?:\.\d+)*', path.name, re.I):
                      core.add(str(path))
                  if re.fullmatch(r'libvulkan\.so(?:\.\d+)*', path.name):
                      vulkan_loaders.add(path)
              assert vulkan_loaders <= {expected_vulkan_loader}, (name, vulkan_loaders)
              assert len(core) == (1 if name.startswith('test_') else 0), (name, core)
              providers[name] = {'core': sorted(core),
                                 'vulkan_loader': sorted(map(str, vulkan_loaders))}
          result = {'ctest_passed': len(cases), 'tinytest': totals,
                    'runtime_providers': providers,
                    'known_upstream_leak_blocks': len(leak_blocks),
                    'known_upstream_leak_owners': leak_owners,
                    'known_upstream_leak_summaries': leak_summaries,
                    'driver_runtime_providers': json.loads((evidence / 'desktop-driver-providers.json').read_text()),
                    'scope': 'Linux Xvfb, patched Mesa llvmpipe and distribution Lavapipe; real FlexUI window/plugin lifecycle and gCanvas pixel/showcase tests. No physical GPU, TurboScript editor, installed desktop, or Windows/macOS claim.'}
          (evidence / 'desktop-evidence.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
          git diff --exit-code
          {
            echo '### Real gCanvas window and renderer validation'
            echo '```json'
            cat "$EVIDENCE_DIR/desktop-evidence.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact-head evidence even on failure
        if: ${{ always() && inputs.run_desktop && steps.desktop_paths.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/desktop-evidence
            build/desktop-runtime/CMakeCache.txt
            build/desktop-runtime/compile_commands.json
            build/desktop-runtime/Testing/Temporary/LastTest.log
          if-no-files-found: error

      - name: Execute both backends and real FlexUI window lifecycle
        if: ${{ inputs.run_runtime && success() }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH LD_PRELOAD LSAN_OPTIONS VK_ICD_FILENAMES VK_ADD_DRIVER_FILES LIBGL_DRIVERS_PATH
          pattern='^(test_gcanvas_window_host|test_gcanvas_plugin_window_host|gcanvas_gpu_opengl|gcanvas_gpu_vulkan|gcanvas_showcase_opengl|gcanvas_showcase_vulkan)$'
          ctest --test-dir build/desktop-runtime -R "$pattern" --show-only=json-v1 \

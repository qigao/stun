name: gCanvas OpenGLES runtime

# Warm-cache evidence: changing this comment does not modify any C/C++
# source/flags, but forces a fresh exact-HEAD native Ninja build to restore
# the previous commit's real compiler-output archive.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "shared/gcanvas/**"
      - ".github/workflows/gcanvas-gles-runtime.yml"
      - ".github/actions/setup-ccache/**"
      - ".github/scripts/report-ccache.sh"
      - ".github/scripts/ci-affected.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci/full' && github.run_id || 'qualification' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci/full'
    name: Component change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: bash .github/scripts/ci-affected.sh 'shared/gcanvas/*' '.github/workflows/gcanvas-gles-runtime.yml' '.github/actions/setup-ccache/*' '.github/scripts/report-ccache.sh' '.github/scripts/ci-affected.sh'

  gles-runtime:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Install verified OpenGLES compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: gcanvas-gles-runtime
          source_sha: ${{ needs.changes.outputs.source_sha }}

      - name: Install GLES build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libfreetype-dev libstb-dev \
            libegl1-mesa-dev libgles2-mesa-dev xvfb xauth

      - name: Configure GLES-only gCanvas
        shell: bash
        run: |
          set -euo pipefail
          cmake -S shared/gcanvas -B build/gcanvas-gles -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSTB_INCLUDE_DIRS=/usr/include/stb \
            -DGCANVAS_BUILD_OPENGL=OFF \
            -DGCANVAS_BUILD_GLES=ON \
            -DGCANVAS_BUILD_VULKAN=OFF \
            -DGCANVAS_BUILD_SVG=OFF \
            -DGCANVAS_BUILD_WINDOW=OFF \
            -DGCANVAS_BUILD_TESTS=ON \
            -DGCANVAS_BUILD_GPU_TESTS=OFF \
            -DGCANVAS_BUILD_EXAMPLES=OFF

      - name: Build GLES runtime and smoke test
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/gcanvas-gles --parallel 2 --verbose \
            --target gcanvas_opengles gcanvas_contract_test gcanvas_gles_smoke_test

      - name: Run real GLES3 shader and pixel smoke
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' \
            ctest --test-dir build/gcanvas-gles \
              -R '^(gcanvas_contract|gcanvas_gles_smoke)$' \
              --no-tests=error --verbose --output-on-failure

      - name: Require real OpenGLES compiler-cache statistics
        shell: bash
        run: bash .github/scripts/report-ccache.sh gcanvas-gles-runtime

      - name: Archive OpenGLES pixel smoke and compiler-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcanvas-gles-runtime-${{ needs.changes.outputs.source_sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/gcanvas-gles/Testing/Temporary/LastTest.log
            build/gcanvas-gles/compile_commands.json
            ${{ runner.temp }}/stun-ccache-stats-gcanvas-gles-runtime.tsv

name: gCanvas Android runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "shared/gcanvas/**"
      - ".github/workflows/gcanvas-android-runtime.yml"
      - ".github/scripts/ci-affected.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Component change scope
    runs-on: ubuntu-24.04
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: bash .github/scripts/ci-affected.sh 'shared/gcanvas/*' '.github/workflows/gcanvas-android-runtime.yml' '.github/scripts/ci-affected.sh'

  android-surface-lifecycle:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Install Android build SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_SDK_ROOT" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build lifecycle APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p shared/gcanvas/tests/android --no-daemon :app:assembleDebug
          test -f shared/gcanvas/tests/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Surface replacement lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash shared/gcanvas/tests/android/run-emulator-lifecycle.sh

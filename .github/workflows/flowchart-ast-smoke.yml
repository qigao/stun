name: Flowchart native AST smoke

# Fast feedback for parser changes. This compiles the repository's real Lemon
# grammar, re2c scanner and AST wrapper, not a second parser implementation.
# Full JSON golden and installed-SDK sanitizer checks remain in the
# Stun runtime conformance workflow.
# The published-SDK golden job already builds the same AST smoke target
# together with the full JSON test. Keep this workflow as an opt-in tool for
# isolating the grammar from SDK availability, not a duplicate PR check.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Flowchart change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Check latest PR update
        id: scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'charts/mermaid/flowchart/*' 'tools/lemon/*' \
            '.github/scripts/ci-affected.sh' \
            '.github/scripts/build-re2c-master.sh' \
            '.github/workflows/flowchart-ast-smoke.yml'

  parser:
    name: Linux C11 Lemon/re2c AST + ASan/UBSan
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Build grammar generator from upstream master
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build
          bash .github/scripts/build-re2c-master.sh
      - name: Configure production-source C11 parser harness
        shell: bash
        run: |
          cmake -S charts/mermaid/flowchart/tests/standalone \
            -B build/flowchart-ast-fast -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DSTUN_CI_SANITIZERS=ON
      - name: Generate parser and build AST smoke
        run: |
          cmake --build build/flowchart-ast-fast \
            --target stun_flowchart_ast_smoke --parallel 2
      - name: Execute actual AST and sanitizer checks
        run: |
          ctest --test-dir build/flowchart-ast-fast \
            -R '^stun_flowchart_ast_smoke$' \
            --no-tests=error --verbose --output-on-failure
      - name: Ensure tracked sources are unchanged
        run: git diff --exit-code
      - name: Preserve re2c source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re2c-master-${{ needs.changes.outputs.source_sha }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/stun-re2c-provenance.json

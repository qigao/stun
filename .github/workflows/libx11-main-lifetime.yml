name: libX11 development lifetime probe

on:
  pull_request:
  push:
    branches: [ci/libx11-main-lifetime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stun-libx11-main-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:fast_unwind_on_malloc=0:malloc_context_size=64
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  init-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: glfw/glfw
          ref: master
          path: .ci/glfw
          persist-credentials: false

      - name: Clone X.Org/XCB development trees and record exact provenance
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p .ci/x11-src build/x11-main-evidence

          clone_default_master() {
            name="$1"
            url="$2"
            dest=".ci/x11-src/$name"
            default_ref="$(git ls-remote --symref "$url" HEAD | awk '/^ref:/ {print $2; exit}')"
            test "$default_ref" = "refs/heads/master" || {
              echo "Unexpected development branch for $name: $default_ref" >&2
              exit 1
            }
            git clone --depth=1 --branch master "$url" "$dest"
            commit="$(git -C "$dest" rev-parse HEAD)"
            printf '%sRef=master\n%s=%s\n' "$name" "$name" "$commit" >> build/x11-main-evidence/provenance.txt
          }

          printf 'Stun=%s\nGLFWRef=master\nGLFW=%s\n'             "$EXPECTED_HEAD" "$(git -C .ci/glfw rev-parse HEAD)"             > build/x11-main-evidence/provenance.txt

          clone_default_master util_macros https://gitlab.freedesktop.org/xorg/util/macros.git
          clone_default_master xorgproto https://gitlab.freedesktop.org/xorg/proto/xorgproto.git
          clone_default_master xtrans https://gitlab.freedesktop.org/xorg/lib/libxtrans.git
          clone_default_master libXau https://gitlab.freedesktop.org/xorg/lib/libxau.git
          clone_default_master libXdmcp https://gitlab.freedesktop.org/xorg/lib/libXdmcp.git
          clone_default_master pthread_stubs https://gitlab.freedesktop.org/xcb/pthread-stubs.git
          clone_default_master xcb_proto https://gitlab.freedesktop.org/xcb/proto.git
          clone_default_master libxcb https://gitlab.freedesktop.org/xcb/libxcb.git
          clone_default_master libX11 https://gitlab.freedesktop.org/xorg/lib/libx11.git

          cat build/x11-main-evidence/provenance.txt

      - name: Build libX11 development-source closure with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             autoconf autoconf-archive automake libtool pkg-config m4             python3 make gcc g++ cmake ninja-build             xorg-dev xvfb xauth

          root="$RUNNER_TEMP/x11-main"
          mkdir -p "$root"
          export PATH="$root/bin:$PATH"
          export PKG_CONFIG_PATH="$root/lib/pkgconfig:$root/share/pkgconfig"
          export ACLOCAL="aclocal -I $root/share/aclocal"
          export CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address,undefined"

          build_module() {
            name="$1"
            src="$GITHUB_WORKSPACE/.ci/x11-src/$name"
            log="$GITHUB_WORKSPACE/build/x11-main-evidence/$name-build.log"
            (
              set -euo pipefail
              cd "$src"
              ./autogen.sh --prefix="$root"
              make -j2
              make install
              git diff --exit-code
            ) 2>&1 | tee "$log"
          }

          build_module util_macros
          build_module xorgproto
          build_module xtrans
          build_module libXau
          build_module libXdmcp
          build_module pthread_stubs
          build_module xcb_proto
          build_module libxcb
          build_module libX11

          find "$root" -maxdepth 3 -type f -o -type l | sort > build/x11-main-evidence/install-files.txt
          pkg-config --modversion x11 | tee build/x11-main-evidence/libx11-version.txt

          {
            echo "X11_ROOT=$root"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "LD_LIBRARY_PATH=$root/lib"
          } >> "$GITHUB_ENV"

      - name: Build GLFW master against development libX11
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$X11_ROOT/lib/pkgconfig:$X11_ROOT/share/pkgconfig"
          export CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address,undefined"

          cmake -S .ci/glfw -B build/x11-glfw -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_SHARED_LIBS=OFF             -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF             -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF             -DGLFW_BUILD_DOCS=OFF -DGLFW_INSTALL=ON             "-DCMAKE_INSTALL_PREFIX=$X11_ROOT"
          cmake --build build/x11-glfw --parallel 2
          cmake --install build/x11-glfw

          cat > build/x11-init-control.c <<'C'
          #include <GLFW/glfw3.h>
          #include <stdio.h>
          #include <stdlib.h>

          int main(int argc, char **argv) {
              int cycles = argc == 2 ? atoi(argv[1]) : 1;
              if (cycles != 1 && cycles != 4) return 2;
              for (int i = 0; i < cycles; ++i) {
                  if (!glfwInit()) return 3;
                  glfwTerminate();
                  puts("teardown=completed");
              }
              puts("application-checks=passed;");
              return 0;
          }
          C

          cc -std=c11 -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined             -I"$X11_ROOT/include" build/x11-init-control.c             "$X11_ROOT/lib/libglfw3.a" -ldl -lm -lpthread             -fsanitize=address,undefined -o build/x11-init-control

          readelf -d build/x11-init-control > build/x11-main-evidence/control-dynamic.txt
          sha256sum build/x11-init-control > build/x11-main-evidence/control.sha256

      - name: Execute init/terminate owner probe
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD LSAN_OPTIONS
          xvfb-run -a python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          evidence = Path("build/x11-main-evidence")
          binary = Path("build/x11-init-control").resolve(strict=True)
          env = os.environ.copy()
          env["LD_LIBRARY_PATH"] = os.environ["X11_ROOT"] + "/lib"

          leak_block_re = re.compile(
              r"(?:Direct|Indirect) leak of (?P<bytes>\d+) byte\(s\) in "
              r"(?P<objects>\d+) object\(s\) allocated from:\n"
              r"(?P<stack>(?:    #.*\n)+)"
          )
          rows = []
          for cycles in (1, 4):
              result = subprocess.run(
                  [str(binary), str(cycles)],
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=120,
              )
              log = result.stdout
              (evidence / f"init-{cycles}.log").write_text(log)
              blocks = []
              for match in leak_block_re.finditer(log):
                  blocks.append({
                      "bytes": int(match.group("bytes")),
                      "objects": int(match.group("objects")),
                      "stack": match.group("stack"),
                  })
              summary = re.findall(
                  r"SUMMARY: AddressSanitizer: (\d+) byte\(s\) leaked in (\d+) allocation\(s\)",
                  log,
              )
              row = {
                  "cycles": cycles,
                  "exit_code": result.returncode,
                  "completed": "application-checks=passed;" in log,
                  "teardowns": log.count("teardown=completed"),
                  "summary": summary,
                  "blocks": len(blocks),
                  "x11_locale_blocks": sum(
                      1 for b in blocks
                      if "XSupportsLocale" in b["stack"]
                      or "XSetLocaleModifiers" in b["stack"]
                      or "_Xlc" in b["stack"]
                      or "/libX11" in b["stack"]
                  ),
              }
              rows.append(row)
              print(json.dumps(row), flush=True)
              assert row["completed"] and row["teardowns"] == cycles, row
              assert "runtime error:" not in log
              assert "ERROR: AddressSanitizer:" not in log
              # LeakSanitizer is intentionally not suppressed. This probe may be RED;
              # the artifact is the owner evidence requested by #47.
          (evidence / "results.json").write_text(json.dumps(rows, indent=2) + "\n")
          assert len(rows) == 2
          PY

          git diff --exit-code
          for d in .ci/x11-src/*; do git -C "$d" diff --exit-code; done
          git -C .ci/glfw diff --exit-code

      - name: Preserve exact upstream owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libx11-main-lifetime-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/x11-main-evidence
          if-no-files-found: error

name: GraphLayout native algorithm qualification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'shared/layout/**'
      - 'charts/dotgraph/**'
      - 'charts/mermaid/flowchart/**'
      - 'charts/mermaid/mindmap/**'
      - 'charts/infographic/**'
      - 'vendor/CMakeLists.txt'
      - 'vendor/cola/**'
      - '.github/workflows/graphlayout-native.yml'
      - '.github/scripts/ci-affected.sh'
  push:
    branches: [master]
    paths:
      - 'shared/layout/**'
      - 'charts/dotgraph/**'
      - 'charts/mermaid/flowchart/**'
      - 'charts/mermaid/mindmap/**'
      - 'charts/infographic/**'
      - 'vendor/CMakeLists.txt'
      - 'vendor/cola/**'
      - '.github/workflows/graphlayout-native.yml'
      - '.github/scripts/ci-affected.sh'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: GraphLayout change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'shared/layout/*' 'charts/dotgraph/*' 'charts/mermaid/flowchart/src/flowchart_layout.cpp' 'charts/mermaid/flowchart/include/*' 'charts/mermaid/flowchart/CMakeLists.txt' \
            'charts/mermaid/mindmap/*' 'charts/infographic/*' 'vendor/CMakeLists.txt' 'vendor/cola/*' \
            '.github/workflows/graphlayout-native.yml' '.github/scripts/ci-affected.sh'

  graphlayout:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: gcc
          - os: ubuntu-24.04
            toolchain: clang
          - os: macos-15
            toolchain: appleclang
          - os: windows-2022
            toolchain: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Setup ccache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache ninja-build
          else
            brew install ccache ninja
          fi
      - name: Restore compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: graphlayout-${{ matrix.os }}-${{ matrix.toolchain }}-${{ hashFiles('shared/layout/**') }}
          restore-keys: |
            graphlayout-${{ matrix.os }}-${{ matrix.toolchain }}-
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S shared/layout -B build/graphlayout -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
          else
            extra=()
            if [[ '${{ matrix.toolchain }}' == 'clang' ]]; then extra+=(-DCMAKE_CXX_COMPILER=clang++); fi
            cmake -S shared/layout -B build/graphlayout -G Ninja -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "${extra[@]}"
          fi
      - name: Build
        run: cmake --build build/graphlayout --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/graphlayout -C Release --output-on-failure

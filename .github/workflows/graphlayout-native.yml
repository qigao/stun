name: GraphLayout native algorithm qualification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'shared/layout/**'
      - 'charts/dotgraph/**'
      - 'charts/mermaid/flowchart/**'
      - 'charts/mermaid/mindmap/**'
      - 'charts/infographic/**'
      - 'vendor/CMakeLists.txt'
      - 'vendor/cola/**'
      - '.github/workflows/graphlayout-native.yml'
      - '.github/actions/setup-ccache/**'
      - '.github/scripts/report-ccache.sh'
      - '.github/scripts/ci-affected.sh'
  push:
    branches: [master]
    paths:
      - 'shared/layout/**'
      - 'charts/dotgraph/**'
      - 'charts/mermaid/flowchart/**'
      - 'charts/mermaid/mindmap/**'
      - 'charts/infographic/**'
      - 'vendor/CMakeLists.txt'
      - 'vendor/cola/**'
      - '.github/workflows/graphlayout-native.yml'
      - '.github/actions/setup-ccache/**'
      - '.github/scripts/report-ccache.sh'
      - '.github/scripts/ci-affected.sh'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: GraphLayout change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'shared/layout/*' 'charts/dotgraph/*' 'charts/mermaid/flowchart/src/flowchart_layout.cpp' 'charts/mermaid/flowchart/include/*' 'charts/mermaid/flowchart/CMakeLists.txt' \
            'charts/mermaid/mindmap/*' 'charts/infographic/*' 'vendor/CMakeLists.txt' 'vendor/cola/*' \
            '.github/workflows/graphlayout-native.yml' '.github/scripts/ci-affected.sh' \
            '.github/actions/setup-ccache/*' '.github/scripts/report-ccache.sh'

  graphlayout:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: gcc
          - os: ubuntu-24.04
            toolchain: clang
          - os: macos-15
            toolchain: appleclang
          - os: windows-2022
            toolchain: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Activate real MSVC compiler toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install pinned ccache C/C++ compiler launcher
        uses: ./.github/actions/setup-ccache
        with:
          profile: graphlayout-${{ matrix.toolchain }}
          source_sha: ${{ needs.changes.outputs.source_sha }}
      - name: Require Ninja generator on all four native matrix entries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ninja-build
            elif [[ "$RUNNER_OS" == macOS ]]; then
              brew install ninja
            else
              echo "::error::Ninja is required for the Windows MSVC ccache compiler launcher"
              exit 1
            fi
          fi
          ninja --version
          if [[ "$RUNNER_OS" == Windows ]]; then
            command -v cl
          fi
      - name: Configure production GraphLayout algorithms under ccache
        shell: bash
        run: |
          set -euo pipefail
          # macOS ships Bash 3.2: with 'set -u', expanding an EMPTY
          # array via "${compiler_args[@]}" fails before CMake executes.
          # Stage the full command in a nonempty array on every matrix row.
          cmake_args=(-S shared/layout -B build/graphlayout -G Ninja
                      -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON)
          if [[ '${{ matrix.toolchain }}' == clang ]]; then
            cmake_args+=(-DCMAKE_CXX_COMPILER=clang++)
          elif [[ '${{ matrix.toolchain }}' == msvc ]]; then
            cmake_args+=(-DCMAKE_CXX_COMPILER=cl)
          fi
          cmake "${cmake_args[@]}"
      - name: Build real independent GraphLayout libraries and tests
        shell: bash
        run: cmake --build build/graphlayout --config Release --parallel 2
      - name: Run GraphLayout algorithm qualification
        shell: bash
        run: ctest --test-dir build/graphlayout -C Release --no-tests=error --output-on-failure
      # The first accepted AppleClang run populates a cold cache. Repeat on
      # a new exact HEAD with unchanged C++ sources to verify real RESTORED
      # compiler hits, independently from a successful dependency download.
      - name: Require ccache compilation evidence for exact toolchain
        shell: bash
        run: bash .github/scripts/report-ccache.sh graphlayout-${{ matrix.toolchain }}
      - name: Archive exact-head GraphLayout test and compiler-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphlayout-${{ matrix.toolchain }}-${{ needs.changes.outputs.source_sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/graphlayout/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/stun-ccache-stats-graphlayout-${{ matrix.toolchain }}.tsv

name: GraphLayout native algorithm qualification
on:
  pull_request:
    paths:
      - 'charts/graphlayout/**'
      - 'charts/dotgraph/**'
      - 'charts/mermaid/flowchart/**'
      - '.github/workflows/graphlayout-native.yml'
  push:
    paths:
      - 'charts/graphlayout/**'
      - '.github/workflows/graphlayout-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphlayout:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: gcc
          - os: ubuntu-24.04
            toolchain: clang
          - os: macos-15
            toolchain: appleclang
          - os: windows-2022
            toolchain: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup ccache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache ninja-build
          else
            brew install ccache ninja
          fi
      - name: Restore compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: graphlayout-${{ matrix.os }}-${{ matrix.toolchain }}-${{ hashFiles('charts/graphlayout/**') }}
          restore-keys: |
            graphlayout-${{ matrix.os }}-${{ matrix.toolchain }}-
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S charts/graphlayout -B build/graphlayout -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
          else
            extra=()
            if [[ '${{ matrix.toolchain }}' == 'clang' ]]; then extra+=(-DCMAKE_CXX_COMPILER=clang++); fi
            cmake -S charts/graphlayout -B build/graphlayout -G Ninja -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "${extra[@]}"
          fi
      - name: Build
        run: cmake --build build/graphlayout --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/graphlayout -C Release --output-on-failure

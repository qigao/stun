name: FlexUI Tango cross-platform headless

# Targeted native UI integration gate. Do not rebuild every renderer/diagram
# target on every unrelated PR. No desktop window, GPU, Mono or .NET SDK.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'flexUI/**'
      - 'flex/backends/tui/**'
      - 'flex/modules/**'
      - 'shared/markdown/**'
      - 'tango/**'
      - '.github/scripts/restore-flexui-tango-sdk.py'
      - '.github/scripts/tests/test_restore_flexui_tango_sdk.py'
      - '.github/workflows/flexui-tango-headless.yml'
      - '.github/actions/setup-ccache/**'
      - '.github/scripts/report-ccache.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: flexui-tango-cross-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci/full' && github.run_id || 'qualification' }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: FlexUI/Tango headless / ${{ matrix.os }}
    if: github.event.action != 'labeled' || github.event.label.name == 'ci/full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: macos-arm64
            triplet: arm64-osx
          - os: windows-latest
            rid: windows-x64
            triplet: x64-windows-static-md
    env:
      GH_TOKEN: ${{ github.token }}
      UTILS_SOURCE_SHA: 768e2b76f4ae40289a9360541e17fe60ebcbd0e9
      SDK_RID: ${{ matrix.rid }}
      VCPKG_TRIPLET: ${{ matrix.triplet }}
    steps:
      - name: Resolve exact PR head
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Qualify real ConPTY pipe transport before SDK restore
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'stun-conpty-transport.exe'
          & cl.exe /nologo /std:c++17 /EHsc "/Fe:$exe" "flexUI/tests/test_tui_win32_conpty.cpp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --oracle-selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install per-profile native C/C++ compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: flexui-tango
          source_sha: ${{ steps.source.outputs.sha }}

      - name: Verify immutable checkout and restore script tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          python .github/scripts/tests/test_restore_flexui_tango_sdk.py

      - name: Configure SDK and binary-cache paths
        shell: bash
        run: |
          set -euo pipefail
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Restore cached installed source SDK
        id: source_sdk_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/stun-markdown-sdk
          key: stun-source-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.UTILS_SOURCE_SHA }}-${{ hashFiles('.github/scripts/restore-flexui-tango-sdk.py') }}

      - uses: actions/setup-python@v5
        if: steps.source_sdk_cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install canonical SDK from immutable producer source
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/restore-flexui-tango-sdk.py \
            --build-source-sdk --sdk "$RUNNER_TEMP/stun-markdown-sdk" \
            --source-sha "$UTILS_SOURCE_SHA" --rid "$SDK_RID" --export-env

      - name: Retain completed source SDK before downstream qualification
        if: steps.source_sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/stun-markdown-sdk
          key: stun-source-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.UTILS_SOURCE_SHA }}-${{ hashFiles('.github/scripts/restore-flexui-tango-sdk.py') }}

      - name: Checkout existing vcpkg baseline (minimal headless ports only)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: .ci/vcpkg
          persist-credentials: false

      - name: Restore minimal native build dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: flexui-tango-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-b1b19307

      - name: Build/install only headless vcpkg ports
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$VCPKG_ROOT"
          if [[ "$RUNNER_OS" == Windows ]]; then
            vcpkg_root="$(cygpath -u "$VCPKG_ROOT")"
            (cd "$vcpkg_root" && cmd.exe //C bootstrap-vcpkg.bat -disableMetrics)
            vcpkg_bin="$vcpkg_root/vcpkg.exe"
          else
            "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
            vcpkg_bin="$vcpkg_root/vcpkg"
          fi
          "$vcpkg_bin" install --classic --triplet "$VCPKG_TRIPLET" \
            nlohmann-json pugixml stb freetype

      - name: Restore pinned native XML dependency builds
        id: xml_deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flexui-tango-xml-deps
          key: flexui-tango-xml-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flexUI/tests/xml-runtime-deps/CMakeLists.txt') }}

      - name: Build canonical Lexbor/Box2D/Tree-sitter versions
        if: steps.xml_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$VCPKG_ROOT"
          deps_root="$RUNNER_TEMP/flexui-tango-xml-deps"
          if [[ "$RUNNER_OS" == Windows ]]; then
            vcpkg_root="$(cygpath -m "$VCPKG_ROOT")"
            deps_root="$(cygpath -m "$deps_root")"
          fi
          compiler_args=(-DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=c++)
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler_args=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
          fi
          cmake -S flexUI/tests/xml-runtime-deps \
            -B build/flexui-tango-deps -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
            "${compiler_args[@]}" \
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg_root/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET" \
            "-DCMAKE_INSTALL_PREFIX=$deps_root"
          cmake --build build/flexui-tango-deps --config Release --parallel 2
          cmake --install build/flexui-tango-deps --config Release

      - uses: actions/checkout@v4
        with:
          repository: skvadrik/re2c
          ref: '4.5.1'
          path: .ci/re2c
          persist-credentials: false

      - name: Build native re2c code-generation tool
        shell: bash
        run: |
          set -euo pipefail
          compiler_args=(-DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=c++)
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler_args=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
          fi
          cmake -S .ci/re2c -B build/re2c-headless -G Ninja \
            "${compiler_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DRE2C_BUILD_RE2D=OFF \
            -DRE2C_BUILD_RE2GO=OFF -DRE2C_BUILD_RE2HS=OFF
          cmake --build build/re2c-headless --config Release --target re2c --parallel 2
          tool="$GITHUB_WORKSPACE/build/re2c-headless/re2c"
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool="$tool.exe"
          fi
          printf 'RE2C_TOOL=%s\n' "$tool" >> "$GITHUB_ENV"

      - name: Configure real FlexUI + Tango + C11 RichDoc
        shell: bash
        run: |
          set -euo pipefail
          native_path() {
            if [[ "$RUNNER_OS" == Windows ]]; then
              cygpath -m "$1"
            else
              printf '%s\n' "$1"
            fi
          }
          vcpkg_root="$VCPKG_ROOT"
          if [[ "$RUNNER_OS" == Windows ]]; then
            vcpkg_root="$(cygpath -u "$VCPKG_ROOT")"
          fi
          prefix="$(native_path "$SALTS_ROOT")"
          toolchain="$(native_path "$vcpkg_root/scripts/buildsystems/vcpkg.cmake")"
          stb_root="$(native_path "$vcpkg_root/installed/$VCPKG_TRIPLET/include")"
          deps_root="$(native_path "$RUNNER_TEMP/flexui-tango-xml-deps")"
          re2c="$(native_path "$RE2C_TOOL")"
          export SALTS_ROOT="$prefix"
          compiler_args=(-DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=c++)
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler_args=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
          fi
          cmake -S flexUI/tests/xml-runtime-standalone \
            -B build/flexui-tango-cross -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL \
            -DCMAKE_MAP_IMPORTED_CONFIG_DEBUG=Release \
            "${compiler_args[@]}" \
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" \
            "-DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET" \
            "-DCMAKE_PREFIX_PATH=$prefix;$deps_root" \
            "-DRE2C_EXECUTABLE=$re2c" \
            "-DSTB_INCLUDE_DIRS=$stb_root" \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSTUN_BUILD_TUI_STREAMING_DEMO=ON \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF

      - name: Build real Markdown and Tango integration binaries
        shell: bash
        run: |
          set -euo pipefail
          targets=(flex test_ui_jinja_xml stun_ui_core_test stun_markdown_adapter_test stun_markdown_tango_candidate_test test_plugin_abi test_plugin_host test_plugin_manifest test_plugin_create_unwind stun_gcanvas_window_host_source_compile test_ui_document test_desktop_application test_script_controller test_application_service_requests test_service_registry test_application_completion test_application_service_dispatcher chart_ui_test dotgraph_parser_test test_dotgraph_ui_xml test_markdown_widget test_flexui_tango_stream flexui_tui_streaming_demo)
          if [[ "$RUNNER_OS" == Windows ]]; then
            targets+=(test_tui_win32_console test_tui_win32_conpty)
          fi
          cmake --build build/flexui-tango-cross --config Debug \
            --target "${targets[@]}" --parallel 2
          # Install the actual Core/JinjaXml producer graph from this build.
          # No separately generated installer or test consumer.
          install_prefix="$RUNNER_TEMP/stun-flexui-sdk"
          if [[ "$RUNNER_OS" == Windows ]]; then
            install_prefix="$(cygpath -m "$install_prefix")"
          fi
          cmake --install build/flexui-tango-cross --config Debug \
            --component FlexUICore --prefix "$install_prefix"

      - name: Validate bounded POSIX PTY diagnostic trace reader
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s flexUI/tests \
            -p 'test_tui_streaming_pty_trace.py' -v

      - name: Run native Markdown, Streaming, demo and POSIX PTY conformance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="$(cygpath -w "$SALTS_ROOT/bin"):$PATH"
          else
            export DYLD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${DYLD_LIBRARY_PATH:-}"
          fi
          ctest --test-dir build/flexui-tango-cross -C Debug \
            --no-tests=error --output-on-failure --timeout 120 \
            -R "^(stun_ui_core_test|stun_markdown_adapter_test|stun_markdown_tango_candidate_test|ChartUiTest|DotGraph(Xml|Parser)Test|test_(ui_jinja_xml|ui_document|desktop_application|script_controller|application_service_requests|service_registry|application_completion|application_service_dispatcher|plugin_abi|plugin_host|plugin_manifest|plugin_create_unwind|markdown_widget|flexui_tango_stream)|tui_streaming_demo_(smoke|posix_pty|win32_console|win32_conpty(_plain)?))"

      - name: Repeat real POSIX PTY Home End and resize sessions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${DYLD_LIBRARY_PATH:-}"
          # Exercise the SAME real interactive application and strict
          # keyboard/SGR-wheel/SIGWINCH/restoration screen assertions.
          # An intermittent Home deadline is a failure, never a skipped
          # session or a synthetic substitute.
          ctest --test-dir build/flexui-tango-cross -C Debug \
            --no-tests=error --output-on-failure --timeout 65 \
            --repeat until-fail:5 \
            -R "^tui_streaming_demo_posix_pty$"

      - name: Repeat real virtual-spacer SIGWINCH after settled producer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${DYLD_LIBRARY_PATH:-}"
          # A process-directed SIGWINCH after the 48-message producer settles
          # must wake an otherwise idle UI Owner and render 52x16 physically.
          # Repeat the ORIGINAL strict six-second visible-cell assertion;
          # do not substitute a synthetic resize or relax the deadline.
          ctest --test-dir build/flexui-tango-cross -C Debug \
            --no-tests=error --output-on-failure --timeout 65 \
            --repeat until-fail:5 \
            -R "^tui_streaming_demo_posix_pty_virtual_spacers$"

      - name: Repeat uninstrumented real Win32 ConPTY sessions
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(cygpath -w "$SALTS_ROOT/bin"):$PATH"
          # Every session launches the unmodified interactive demo. The
          # host drives real 80x24 -> 52x16 ConPTY state, and assertions
          # fail closed on the first dropped title/footer/restoration.
          ctest --test-dir build/flexui-tango-cross -C Debug \
            --no-tests=error --output-on-failure --timeout 85 \
            --repeat until-fail:5 \
            -R "^tui_streaming_demo_win32_conpty_plain"

      - name: Require real ccache compiler invocations and report hit rate
        shell: bash
        run: bash .github/scripts/report-ccache.sh flexui-tango

      - name: Preserve exact-head cross-platform test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexui-tango-${{ matrix.rid }}-${{ steps.source.outputs.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stun-markdown-sdk/sdk-provenance.json
            build/flexui-tango-cross/Testing/Temporary/LastTest.log
            build/flexui-tango-cross/Testing/Temporary/CTestCostData.txt
            ${{ runner.temp }}/stun-ccache-stats-flexui-tango.tsv

name: gCanvas package contract

# Verify that each isolated Linux GLES and NDK cache restores the previous
# exact HEAD's compiler results; do not reuse host objects for Android.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "shared/gcanvas/**"
      - ".github/workflows/gcanvas-package-contract.yml"
      - ".github/actions/setup-ccache/**"
      - ".github/scripts/report-ccache.sh"
      - ".github/scripts/ci-affected.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Component change scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: bash .github/scripts/ci-affected.sh 'shared/gcanvas/*' '.github/workflows/gcanvas-package-contract.yml' '.github/actions/setup-ccache/*' '.github/scripts/report-ccache.sh' '.github/scripts/ci-affected.sh'

  gles-installed-consumer:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Install verified native GLES package compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: gcanvas-installed-consumer
          source_sha: ${{ needs.changes.outputs.source_sha }}

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libfreetype-dev libstb-dev libgles2-mesa-dev

      - name: Build and install GLES-only package
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/gcanvas-prefix"
          cmake -S shared/gcanvas -B build/gcanvas-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DSTB_INCLUDE_DIRS=/usr/include/stb \
            -DGCANVAS_BUILD_OPENGL=OFF \
            -DGCANVAS_BUILD_GLES=ON \
            -DGCANVAS_BUILD_ANDROID_EGL=OFF \
            -DGCANVAS_BUILD_VULKAN=OFF \
            -DGCANVAS_BUILD_SVG=OFF \
            -DGCANVAS_BUILD_WINDOW=OFF \
            -DGCANVAS_BUILD_TESTS=OFF \
            -DGCANVAS_BUILD_EXAMPLES=OFF
          test -f build/gcanvas-package/build.ninja
          grep -Fq ccache build/gcanvas-package/build.ninja
          cmake --build build/gcanvas-package --parallel 2
          cmake --install build/gcanvas-package
          echo "GCANVAS_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Verify installed target metadata
        shell: bash
        run: |
          set -euo pipefail
          targets="$(find "$GCANVAS_PREFIX" -name 'gCanvasTargets*.cmake' -print)"
          test -n "$targets"
          grep -R -q 'gCanvas::OpenGLES' "$GCANVAS_PREFIX"
          ! grep -R -i -E 'glad|glfw' "$GCANVAS_PREFIX/lib" "$GCANVAS_PREFIX/include"
          ! grep -R -E '/(usr|opt)/[^"; ]*libGLES(v2|v3)?[^"; ]*' "$GCANVAS_PREFIX/lib/cmake"

      - name: Build external find_package consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/consumer
          cat > build/consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(gcanvas_installed_consumer LANGUAGES CXX)
          find_package(gCanvas CONFIG REQUIRED)
          add_executable(gcanvas_installed_consumer main.cpp)
          target_compile_features(gcanvas_installed_consumer PRIVATE cxx_std_17)
          target_link_libraries(gcanvas_installed_consumer PRIVATE gCanvas::gCanvas)
          CMAKE
          cat > build/consumer/main.cpp <<'CPP'
          #include <gcanvas/backends/opengles.hpp>
          int main()
          {
              auto* factory = &gcanvas::opengles::create_context;
              return factory == nullptr ? 1 : 0;
          }
          CPP
          cmake -S build/consumer -B build/consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GCANVAS_PREFIX"
          grep -Fq ccache build/consumer-build/build.ninja
          cmake --build build/consumer-build --verbose
          build/consumer-build/gcanvas_installed_consumer
          readelf -d build/consumer-build/gcanvas_installed_consumer \
            > build/consumer-build/dynamic.txt
          ! grep -qi -E 'glad|glfw' build/consumer-build/dynamic.txt

      - name: Verify Android default contract is dependency-light
        shell: bash
        run: |
          set -euo pipefail
          cmake_file=shared/gcanvas/CMakeLists.txt
          grep -q 'set(_GCANVAS_BUILD_OPENGL_DEFAULT OFF)' "$cmake_file"
          grep -q 'set(_GCANVAS_BUILD_GLES_DEFAULT ON)' "$cmake_file"
          grep -q 'set(_GCANVAS_BUILD_ANDROID_EGL_DEFAULT ON)' "$cmake_file"
          grep -q 'set(_GCANVAS_BUILD_VULKAN_DEFAULT OFF)' "$cmake_file"
          grep -q 'set(_GCANVAS_BUILD_SVG_DEFAULT OFF)' "$cmake_file"
          grep -q 'set(_GCANVAS_BUILD_WINDOW_DEFAULT OFF)' "$cmake_file"
          grep -q 'set(_GCANVAS_GLES_LINK_LIBRARY GLESv3)' "$cmake_file"
          grep -q 'PRIVATE EGL android' "$cmake_file"

      - name: Require native GLES producer and installed-consumer compiler cache
        shell: bash
        run: bash .github/scripts/report-ccache.sh gcanvas-installed-consumer

      - name: Archive native GLES package and compiler-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcanvas-installed-consumer-${{ needs.changes.outputs.source_sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/consumer-build/dynamic.txt
            build/consumer-build/CMakeCache.txt
            ${{ runner.temp }}/stun-ccache-stats-gcanvas-installed-consumer.tsv

  android-default-cmake:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Install verified ARM64 Android NDK compiler-output cache
        uses: ./.github/actions/setup-ccache
        with:
          profile: gcanvas-android-arm64
          source_sha: ${{ needs.changes.outputs.source_sha }}

      - name: Install compile-contract headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libfreetype-dev libstb-dev

      - name: Resolve installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          test -d "$ndk"
          echo "GCANVAS_ANDROID_NDK=$ndk" >> "$GITHUB_ENV"

      - name: Provide cross-compile Freetype header contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android-cmake-modules
          cat > build/android-cmake-modules/FindFreetype.cmake <<'CMAKE'
          set(Freetype_FOUND TRUE)
          set(FREETYPE_FOUND TRUE)
          if(NOT TARGET Freetype::Freetype)
            add_library(Freetype::Freetype INTERFACE IMPORTED)
            set_target_properties(Freetype::Freetype PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "/usr/include/freetype2")
          endif()
          CMAKE

      - name: Configure Android defaults with the NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake -S shared/gcanvas -B build/gcanvas-android -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=$GCANVAS_ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            "-DCMAKE_MODULE_PATH=$GITHUB_WORKSPACE/build/android-cmake-modules" \
            -DSTB_INCLUDE_DIRS=/usr/include/stb \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGCANVAS_BUILD_TESTS=OFF \
            -DGCANVAS_BUILD_EXAMPLES=OFF

      - name: Build Android default renderer and presentation targets
        shell: bash
        run: |
          set -euo pipefail
          test -f build/gcanvas-android/build.ninja
          grep -Fq ccache build/gcanvas-android/build.ninja
          cmake --build build/gcanvas-android --parallel 2 --verbose \
            --target gcanvas_opengles gcanvas_android_egl

          cache=build/gcanvas-android/CMakeCache.txt
          grep -q 'GCANVAS_BUILD_OPENGL:BOOL=OFF' "$cache"
          grep -q 'GCANVAS_BUILD_GLES:BOOL=ON' "$cache"
          grep -q 'GCANVAS_BUILD_ANDROID_EGL:BOOL=ON' "$cache"
          grep -q 'GCANVAS_BUILD_VULKAN:BOOL=OFF' "$cache"
          grep -q 'GCANVAS_BUILD_SVG:BOOL=OFF' "$cache"
          grep -q 'GCANVAS_BUILD_WINDOW:BOOL=OFF' "$cache"

          commands=build/gcanvas-android/compile_commands.json
          grep -Eq -- '--target=aarch64(-none)?-linux-android[0-9]*' "$commands"
          ! grep -qi -E 'glad|glfw' "$commands"

      - name: Require real Android NDK C/C++ compiler-cache statistics
        shell: bash
        run: bash .github/scripts/report-ccache.sh gcanvas-android-arm64

      - name: Archive NDK target-contract and compiler-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcanvas-android-arm64-${{ needs.changes.outputs.source_sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/gcanvas-android/compile_commands.json
            build/gcanvas-android/CMakeCache.txt
            ${{ runner.temp }}/stun-ccache-stats-gcanvas-android-arm64.tsv

name: Public dependency compile contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci/full' && github.run_id || 'qualification' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci/full'
    name: Public provider contract scope
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.run_head.outputs.sha }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Resolve immutable Actions run head
        id: run_head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ && ! "$sha" =~ ^0+$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'RunHead=%s\n' "$sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run_head.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ steps.run_head.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Classify latest PR update
        id: scope
        shell: bash
        run: |
          bash .github/scripts/ci-affected.sh \
            'flex/*' 'flexUI/*' 'ui_core/*' 'shared/markdown/*' \
            'tools/md/*' '.ci/*' 'cmake/*' 'CMakeLists.txt' \
            '.github/workflows/public-dependency-contract.yml' \
            '.github/scripts/ci-affected.sh'

  # Fast repository-wide parser-ownership gate on every PR. The existing
  # native released-SDK conformance remains mandatory; static checks alone
  # cannot establish parser or runtime correctness.
  markdownwidget-single-c11-parser:
    needs: changes
    name: Repository sole C11 parser contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Stun source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false

      - name: Verify immutable Stun checkout
        shell: bash
        env:
          EXPECTED_STUN_SHA: ${{ needs.changes.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_STUN_SHA"
      - name: Validate incremental PR scope detection
        run: python3 .github/scripts/tests/test_ci_affected.py

      - name: Execute existing CI policy unit tests
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test_ci_required_matrix.py
          python3 .github/scripts/tests/test_verify_exact_head_ci.py

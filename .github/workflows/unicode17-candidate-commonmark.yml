name: Unicode 17 released SDK CommonMark 652 (Draft)

# Exact released Salts.Native 2.3.0-rc.17 SDK only, with tag/source and actual
# six-RID NuGet SHA256 provenance. No QA SDK fallback or parser cutover.
on:
  push:
    branches:
      - draft/markdown-unicode17-abi-consumer-206-354-540

permissions:
  contents: read
  actions: read

jobs:
  installed-c11-652:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:fast_unwind_on_malloc=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout exact experimental Stun head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download and attest immutable published Salts.Native rc.17
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v2.3.0-rc.17"
          source_sha="6d6fd387cb245be8d7b0d866f9babad026a26832"
          package_name="Salts.Native.2.3.0-rc.17.nupkg"
          digest="dfda2bb9fbbbbf8b13f8ba941d3b4eb302814fd90da5869c6b22111f322e68c3"
          test "$(gh api "repos/qigao/salts/git/ref/tags/$tag" --jq '.object.type')" = commit
          test "$(gh api "repos/qigao/salts/git/ref/tags/$tag" --jq '.object.sha')" = "$source_sha"
          test "$(gh api "repos/qigao/salts/releases/tags/$tag" --jq '.draft')" = false
          test "$(gh api "repos/qigao/salts/releases/tags/$tag" --jq '.prerelease')" = true
          test "$(gh api "repos/qigao/salts/releases/tags/$tag" --jq '.target_commitish')" = "$source_sha"
          released_digest="$(gh api "repos/qigao/salts/releases/tags/$tag" \
            --jq '.assets[] | select(.name == "Salts.Native.2.3.0-rc.17.nupkg") | .digest')"
          test "$released_digest" = "sha256:$digest"
          mkdir -p "$RUNNER_TEMP/salts-rc17-public"
          gh release download "$tag" --repo qigao/salts \
            --pattern "$package_name" --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/salts-rc17-public"
          package="$RUNNER_TEMP/salts-rc17-public/$package_name"
          test -s "$package"
          printf '%s  %s\n' "$digest" "$package" | sha256sum --check -
          test "$(awk '$2 ~ /Salts.Native[.]2[.]3[.]0-rc[.]17[.]nupkg$/ {print $1}' \
            "$RUNNER_TEMP/salts-rc17-public/SHA256SUMS")" = "$digest"
          echo "SALTS_RC17_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "SALTS_RC17_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "SALTS_RC17_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Audit official six-RID ABI and reject mismatched release identities
        shell: bash
        run: |
          set -euo pipefail
          command -v nm
          if ! command -v llvm-objdump; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
          python3 ui_core/tests/verify_salts_native_unicode_sdk.py \
            --package "$SALTS_RC17_PACKAGE" \
            --version 2.3.0-rc.17 \
            --source-sha "$SALTS_RC17_SHA" \
            --header-sha256 effe759a1a69c08e1e5bf5e0aeb0e68f99861d1bd73a7c32b5b71d4f1f8b2666 \
            --package-sha256 "$SALTS_RC17_DIGEST" \
            --report build/salts-unicode17-rc17-release-proof.json
          if python3 ui_core/tests/verify_salts_native_unicode_sdk.py \
            --package "$SALTS_RC17_PACKAGE" \
            --version 2.3.0 \
            --source-sha "$SALTS_RC17_SHA" \
            --header-sha256 effe759a1a69c08e1e5bf5e0aeb0e68f99861d1bd73a7c32b5b71d4f1f8b2666 \
            --package-sha256 "$SALTS_RC17_DIGEST" \
            > build/reject-wrong-version.log 2>&1; then
            echo "ERROR: published rc.17 accepted an incorrect version" >&2
            exit 1
          fi
          grep -Fq "NuGet version mismatch" build/reject-wrong-version.log
          if python3 ui_core/tests/verify_salts_native_unicode_sdk.py \
            --package "$SALTS_RC17_PACKAGE" \
            --version 2.3.0-rc.17 \
            --source-sha 414f43362d95fa9c04a520a6be1c28a5e6a8a1fd \
            --header-sha256 effe759a1a69c08e1e5bf5e0aeb0e68f99861d1bd73a7c32b5b71d4f1f8b2666 \
            --package-sha256 "$SALTS_RC17_DIGEST" \
            > build/reject-qa-source.log 2>&1; then
            echo "ERROR: published rc.17 accepted the old QA source SHA" >&2
            exit 1
          fi
          grep -Fq "NuGet RepositoryCommit differs" build/reject-qa-source.log

      - name: Extract only published installed Linux x64 SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SALTS_RC17_PACKAGE" "$RUNNER_TEMP/salts-rc17-extracted" <<'PY'
          import sys,zipfile
          from pathlib import Path
          archive=Path(sys.argv[1]); root=Path(sys.argv[2])
          with zipfile.ZipFile(archive) as pkg:
              paths=[name for name in pkg.namelist() if name.startswith("sdk/linux-x64/")]
              assert paths, "No Linux x64 SDK in published NuGet"
              for name in paths:
                  pkg.extract(name, root)
          PY
          sdk="$RUNNER_TEMP/salts-rc17-extracted/sdk/linux-x64"
          test -f "$sdk/lib/cmake/Salts/SaltsConfig.cmake"
          grep -Fx "commit=$SALTS_RC17_SHA" "$sdk/salts-sdk-manifest.txt"
          grep -Fx 'version=2.3.0-rc.17' "$sdk/salts-sdk-manifest.txt"
          echo "SALTS_RC17_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Build strict installed-SDK C11 under ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cmake -S ui_core -B build/unicode17-qa -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc \
            "-DCMAKE_PREFIX_PATH=$SALTS_RC17_ROOT" \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON -DBUILD_TESTING=ON \
            '-DCMAKE_C_FLAGS=-std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build/unicode17-qa --parallel 2
          ctest --test-dir build/unicode17-qa --no-tests=error \
            --output-on-failure --timeout 120

      - name: Independent 652-row official CommonMark SPEC and SAFE diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/stun-unicode17-oracle"
          py="$RUNNER_TEMP/stun-unicode17-oracle/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-cache-dir cmarkgfm mistune
          "$py" -m pip freeze
          renderer="$GITHUB_WORKSPACE/build/unicode17-qa/tests/stun_markdown_html_dump"
          "$py" ui_core/tests/survey_commonmark_spec.py \
            --renderer "$renderer" --spec tools/md/test/spec.txt \
            --render-policy spec --report build/unicode17-qa/spec-652.json
          "$py" ui_core/tests/survey_commonmark_spec.py \
            --renderer "$renderer" --spec tools/md/test/spec.txt \
            --report build/unicode17-qa/safe-652.json
          "$py" ui_core/tests/compare_cmarkgfm_html.py \
            --renderer "$renderer" --report build/unicode17-qa/gfm-independent.json
          "$py" ui_core/tests/oracle_legacy_list_table.py \
            --renderer "$renderer" \
            --report build/unicode17-qa/gfm-root-list-table-229.json
          "$py" - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("ui_core/tests")
          b=json.loads((root/"commonmark_0_31_2_spec_baseline.json").read_text())
          s=json.loads(Path("build/unicode17-qa/spec-652.json").read_text())
          rows=s["cases"]
          assert len(rows)==652
          digest=hashlib.sha256(json.dumps(
              [(r["id"],r["markdown"],r["official_expected_html"]) for r in rows],
              ensure_ascii=False,separators=(",",":")
          ).encode("utf-8")).hexdigest()
          assert digest==b["official_fixture_sha256"], "official corpus changed"
          actual={int(r["id"][-4:]) for r in rows if r["native_matches_official"]}
          baseline=set(b["qualified_official_ids"])
          lost=sorted(baseline-actual)
          gained=sorted(actual-baseline)
          print(f"SPEC exact={len(actual)}/652 baseline={len(baseline)} lost={lost} gained={gained}")
          assert not lost, f"prior SPEC regressions: {lost}"
          assert gained==[206,354,540], f"unqualified/new cases: {gained}"
          assert len(actual)==652, f"still missing: {sorted(set(range(1,653))-actual)}"
          sb=json.loads((root/"commonmark_0_31_2_baseline.json").read_text())
          safe=json.loads(Path("build/unicode17-qa/safe-652.json").read_text())
          sr=safe["cases"]
          assert len(sr)==652
          safe_digest=hashlib.sha256(json.dumps(
              [(r["id"],r["markdown"],r["official_expected_html"]) for r in sr],
              ensure_ascii=False,separators=(",",":")
          ).encode("utf-8")).hexdigest()
          assert safe_digest==sb["official_fixture_sha256"]==digest, "SAFE corpus drift"
          safe_actual={int(r["id"][-4:]) for r in sr if r["native_matches_official"]}
          safe_baseline=set(sb["qualified_official_ids"])
          safe_lost=sorted(safe_baseline-safe_actual)
          safe_gained=sorted(safe_actual-safe_baseline)
          print(f"SAFE exact={len(safe_actual)}/652 baseline={len(safe_baseline)} lost={safe_lost} gained={safe_gained}")
          assert not safe_lost, f"prior SAFE regressions: {safe_lost}"
          assert safe_gained==[206,354,540], f"SAFE additional matches: {safe_gained}"
          assert len(safe_actual)==576
          PY

      - name: Upload raw candidate proof and both policy surveys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stun-unicode17-qa-commonmark
          path: |
            build/salts-unicode17-rc17-release-proof.json
            build/unicode17-qa/spec-652.json
            build/unicode17-qa/safe-652.json
            build/unicode17-qa/gfm-independent.json
            build/unicode17-qa/gfm-root-list-table-229.json
            build/unicode17-qa/Testing/Temporary/LastTest.log
          if-no-files-found: warn

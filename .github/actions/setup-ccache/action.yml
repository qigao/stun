name: Verified ccache compiler launcher
description: Installs pinned, checksum-verified ccache and restores per-platform compiler output cache.
inputs:
  profile:
    description: Isolated native build profile (different CI jobs do not evict each other).
    required: true
  source_sha:
    description: Exact 40-character native source commit; used to save an immutable cache snapshot.
    required: true
runs:
  using: composite
  steps:
    - name: Download checksum-verified ccache 4.14.2 using curl
      shell: bash
      run: |
        set -euo pipefail
        version=4.14.2
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            asset="ccache-$version-linux-x86_64-glibc.tar.gz"
            digest=b1f7fbb60ee24b80a6abae09ec4fcc6554fbf98c933c9bd25a3f53ab685fc00b ;;
          macOS/ARM64)
            asset="ccache-$version-darwin.tar.gz"
            digest=cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc ;;
          Windows/X64)
            asset="ccache-$version-windows-x86_64.zip"
            digest=6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84 ;;
          *)
            echo "::error::No verified ccache binary for $RUNNER_OS/$RUNNER_ARCH"
            exit 1 ;;
        esac
        [[ "${{ inputs.source_sha }}" =~ ^[0-9a-f]{40}$ ]]
        tools="$RUNNER_TEMP/stun-ccache-tools"
        if [[ "$RUNNER_OS" == Windows ]]; then
          tools="$(cygpath -u "$tools")"
        fi
        mkdir -p "$tools/unpacked" "$tools/bin"
        archive="$tools/$asset"
        curl --fail --silent --show-error --location --retry 3 \
          --proto '=https' --proto-redir '=https' \
          --connect-timeout 15 --max-time 180 \
          "https://github.com/ccache/ccache/releases/download/v$version/$asset" \
          --output "$archive.part"
        mv "$archive.part" "$archive"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$archive" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
        fi
        if [[ "$actual" != "$digest" ]]; then
          echo "::error::ccache release checksum mismatch: $asset"
          exit 1
        fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          zip="$(cygpath -w "$archive")"
          dest="$(cygpath -w "$tools/unpacked")"
          powershell.exe -NoProfile -NonInteractive -Command \
            "Expand-Archive -LiteralPath '$zip' -DestinationPath '$dest' -Force"
        else
          tar -xzf "$archive" -C "$tools/unpacked"
        fi
        binary="$(find "$tools/unpacked" -type f \( -name ccache -o -name ccache.exe \) -print -quit)"
        test -n "$binary"
        if [[ "$RUNNER_OS" == Windows ]]; then
          cp "$binary" "$tools/bin/ccache.exe"
          echo "$(cygpath -w "$tools/bin")" >> "$GITHUB_PATH"
        else
          cp "$binary" "$tools/bin/ccache"
          chmod +x "$tools/bin/ccache"
          echo "$tools/bin" >> "$GITHUB_PATH"
        fi
        echo "CCACHE_DIR=$RUNNER_TEMP/stun-ccache/${{ inputs.profile }}" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=750M" >> "$GITHUB_ENV"
        echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
        # CMake 3.17+ initializes the compiler launcher from these two env
        # variables for EVERY fresh Ninja C/C++ configure (including subprojects).
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
    - name: Restore compiler output cache (not dependency packages)
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/stun-ccache/${{ inputs.profile }}
        key: stun-ccache-v1-4.14.2-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.source_sha }}
        restore-keys: |
          stun-ccache-v1-4.14.2-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Verify launcher and reset run-local statistics only
      shell: bash
      run: |
        set -euo pipefail
        command -v ccache
        ccache --version
        ccache --zero-stats
        echo "ccache directory: $CCACHE_DIR"
        echo "C compiler launcher: $CMAKE_C_COMPILER_LAUNCHER"
        echo "C++ compiler launcher: $CMAKE_CXX_COMPILER_LAUNCHER"

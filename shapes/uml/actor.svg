<svg width="80" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="40" cy="20" r="12" fill="none" stroke="#424242" stroke-width="2"/>
  <!-- Body -->
  <line x1="40" y1="32" x2="40" y2="70" stroke="#424242" stroke-width="2"/>
  <!-- Arms -->
  <line x1="15" y1="45" x2="65" y2="45" stroke="#424242" stroke-width="2"/>
  <!-- Legs -->
  <line x1="40" y1="70" x2="20" y2="95" stroke="#424242" stroke-width="2"/>
  <line x1="40" y1="70" x2="60" y2="95" stroke="#424242" stroke-width="2"/>
  <!-- Name -->
  <text x="40" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">{{actorName}}</text>
</svg>

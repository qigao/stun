<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Table border -->
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="#616161" stroke-width="2"/>
  
  <!-- Vertical divider -->
  <line x1="100" y1="5" x2="100" y2="95" stroke="#616161" stroke-width="2"/>
  
  <!-- Horizontal divider -->
  <line x1="5" y1="50" x2="195" y2="50" stroke="#616161" stroke-width="2"/>
  
  <!-- Cell backgrounds -->
  <rect x="5" y="5" width="95" height="45" fill="#E3F2FD"/>
  <rect x="100" y="5" width="95" height="45" fill="#E3F2FD"/>
  <rect x="5" y="50" width="95" height="45" fill="#FFFFFF"/>
  <rect x="100" y="50" width="95" height="45" fill="#FFFFFF"/>
  
  <!-- Cell text -->
  <text x="52" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">{{cell_0_0}}</text>
  <text x="147" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">{{cell_0_1}}</text>
  <text x="52" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">{{cell_1_0}}</text>
  <text x="147" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">{{cell_1_1}}</text>
</svg>

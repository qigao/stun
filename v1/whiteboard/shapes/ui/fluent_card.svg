<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fluent 2 Card with acrylic effect -->
  <rect x="10" y="15" width="80" height="70" fill="white" stroke="#E1DFDD" stroke-width="1" rx="8"/>
  <!-- Subtle gradient overlay for acrylic -->
  <rect x="10" y="15" width="80" height="70" fill="url(#acrylic)" opacity="0.05" rx="8"/>
  <!-- Header -->
  <rect x="15" y="20" width="40" height="8" fill="#323130" rx="2"/>
  <!-- Content -->
  <rect x="15" y="35" width="70" height="4" fill="#E1DFDD" rx="2"/>
  <rect x="15" y="45" width="60" height="4" fill="#E1DFDD" rx="2"/>
  <rect x="15" y="55" width="50" height="4" fill="#E1DFDD" rx="2"/>
  <defs>
    <linearGradient id="acrylic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
</svg>

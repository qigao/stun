<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar body -->
  <rect x="15" y="25" width="70" height="60" fill="white" stroke="#9E9E9E" stroke-width="2" rx="3"/>
  <!-- Calendar header -->
  <rect x="15" y="25" width="70" height="15" fill="#F44336" stroke="none" rx="3"/>
  <!-- Binding rings -->
  <rect x="30" y="20" width="5" height="10" fill="#9E9E9E" rx="2"/>
  <rect x="65" y="20" width="5" height="10" fill="#9E9E9E" rx="2"/>
  <!-- Date grid -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="25" y1="60" x2="75" y2="60" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="25" y1="70" x2="75" y2="70" stroke="#E0E0E0" stroke-width="1"/>
</svg>
